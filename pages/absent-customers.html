<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="/css/main.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Absent Customers - Susu9</title>
<script src="/js/theme-preload.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
<style>
.selected-row { background-color:#d3d3d3; }
.flatpickr-input{cursor:pointer;background:#fff;}
/* Searchable Game dropdown — same reliable custom widget already used for
   Customer search on hisab-summary.html (no jQuery/Select2 involved, so
   none of that old plugin's positioning bugs). */
.game-wrap{position:relative;}
.game-box{display:flex;align-items:center;gap:6px;}
.game-box .game-inp{flex:1;}
.game-drop{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #888;border-radius:4px;box-shadow:0 6px 20px rgba(0,0,0,.15);max-height:240px;overflow-y:auto;z-index:999;display:none;}
.game-drop.open{display:block;}
.game-item{padding:9px 12px;cursor:pointer;font-size:.85rem;font-weight:700;color:var(--text);text-transform:capitalize;border-bottom:1px solid #eee;}
.game-item:hover, .game-item.focused {
  background: #bbf7d0 !important;
  color: #064e3b !important;
  outline: 2px solid #16a34a !important;
  outline-offset: -2px;
  font-weight: 800 !important;
}
.game-item:hover *, .game-item.focused * {
  color: #064e3b !important;
}
/* Bolder, higher-contrast text — visual only, no behavior change */
.content .form-group label,.content>.row label{font-weight:800!important;color:var(--text)!important;font-size:.78rem!important;margin-bottom:3px!important;display:block;}
.content .card-title{font-weight:800!important;color:var(--text)!important;font-size:1.05rem!important;}
.content .form-control{font-weight:700!important;color:var(--text)!important;background:#fff!important;border:1px solid #888!important;padding:.32rem .6rem!important;height:auto!important;font-size:.85rem!important;}
/* Compact filter row — smaller fields/spacing, less scroll to get through it */
.content .card-body{padding:10px 16px!important;}
.content .row{margin-left:-6px;margin-right:-6px;}
.content .row>[class*="col"]{padding-left:6px;padding-right:6px;}
/* Data grid: bold bordered header, scroll internally instead of the whole page */
#gridWrap{overflow-x:auto;overflow-y:auto;max-height:calc(100vh - 260px);}
#gridWrap table{border-collapse:collapse!important;width:100%!important;}
#gridWrap th{background:#d9d9d9!important;border:1px solid #999!important;font-weight:800!important;color:#000!important;padding:8px 14px!important;font-size:.85rem!important;position:sticky;top:0;}
#gridWrap tbody tr:hover:not(.selected-row){outline:2px solid #16a34a!important;outline-offset:-2px;}
#gridWrap tbody tr:hover:not(.selected-row) td{background:#bbf7d0!important;}
#gridWrap tbody tr.selected-row td{background:#d3d3d3!important;}
/* Vendor theme reserves 62px above .content for a second header row this
   app doesn't render — page-scoped so it doesn't affect other pages. */
.main-panel>.content{margin-top:50px!important;padding-top:8px!important;}
</style>
</head>
<body>

<div class="content">
  <div class="row">
    <div class="col-md-12" style="margin-top:0px;">
      <div class="card">
        <div class="card-body">
          <div class="row" style="align-items:flex-end;">
            <div class="col-md-3">
              <div class="form-group">
                <label for="txtStartDate">Date</label>
                <div style="position: relative; display: flex; align-items: center;">
                  <input type="text" class="form-control" id="txtStartDate" placeholder="dd/mm/yyyy"
                    style="padding-right: 36px;" onfocus="this.select()">
                  <button type="button" id="btnDateCal" aria-label="Open Calendar" tabindex="-1"
                    style="position: absolute; right: 0; top: 0; bottom: 0; width: 36px; border: none; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #555; padding: 0;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                  </button>
                </div>
              </div>
            </div>
            <div class="col-md-3">
              <div class="form-group">
                <label for="gameSearch">Game</label>
                <div class="game-wrap" id="gameWrap">
                  <div class="game-box">
                    <input type="text" class="form-control game-inp" id="gameSearch"
                      placeholder="Select Game" autocomplete="off"
                      oninput="onGameInput()" onfocus="onGameFocus()" onkeydown="onGameKey(event)">
                  </div>
                  <div class="game-drop" id="gameDrop"></div>
                </div>
                <input type="hidden" id="gameSelection" value="">
              </div>
            </div>
            <div class="col-md-3">
              <div class="form-group">
                <button class="btn btn-success" id="btnSearch" onclick="bindGrid()">Search</button>
              </div>
            </div>
          </div>
        </div>
        <div class="table-responsive" id="gridWrap">
          <table cellpadding="4" style="text-transform:capitalize;text-align:center;">
            <thead>
              <tr>
                <th>SRNo</th>
                <th>Customer</th>
                <th>Mobile</th>
              </tr>
            </thead>
            <tbody id="bodyGrid">
              <tr><td colspan="3">Date aur Game select karke Search karo</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script>
async function init() {
  const u = await initPage('absent-customers');
  if (!u) return;
  if (u.SubUID) { window.location.href = '/pages/home.html'; return; }

  initDatePicker();
  // ASPX: BindDropDown → GetAllGames SP
  await loadGames();
  // ASPX: BindLastedDate()
  await setLatestDate();
}

function parseDmy(s) {
  if (!s) return new Date();
  if (s instanceof Date) return s;
  const str = String(s).trim();
  const dmy = str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if (dmy) {
    let p1 = parseInt(dmy[1], 10), p2 = parseInt(dmy[2], 10), yr = parseInt(dmy[3], 10);
    if (p2 > 12 && p1 <= 12) return new Date(yr, p1 - 1, p2);
    return new Date(yr, p2 - 1, p1);
  }
  const m8 = str.match(/^(\d{2})(\d{2})(\d{4})/);
  if (m8) return new Date(parseInt(m8[3], 10), parseInt(m8[2], 10) - 1, parseInt(m8[1], 10));
  const mo = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
  const mAlpha = str.match(/^(\d{1,2})[\/\s-]([A-Za-z]{3})[\/\s-](\d{4})/);
  if (mAlpha) {
    const mKey = mAlpha[2].charAt(0).toUpperCase() + mAlpha[2].slice(1,3).toLowerCase();
    return new Date(parseInt(mAlpha[3], 10), mo[mKey] !== undefined ? mo[mKey] : 0, parseInt(mAlpha[1], 10));
  }
  const iso = str.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if (iso) return new Date(parseInt(iso[1], 10), parseInt(iso[2], 10) - 1, parseInt(iso[3], 10));
  const d = new Date(str);
  return isNaN(d.getTime()) ? new Date() : d;
}

function formatToDdMmYyyy(s) {
  if (!s) return '';
  if (/^\d{2}\/\d{2}\/\d{4}$/.test(s)) return s;
  const mAlpha = String(s).match(/^(\d{1,2})[\/\s-]([A-Za-z]{3})[\/\s-](\d{4})/);
  if (mAlpha) {
    const mo = {Jan:'01',Feb:'02',Mar:'03',Apr:'04',May:'05',Jun:'06',Jul:'07',Aug:'08',Sep:'09',Oct:'10',Nov:'11',Dec:'12'};
    const mKey = mAlpha[2].charAt(0).toUpperCase() + mAlpha[2].slice(1,3).toLowerCase();
    const d = String(parseInt(mAlpha[1], 10)).padStart(2, '0');
    return `${d}/${mo[mKey] || '01'}/${mAlpha[3]}`;
  }
  const iso = String(s).match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if (iso) {
    const d = String(parseInt(iso[3], 10)).padStart(2, '0');
    const m = String(parseInt(iso[2], 10)).padStart(2, '0');
    return `${d}/${m}/${iso[1]}`;
  }
  return s;
}

function bindAutoSlashDate(id, onDateApplied) {
  const el = document.getElementById(id);
  if (!el) return;

  el.addEventListener('keydown', function(e) {
    if (e.key === 'Backspace') {
      const val = this.value;
      const start = this.selectionStart;
      const end = this.selectionEnd;
      if (start === end && (start === 3 || start === 6) && val[start - 1] === '/') {
        e.preventDefault();
        this.value = val.slice(0, start - 2) + val.slice(start);
        this.setSelectionRange(start - 2, start - 2);
        return;
      }
    }
    if (e.key === 'Enter') {
      e.preventDefault();
      const nextEl = document.getElementById('gameSearch');
      if (nextEl) nextEl.focus();
    }
  }, true);

  el.addEventListener('input', function(e) {
    if (e.inputType && e.inputType.startsWith('delete')) return;
    const prevPos = this.selectionEnd;
    const prevVal = this.value;
    let v = prevVal.replace(/\D/g, '').slice(0, 8);
    let formatted = '';
    if (v.length > 4) formatted = v.slice(0, 2) + '/' + v.slice(2, 4) + '/' + v.slice(4);
    else if (v.length > 2) formatted = v.slice(0, 2) + '/' + v.slice(2);
    else if (v.length === 2) formatted = v + '/';
    else formatted = v;
    if (v.length === 4 && formatted.length === 5) formatted += '/';

    if (this.value !== formatted) {
      this.value = formatted;
      if (prevPos >= prevVal.length) {
        this.setSelectionRange(formatted.length, formatted.length);
      } else {
        let slashesBefore = (formatted.slice(0, prevPos).match(/\//g) || []).length;
        let oldSlashesBefore = (prevVal.slice(0, prevPos).match(/\//g) || []).length;
        let newPos = prevPos + (slashesBefore - oldSlashesBefore);
        this.setSelectionRange(newPos, newPos);
      }
    }

    if (v.length === 8) {
      const fp = this._flatpickr;
      if (fp) fp.setDate(formatted, false, 'd/m/Y');
      if (typeof onDateApplied === 'function') onDateApplied(formatted);
    }
  });

  el.addEventListener('change', function() {
    if (this.value) {
      let v = this.value.replace(/\D/g, '').slice(0, 8);
      if (v.length === 8) this.value = v.slice(0, 2) + '/' + v.slice(2, 4) + '/' + v.slice(4);
      const fp = this._flatpickr;
      if (fp) fp.setDate(this.value, false, 'd/m/Y');
      if (typeof onDateApplied === 'function') onDateApplied(this.value);
    }
  });
}

function bindCalButton(btnId, inputId) {
  const btn = document.getElementById(btnId);
  if (btn) {
    btn.onclick = function(e) {
      e.preventDefault();
      e.stopPropagation();
      const el = document.getElementById(inputId);
      const fp = el ? el._flatpickr : null;
      if (fp) {
        if (fp.isOpen) fp.close();
        else fp.open();
      }
    };
  }
}

function initDatePicker() {
  const el = document.getElementById('txtStartDate');
  if (!el || el._flatpickr) return;

  const fpCfg = {
    dateFormat: 'd/m/Y',
    clickOpens: false,
    allowInput: true,
    disableMobile: true,
    parseDate: parseDmy,
    formatDate: function (date) {
      const d = String(date.getDate()).padStart(2, '0');
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const y = date.getFullYear();
      return `${d}/${m}/${y}`;
    },
    onClose: function(selectedDates, dateStr, instance) {
      if (instance && instance.element) instance.element.blur();
    },
    onChange: function(sel, dateStr, instance) {
      if (instance && instance.element) instance.element.blur();
      el.value = dateStr;
      bindGrid();
    }
  };

  try {
    flatpickr(el, fpCfg);
  } catch(e) {
    console.warn('Flatpickr init error:', e);
  }

  bindCalButton('btnDateCal', 'txtStartDate');
  bindAutoSlashDate('txtStartDate', () => {
    const nextEl = document.getElementById('gameSearch');
    if (nextEl) nextEl.focus();
  });
}

function setDate(str) {
  const val = formatToDdMmYyyy(str);
  const el = document.getElementById('txtStartDate');
  if (el) {
    el.value = val;
    if (el._flatpickr) {
      el._flatpickr.setDate(parseDmy(val), false, 'd/m/Y');
    }
  }
}

function fmtDate(d) {
  if (!d) return '';
  const dd = String(d.getDate()).padStart(2, '0');
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  return `${dd}/${mm}/${d.getFullYear()}`;
}

async function setLatestDate() {
  try {
    const r = await API.get('/api/hisab/latest-date');
    if (r?.success && r.data) {
      setDate(r.data);
    } else { setToday(); }
  } catch(e) { setToday(); }
}
function setToday() {
  const d = new Date(Date.now()+5.5*3600000);
  setDate(fmtDate(d));
}

let allGames = [];
let gameFocusIdx = -1;

async function loadGames() {
  const r = await API.get('/api/game');
  allGames = r?.data || [];
}

// ── Searchable Game dropdown (same pattern as hisab-summary.html's
//    Customer search — plain JS, no jQuery/Select2) ──
function onGameFocus() { showGameDrop(document.getElementById('gameSearch').value); }
function onGameInput() {
  document.getElementById('gameSelection').value = '';
  gameFocusIdx = -1;
  showGameDrop(document.getElementById('gameSearch').value);
}
function showGameDrop(q) {
  const drop = document.getElementById('gameDrop');
  const list = q
    ? allGames.filter(g => (g.GameName||'').toLowerCase().includes(q.toLowerCase()))
    : allGames;
  if (!list.length) {
    drop.innerHTML = '<div class="game-none">No game found</div>';
  } else {
    drop.innerHTML = list.map((g, i) =>
      `<div class="game-item" data-gid="${g.GID}" data-name="${(g.GameName||'').replace(/"/g,'&quot;')}" data-idx="${i}"
        onmousedown="selectGame('${g.GID}','${(g.GameName||'').replace(/'/g,"\\'")}')">
        ${g.GameName || g.GID}
      </div>`
    ).join('');
  }
  drop.classList.add('open');
}
function selectGame(gid, name) {
  document.getElementById('gameSearch').value = name;
  document.getElementById('gameSelection').value = gid;
  document.getElementById('gameDrop').classList.remove('open');
  gameFocusIdx = -1;
  document.getElementById('btnSearch').focus();
}
function onGameKey(e) {
  const drop = document.getElementById('gameDrop');
  const items = drop.querySelectorAll('.game-item');
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    gameFocusIdx = Math.min(gameFocusIdx + 1, items.length - 1);
    items.forEach((el, i) => el.classList.toggle('focused', i === gameFocusIdx));
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    gameFocusIdx = Math.max(gameFocusIdx - 1, 0);
    items.forEach((el, i) => el.classList.toggle('focused', i === gameFocusIdx));
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (gameFocusIdx >= 0 && items[gameFocusIdx]) {
      const el = items[gameFocusIdx];
      selectGame(el.dataset.gid, el.dataset.name);
    } else if (items.length === 1) {
      const el = items[0];
      selectGame(el.dataset.gid, el.dataset.name);
    }
  } else if (e.key === 'Escape') {
    document.getElementById('gameDrop').classList.remove('open');
  }
}
document.addEventListener('click', e => {
  if (!document.getElementById('gameWrap')?.contains(e.target))
    document.getElementById('gameDrop')?.classList.remove('open');
});

// ── btnSearch_Click → BindGrid() ──
// ASPX: only if txtStartDate.Text != "" AND GameSelection.SelectedIndex > 0
async function bindGrid() {
  const date   = document.getElementById('txtStartDate').value;
  const gameID = document.getElementById('gameSelection').value;
  const tbody  = document.getElementById('bodyGrid');

  if (!date || !gameID) {
    tbody.innerHTML = '<tr><td colspan="3">Date aur Game dono select karo</td></tr>';
    return;
  }

  tbody.innerHTML = '<tr><td colspan="3">Loading...</td></tr>';

  const r = await API.get(`/api/home/absent-customers?date=${encodeURIComponent(date)}&gameID=${gameID}`);
  if (!r?.success || !r.data?.length) {
    tbody.innerHTML = '<tr><td colspan="3">No Data Found!</td></tr>';
    return;
  }

  tbody.innerHTML = r.data.map((row,i) => `
    <tr onclick="selectRow(this)" tabindex="0" onkeydown="arrowNav(event,this,${i})">
      <td>${i+1}</td>
      <td>${row.CustomerName||''}</td>
      <td>${row.Mobile||''}</td>
    </tr>`).join('');
}

function selectRow(row) {
  document.querySelectorAll('#bodyGrid tr').forEach(r=>r.classList.remove('selected-row'));
  row.classList.add('selected-row');
}
function arrowNav(e,row,idx) {
  const rows=document.querySelectorAll('#bodyGrid tr');
  if(e.key==='ArrowUp'&&idx>0){e.preventDefault();rows[idx-1].focus();selectRow(rows[idx-1]);}
  else if(e.key==='ArrowDown'&&idx<rows.length-1){e.preventDefault();rows[idx+1].focus();selectRow(rows[idx+1]);}
}

init();
</script>
</body>
</html>
