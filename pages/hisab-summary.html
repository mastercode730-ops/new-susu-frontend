<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="/css/main.css">
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hisab Summary - Susu9</title>
<script src="/js/theme-preload.js"></script>
<style>
.selected-row{background-color:#d3d3d3;}
tbody tr{cursor:pointer;}
.emsg{padding:24px;text-align:center;color:var(--muted);font-size:.85rem;}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px;}
@keyframes spin{to{transform:rotate(360deg);}}
.flatpickr-input{cursor:pointer;background:#F8F9FA;}

/* Customer inline search — page-specific autocomplete widget, no Atlantis equivalent */
.cust-wrap{position:relative;}
.cust-box{display:flex;align-items:center;gap:6px;}
.cust-box .cust-inp{flex:1;}
.cust-clear{cursor:pointer;color:var(--muted);font-size:.8rem;display:none;padding:2px 6px;}
.cust-drop{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:4px;box-shadow:0 6px 20px rgba(0,0,0,.12);max-height:220px;overflow-y:auto;z-index:999;display:none;}
.cust-drop.open{display:block;}
.cust-item{padding:8px 12px;cursor:pointer;font-size:.86rem;border-bottom:1px solid #f3f3f3;}
.cust-item:hover, .cust-item.focused {
  background: #bbf7d0 !important;
  color: #064e3b !important;
  outline: 2px solid #16a34a !important;
  outline-offset: -2px;
  font-weight: 800 !important;
}
.cust-item:hover *, .cust-item.focused * {
  color: #064e3b !important;
}
/* Bolder, higher-contrast text — visual only, no behavior change */
.content .form-group label{font-weight:800!important;color:var(--text)!important;}
.content .card-title{font-weight:800!important;color:var(--text)!important;font-size:1.05rem!important;}
.content .form-control{font-weight:700!important;color:var(--text)!important;background:#fff!important;border:1px solid #888!important;}
/* Compact, well-aligned filter box — smaller fields, tighter spacing */
.content .card-header{padding:8px 16px!important;}
.content .card-action{border-bottom:1px solid #999;}
.content .card-body{padding:10px 16px!important;}
.content .card-action{padding:8px 16px!important;}
.content .form-group{margin-bottom:8px!important;}
.content .form-group label{font-size:.78rem!important;margin-bottom:3px!important;display:block;}
.content .form-control{padding:.32rem .6rem!important;height:auto!important;font-size:.85rem!important;}
.content .form-control::placeholder{font-weight:700!important;color:#555!important;opacity:1!important;}
.content select.form-control,.content select.form-control option{font-weight:800!important;color:#000!important;font-size:.88rem!important;}
.cust-item{font-weight:800!important;color:#000!important;font-size:.9rem!important;}
.cust-none{font-weight:700!important;color:#000!important;}
/* Flatpickr calendar popup — bold, clear text throughout */
.flatpickr-weekday{font-weight:800!important;color:#000!important;}
.flatpickr-day{font-weight:800!important;color:#000!important;}
.flatpickr-day.flatpickr-disabled,.flatpickr-day.prevMonthDay,.flatpickr-day.nextMonthDay,.flatpickr-day.notAllowed{color:#999!important;font-weight:700!important;}
.flatpickr-day.today{font-weight:900!important;}
.flatpickr-current-month .cur-month,.flatpickr-current-month input.cur-year{font-weight:800!important;color:#000!important;}
.flatpickr-months .flatpickr-month,.flatpickr-current-month{font-weight:800!important;}
/* Data grid: bold bordered header instead of the faint Bootstrap table look */
.content table{border-collapse:collapse!important;}
.content table th{background:#d9d9d9!important;border:1px solid #999!important;font-weight:800!important;color:#000!important;padding:8px 14px!important;font-size:.85rem!important;}
.content table td{border:1px solid #ccc!important;padding:7px 14px!important;font-weight:900!important;color:#000!important;font-size:.92rem!important;}
.content table tbody tr:hover:not(.selected-row){outline:2px solid #16a34a!important;outline-offset:-2px;}
.content table tbody tr:hover:not(.selected-row) td{background:#bbf7d0!important;}
.table-responsive{overflow-x:auto;}
.content table{width:100%!important;min-width:1150px;}
/* Vendor theme reserves 62px above .content for a second header row this
   app doesn't render — page-scoped so it doesn't affect other pages. */
.main-panel>.content{margin-top:50px!important;padding-top:8px!important;}

/* Mobile Optimization: minimal scrolling, compact side-by-side fields */
@media (max-width: 767px) {
  /* Slim blue header with hamburger */
  .main-header,
  .logo-header {
    height: 38px !important;
    min-height: 38px !important;
    padding: 0 8px !important;
  }
  .logo-header {
    display: flex !important;
    align-items: center !important;
    position: relative !important;
  }
  .logo-header .navbar-toggler {
    order: 1 !important;
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    height: 38px !important;
    width: 38px !important;
    padding: 0 !important;
    margin: 0 auto 0 0 !important;
    border: none !important;
    background: transparent !important;
    line-height: 1 !important;
  }
  .logo-header .navbar-toggler-icon {
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    width: 100% !important;
    height: 100% !important;
    line-height: 1 !important;
  }
  .logo-header .navbar-toggler-icon i {
    font-size: 1.3rem !important;
    line-height: 1 !important;
    color: #fff !important;
    display: block !important;
  }
  .logo-header .logo {
    position: absolute !important;
    left: 50% !important;
    transform: translateX(-50%) !important;
    font-size: 1.05rem !important;
    letter-spacing: 1.5px !important;
    line-height: 38px !important;
    margin: 0 !important;
    padding: 0 !important;
    color: #fff !important;
  }
  .logo-header .more {
    order: 3 !important;
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    height: 38px !important;
    width: 36px !important;
    padding: 0 !important;
    margin: 0 !important;
    background: transparent !important;
    border: none !important;
    line-height: 1 !important;
  }
  .logo-header .more i {
    font-size: 1.15rem !important;
    line-height: 1 !important;
    color: #fff !important;
  }

  .main-panel > .content {
    margin-top: 40px !important;
    padding: 4px 6px !important;
  }
  .content .card {
    margin-bottom: 6px !important;
    border-radius: 6px !important;
  }
  .content .card-body {
    padding: 6px 8px !important;
  }
  .content .card-action {
    padding: 6px 8px !important;
    display: flex !important;
    gap: 8px !important;
  }
  .content .card-action .btn {
    flex: 1 !important;
    padding: 5px 8px !important;
    font-size: 0.82rem !important;
    height: 32px !important;
    font-weight: 800 !important;
    margin: 0 !important;
  }
  .content .card-header {
    padding: 4px 8px !important;
  }
  .content .card-title {
    font-size: 0.88rem !important;
    margin: 0 !important;
    line-height: 1.2 !important;
  }
  .content .row {
    margin-left: -4px !important;
    margin-right: -4px !important;
  }
  .content .row > [class*="col-"] {
    padding-left: 4px !important;
    padding-right: 4px !important;
  }
  .content .form-group {
    margin-bottom: 4px !important;
  }
  .content .form-group label {
    font-size: 0.72rem !important;
    margin-bottom: 2px !important;
    line-height: 1.2 !important;
  }
  .content .form-control {
    padding: 0.2rem 0.45rem !important;
    height: 30px !important;
    font-size: 0.78rem !important;
    border-radius: 4px !important;
  }
  .content select.form-control {
    height: 30px !important;
    font-size: 0.78rem !important;
    padding: 0.2rem 0.35rem !important;
  }
  .cust-box .cust-inp {
    height: 30px !important;
  }
  .table-responsive {
    max-height: calc(100vh - 215px) !important;
    overflow-y: auto !important;
    overflow-x: auto !important;
    -webkit-overflow-scrolling: touch;
  }
  .content table th {
    padding: 6px 10px !important;
    font-size: 0.78rem !important;
  }
  .content table td {
    padding: 5px 10px !important;
    font-size: 0.82rem !important;
  }
}
</style>
</head>
<body>

<div class="content">
  <div class="row">
    <div class="col-md-12">
      <div class="card">
        <div class="card-body">
          <div class="row">
            <div class="col-6 col-md-3">
              <div class="form-group">
                <label for="txtStartDate">From Date</label>
                <div style="position: relative; display: flex; align-items: center;">
                  <input type="text" class="form-control" id="txtStartDate" placeholder="dd/mm/yyyy"
                    style="padding-right: 36px;" onfocus="this.select()">
                  <button type="button" id="btnStartDateCal" aria-label="Open Calendar" tabindex="-1"
                    style="position: absolute; right: 0; top: 0; bottom: 0; width: 36px; border: none; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #555; padding: 0;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                  </button>
                </div>
              </div>
            </div>
            <div class="col-6 col-md-3">
              <div class="form-group">
                <label for="txtEndDate">To Date</label>
                <div style="position: relative; display: flex; align-items: center;">
                  <input type="text" class="form-control" id="txtEndDate" placeholder="dd/mm/yyyy"
                    style="padding-right: 36px;" onfocus="this.select()">
                  <button type="button" id="btnEndDateCal" aria-label="Open Calendar" tabindex="-1"
                    style="position: absolute; right: 0; top: 0; bottom: 0; width: 36px; border: none; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #555; padding: 0;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                  </button>
                </div>
              </div>
            </div>
            <div class="col-6 col-md-3">
              <div class="form-group">
                <label for="gameSelection">Game</label>
                <select class="form-control" id="gameSelection" onchange="document.getElementById('customerSelection').focus()">
                  <option value="">All Game</option>
                </select>
              </div>
            </div>
            <div class="col-6 col-md-3">
              <div class="form-group">
                <label for="custSearch">Customer</label>
                <div class="cust-wrap" id="custWrap">
                  <div class="cust-box">
                    <input type="text" class="form-control cust-inp" id="custSearch"
                      placeholder="All Customer"
                      autocomplete="off"
                      oninput="onCustInput()"
                      onfocus="onCustFocus()"
                      onkeydown="onCustKey(event)">
                    <span class="cust-clear" id="custClear" onclick="clearCust()">&times;</span>
                  </div>
                  <div class="cust-drop" id="custDrop"></div>
                </div>
                <input type="hidden" id="customerSelection" value="">
              </div>
            </div>
          </div>
        </div>
        <div class="card-action">
          <button class="btn btn-success" id="btnSearch" onclick="bindGrid()">Search</button>
          <button class="btn btn-success" onclick="exportExcel()">Export To Excel</button>
        </div>
        <div class="card-header">
          <div class="card-title">Summary</div>
        </div>
        <div class="table-responsive">
          <table cellpadding="4" style="text-transform:capitalize;text-align:center;">
            <thead>
              <tr>
                <th>Customer</th><th>Game</th><th>Rates</th>
                <th>T_Sale</th><th>D_Sale</th><th>A_Sale</th><th>Comm</th>
                <th>O_Dara</th><th>O_Akhar</th><th>Win_Amt</th>
                <th>Hissa</th><th>Balance</th><th>Result</th>
              </tr>
            </thead>
            <tbody id="summaryBody">
              <tr><td colspan="13" class="emsg">Search karo data dekhne ke liye</td></tr>
            </tbody>
            <tfoot id="summaryFoot" style="display:none;">
              <tr>
                <td></td><td></td><td>Total</td>
                <td id="ftTotal"></td><td id="ftDSale"></td><td id="ftASale"></td><td id="ftComm"></td>
                <td id="ftODara"></td><td id="ftOAkhar"></td><td id="ftWin"></td>
                <td id="ftPati"></td><td id="ftBalance"></td><td>Result</td>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script>
let myUID = null, tableData = [], allCustomers = [], custFocusIdx = -1, lastQuery = null;

async function init() {
  const u = await initPage('hisab-summary');
  if (!u) return;
  myUID = u.UID;

  initDatePicker();
  await Promise.all([loadGames(), loadCustomers()]);
  setToday();

  const p = new URLSearchParams(location.search);
  if (p.get('UID') && p.get('Date')) {
    const d = new Date(p.get('Date'));
    const fmtd = fmtDate(d);
    setDates(fmtd);
    // URL se customer pre-select karo
    const uid = p.get('UID');
    document.getElementById('customerSelection').value = uid;
    const cust = allCustomers.find(c => String(c.UID) === String(uid));
    if (cust) {
      document.getElementById('custSearch').value = cust.CustomerName;
      document.getElementById('custClear').style.display = '';
    }
    await bindGrid();
  }
}

function setDates(d) {
  const val = formatToDdMmYyyy(d);
  ['txtStartDate', 'txtEndDate'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.value = val;
    if (el._flatpickr) {
      el._flatpickr.setDate(val, false, 'd/m/Y');
    }
  });
}

function setToday() {
  const d = fmtDate(new Date());
  setDates(d);
}

async function loadGames() {
  try {
    const r = await API.get('/api/game');
    const sel = document.getElementById('gameSelection');
    sel.innerHTML = '<option value="">All Game</option>';
    (r?.data||[]).forEach(g => sel.innerHTML += `<option value="${g.GID}">${g.GameName}</option>`);
    const p = new URLSearchParams(location.search);
    if (p.get('GID')) sel.value = p.get('GID');
  } catch(e) {}
}

async function loadCustomers() {
  try {
    const r = await API.get('/api/hisab/customers');
    allCustomers = (r?.data || []).sort((a, b) =>
      (a.CustomerName || '').localeCompare(b.CustomerName || '')
    );
  } catch(e) { allCustomers = []; }
}

// ── Customer inline search ──────────────────────────
function onCustFocus() {
  showCustDrop(document.getElementById('custSearch').value);
}
function onCustInput() {
  document.getElementById('customerSelection').value = '';
  document.getElementById('custClear').style.display = document.getElementById('custSearch').value ? '' : 'none';
  custFocusIdx = -1;
  showCustDrop(document.getElementById('custSearch').value);
}
function showCustDrop(q) {
  const drop = document.getElementById('custDrop');
  const list = q
    ? allCustomers.filter(c => (c.CustomerName||'').toLowerCase().includes(q.toLowerCase()))
    : allCustomers;
  if (!list.length) {
    drop.innerHTML = '<div class="cust-none">No customer found</div>';
  } else {
    const items = [{ UID: '', CustomerName: 'All Customer' }, ...list].slice(0, 20);
    drop.innerHTML = items.map((c, i) =>
      `<div class="cust-item" data-uid="${c.UID}" data-name="${(c.CustomerName||'').replace(/"/g,'&quot;')}" data-idx="${i}"
        onmousedown="selectCust('${c.UID}','${(c.CustomerName||'').replace(/'/g,"\\'")}')">
        ${c.CustomerName || 'All Customer'}
      </div>`
    ).join('');
  }
  drop.classList.add('open');
}
function selectCust(uid, name) {
  document.getElementById('custSearch').value = uid ? name : '';
  document.getElementById('customerSelection').value = uid;
  document.getElementById('custClear').style.display = uid ? '' : 'none';
  document.getElementById('custDrop').classList.remove('open');
  custFocusIdx = -1;
  if (uid) document.getElementById('btnSearch').focus();
}
function clearCust() {
  document.getElementById('custSearch').value = '';
  document.getElementById('customerSelection').value = '';
  document.getElementById('custClear').style.display = 'none';
  document.getElementById('custDrop').classList.remove('open');
  document.getElementById('custSearch').focus();
}
function onCustKey(e) {
  const drop = document.getElementById('custDrop');
  const items = drop.querySelectorAll('.cust-item');
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    custFocusIdx = Math.min(custFocusIdx + 1, items.length - 1);
    items.forEach((el, i) => el.classList.toggle('focused', i === custFocusIdx));
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    custFocusIdx = Math.max(custFocusIdx - 1, 0);
    items.forEach((el, i) => el.classList.toggle('focused', i === custFocusIdx));
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (custFocusIdx >= 0 && items[custFocusIdx]) {
      const el = items[custFocusIdx];
      selectCust(el.dataset.uid, el.dataset.name);
    } else if (items.length === 1) {
      const el = items[0];
      selectCust(el.dataset.uid, el.dataset.name);
    } else {
      document.getElementById('custDrop').classList.remove('open');
      bindGrid();
    }
  } else if (e.key === 'Escape') {
    document.getElementById('custDrop').classList.remove('open');
  }
}
document.addEventListener('click', e => {
  if (!document.getElementById('custWrap')?.contains(e.target))
    document.getElementById('custDrop')?.classList.remove('open');
});

async function bindGrid() {
  const tbody = document.getElementById('summaryBody');
  tbody.innerHTML = `<tr><td colspan="13" class="emsg"><span class="spin"></span> Loading...</td></tr>`;
  document.getElementById('summaryFoot').style.display = 'none';

  const startDate = document.getElementById('txtStartDate').value;
  const endDate   = document.getElementById('txtEndDate').value;
  const gid       = document.getElementById('gameSelection').value;
  const cid       = document.getElementById('customerSelection').value;
  lastQuery = { startDate, endDate, gid, cid };

  try {
    const r = await API.get(
      `/api/hisab/summary?startDate=${encodeURIComponent(startDate)}&endDate=${encodeURIComponent(endDate)}&gid=${gid}&cid=${cid}`
    );
    if (!r?.success || !r.data?.length) {
      tbody.innerHTML = '<tr><td colspan="13" class="emsg">No Data Found!</td></tr>';
      tableData = [];
    } else {
      tableData = r.data;
      renderTable(tableData);
    }
    resetCustSearchReady();
  } catch(e) {
    tbody.innerHTML = '<tr><td colspan="13" class="emsg">Error loading</td></tr>';
  }
}

// Search complete hote hi customer box khaali karke agla naam type karne ke liye ready kar do
function resetCustSearchReady() {
  document.getElementById('custSearch').value = '';
  document.getElementById('customerSelection').value = '';
  document.getElementById('custClear').style.display = 'none';
  document.getElementById('custDrop').classList.remove('open');
}

function renderTable(data) {
  document.getElementById('summaryBody').innerHTML = data.map((row,i) => `
    <tr onclick="selectRow(this)" tabindex="0" onkeydown="arrowNav(event,this,${i})">
      <td>${(row.CustomerName || row.Mobile || '').replace(/\s+\d{4,5}$/, '')}</td><td>${row.GameName||''}</td><td>${row.Rates||''}</td>
      <td>${row.Total_Amount||0}</td><td>${row.D_Sale||0}</td><td>${row.A_Sale||0}</td>
      <td>${row.Commision||0}</td><td>${row.O_Dara||0}</td><td>${row.O_Akhar||0}</td>
      <td>${row.WinAmount||0}</td><td>${row.Pati||0}</td><td>${row.Balance||0}</td>
      <td>${row.Result||''}</td>
    </tr>`).join('');

  const s = f => Math.round(data.reduce((a,r)=>a+(parseFloat(r[f])||0),0));
  document.getElementById('ftTotal').textContent   = s('Total_Amount');
  document.getElementById('ftDSale').textContent   = s('D_Sale');
  document.getElementById('ftASale').textContent   = s('A_Sale');
  document.getElementById('ftComm').textContent    = s('Commision');
  document.getElementById('ftODara').textContent   = s('O_Dara');
  document.getElementById('ftOAkhar').textContent  = s('O_Akhar');
  document.getElementById('ftWin').textContent     = s('WinAmount');
  document.getElementById('ftPati').textContent    = s('Pati');
  document.getElementById('ftBalance').textContent = s('Balance');
  document.getElementById('summaryFoot').style.display = '';
}

function selectRow(row) {
  document.querySelectorAll('#summaryBody tr').forEach(r=>r.classList.remove('selected-row'));
  row.classList.add('selected-row');
}
function arrowNav(e,row,idx) {
  const rows = document.querySelectorAll('#summaryBody tr');
  if(e.key==='ArrowUp'&&idx>0){e.preventDefault();rows[idx-1].focus();selectRow(rows[idx-1]);}
  else if(e.key==='ArrowDown'&&idx<rows.length-1){e.preventDefault();rows[idx+1].focus();selectRow(rows[idx+1]);}
}

async function exportExcel() {
  if (!tableData.length || !lastQuery) { showToast('Pehle search karo',true); return; }
  const custSel  = document.getElementById('customerSelection');
  const gameSel  = document.getElementById('gameSelection');
  const { startDate, endDate, gid, cid } = lastQuery;
  let fileName = 'AllSummary';
  if (custSel.selectedIndex>0 && gameSel.selectedIndex>0)
    fileName = gameSel.options[gameSel.selectedIndex].text + custSel.options[custSel.selectedIndex].text;
  else if (custSel.selectedIndex>0) fileName = custSel.options[custSel.selectedIndex].text;
  else if (gameSel.selectedIndex>0) fileName = gameSel.options[gameSel.selectedIndex].text;
  fileName += startDate.replace(/\//g,'');

  const url = `/api/hisab/summary/export?startDate=${encodeURIComponent(startDate)}&endDate=${encodeURIComponent(endDate)}&gid=${gid}&cid=${cid}&fileName=${encodeURIComponent(fileName)}`;
  const a = document.createElement('a'); a.href=url; a.download=fileName+'.xlsx'; a.click();
}

function fmtDate(d) {
  if (!d) return '';
  const dd = String(d.getDate()).padStart(2, '0');
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  return `${dd}/${mm}/${d.getFullYear()}`;
}

function parseDmy(s) {
  if (!s) return new Date();
  if (s instanceof Date) return s;
  const p = String(s).split('/');
  if (p.length === 3) return new Date(parseInt(p[2],10), parseInt(p[1],10)-1, parseInt(p[0],10));
  return new Date(s);
}

function formatToDdMmYyyy(s) {
  if (!s) return '';
  if (/^\d{2}\/\d{2}\/\d{4}$/.test(s)) return s;
  const mAlpha = s.match(/^(\d{1,2})[\/\s-]([A-Za-z]{3})[\/\s-](\d{4})/);
  if (mAlpha) {
    const mo = {Jan:'01',Feb:'02',Mar:'03',Apr:'04',May:'05',Jun:'06',Jul:'07',Aug:'08',Sep:'09',Oct:'10',Nov:'11',Dec:'12'};
    const mKey = mAlpha[2].charAt(0).toUpperCase() + mAlpha[2].slice(1,3).toLowerCase();
    const d = String(parseInt(mAlpha[1], 10)).padStart(2, '0');
    return `${d}/${mo[mKey] || '01'}/${mAlpha[3]}`;
  }
  const iso = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if (iso) {
    const d = String(parseInt(iso[3], 10)).padStart(2, '0');
    const m = String(parseInt(iso[2], 10)).padStart(2, '0');
    return `${d}/${m}/${iso[1]}`;
  }
  return s;
}

function bindAutoSlashDate(id, onDateApplied) {
  const el = document.getElementById(id);
  if (!el) return;

  el.addEventListener('keydown', function(e) {
    if (e.key === 'Backspace') {
      const val = this.value;
      const start = this.selectionStart;
      const end = this.selectionEnd;
      // If cursor is immediately after a slash, delete both the slash and the preceding digit
      if (start === end && (start === 3 || start === 6) && val[start - 1] === '/') {
        e.preventDefault();
        this.value = val.slice(0, start - 2) + val.slice(start);
        this.setSelectionRange(start - 2, start - 2);
        return;
      }
    }
    if (e.key === 'Enter') {
      e.preventDefault();
      if (id === 'txtStartDate') {
        const toEl = document.getElementById('txtEndDate');
        if (toEl) { toEl.focus(); toEl.select?.(); }
      } else if (id === 'txtEndDate') {
        const gEl = document.getElementById('gameSelection');
        if (gEl) gEl.focus();
      }
    }
  }, true);

  el.addEventListener('input', function(e) {
    if (e.inputType && e.inputType.startsWith('delete')) {
      return;
    }
    const prevPos = this.selectionEnd;
    const prevVal = this.value;
    let v = prevVal.replace(/\D/g, '').slice(0, 8);
    let formatted = '';
    if (v.length > 4) {
      formatted = v.slice(0, 2) + '/' + v.slice(2, 4) + '/' + v.slice(4);
    } else if (v.length > 2) {
      formatted = v.slice(0, 2) + '/' + v.slice(2);
    } else if (v.length === 2) {
      formatted = v + '/';
    } else {
      formatted = v;
    }
    if (v.length === 4 && formatted.length === 5) {
      formatted += '/';
    }
    if (this.value !== formatted) {
      this.value = formatted;
      if (prevPos >= prevVal.length) {
        this.setSelectionRange(formatted.length, formatted.length);
      } else {
        let slashesBefore = (formatted.slice(0, prevPos).match(/\//g) || []).length;
        let oldSlashesBefore = (prevVal.slice(0, prevPos).match(/\//g) || []).length;
        let newPos = prevPos + (slashesBefore - oldSlashesBefore);
        this.setSelectionRange(newPos, newPos);
      }
    }

    if (v.length === 8) {
      const fp = this._flatpickr;
      if (fp) {
        fp.setDate(formatted, false, 'd/m/Y');
      }
      if (typeof onDateApplied === 'function') {
        onDateApplied(formatted);
      }
    }
  });

  el.addEventListener('change', function() {
    if (this.value) {
      let v = this.value.replace(/\D/g, '').slice(0, 8);
      if (v.length === 8) {
        this.value = v.slice(0, 2) + '/' + v.slice(2, 4) + '/' + v.slice(4);
      }
      const fp = this._flatpickr;
      if (fp) {
        fp.setDate(this.value, false, 'd/m/Y');
      }
    }
  });
}

function bindCalButton(btnId, inputId) {
  const btn = document.getElementById(btnId);
  if (btn) {
    btn.onclick = function(e) {
      e.preventDefault();
      e.stopPropagation();
      const el = document.getElementById(inputId);
      const fp = el ? el._flatpickr : null;
      if (fp) {
        if (fp.isOpen) fp.close();
        else fp.open();
      }
    };
  }
}

function initDatePicker() {
  const ids = ['txtStartDate', 'txtEndDate'];
  ids.forEach(id => {
    const el = document.getElementById(id);
    if (!el || el._flatpickr) return;

    const fpCfg = {
      dateFormat: 'd/m/Y',
      clickOpens: false,
      allowInput: true,
      disableMobile: true,
      parseDate: function (datestr) {
        if (!datestr) return new Date();
        if (datestr instanceof Date) return datestr;
        const s = String(datestr).trim();
        const dmy = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
        if (dmy) {
          let p1 = parseInt(dmy[1], 10), p2 = parseInt(dmy[2], 10), yr = parseInt(dmy[3], 10);
          if (p2 > 12 && p1 <= 12) return new Date(yr, p1 - 1, p2);
          return new Date(yr, p2 - 1, p1);
        }
        const m8 = s.match(/^(\d{2})(\d{2})(\d{4})/);
        if (m8) return new Date(parseInt(m8[3], 10), parseInt(m8[2], 10) - 1, parseInt(m8[1], 10));
        const mo = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
        const mAlpha = s.match(/^(\d{1,2})[\/\s-]([A-Za-z]{3})[\/\s-](\d{4})/);
        if (mAlpha) {
          const mKey = mAlpha[2].charAt(0).toUpperCase() + mAlpha[2].slice(1,3).toLowerCase();
          return new Date(parseInt(mAlpha[3], 10), mo[mKey] !== undefined ? mo[mKey] : 0, parseInt(mAlpha[1], 10));
        }
        const iso = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
        if (iso) return new Date(parseInt(iso[1], 10), parseInt(iso[2], 10) - 1, parseInt(iso[3], 10));
        const d = new Date(s);
        return isNaN(d.getTime()) ? new Date() : d;
      },
      formatDate: function (date) {
        const d = String(date.getDate()).padStart(2, '0');
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const y = date.getFullYear();
        return `${d}/${m}/${y}`;
      },
      onClose: function(selectedDates, dateStr, instance) {
        if (instance && instance.element) instance.element.blur();
      },
      onChange: function(selectedDates, dateStr, instance) {
        if (instance && instance.element) instance.element.blur();
        el.dispatchEvent(new Event('change'));
      }
    };

    try {
      flatpickr(el, fpCfg);
    } catch(e) {
      console.warn('Flatpickr init error for ' + id + ':', e);
    }
  });

  bindCalButton('btnStartDateCal', 'txtStartDate');
  bindCalButton('btnEndDateCal', 'txtEndDate');

  bindAutoSlashDate('txtStartDate', () => {
    const nextEl = document.getElementById('txtEndDate');
    if (nextEl) { nextEl.focus(); nextEl.select?.(); }
  });
  bindAutoSlashDate('txtEndDate', () => {
    const gEl = document.getElementById('gameSelection');
    if (gEl) gEl.focus();
  });
}

// ── SweetAlert-based feedback (matches original ASPX SucessMessage/ErrorMessage) ──
function showToast(msg,err=false) {
  swal(err ? 'Wrong Inputs!' : 'Sucess!', msg, {
    icon: err ? 'error' : 'success',
    timer: 900,
    buttons: false
  });
}
init();
</script>

<script>
// Flatpickr calendar for date inputs
document.addEventListener('DOMContentLoaded', function() {
  initDatePicker();
});
</script>
