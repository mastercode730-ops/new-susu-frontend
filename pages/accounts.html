<script>
const TX_TYPES = ['Paid', 'Received', 'Paid Adjustment', 'Receive Adjustment', 'Commission'];
let allCustomers = [];
let mySubUID = null; // set when the logged-in user IS a subuser — used to correctly attribute their own saves since the (inapplicable) picker stays hidden for them

function focusDateField() {
  const d = document.getElementById('txtDate');
  if (d) { d.focus(); d.select(); }
}

function advanceFromDate() {
  const fp = document.getElementById('txtDate')?._flatpickr;
  if (fp) fp.close();
  setTimeout(() => {
    $('#ddlAccounts').select2('open');
  }, 50);
}

function advanceFromNarration() {
  const staffRow = document.getElementById('staffRow');
  if (staffRow && staffRow.style.display !== 'none') {
    $('#ddlStaff').select2('focus');
  } else {
    document.getElementById('btnSubmit').focus();
  }
}

function parseInputDate(s) {
  if (!s) return null;
  const str = String(s).trim();
  const mNum = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (mNum) {
    const day = parseInt(mNum[1], 10);
    const month = parseInt(mNum[2], 10) - 1;
    const year = parseInt(mNum[3], 10);
    return new Date(year, month, day);
  }
  const m8 = str.match(/^(\d{2})(\d{2})(\d{4})$/);
  if (m8) {
    const day = parseInt(m8[1], 10);
    const month = parseInt(m8[2], 10) - 1;
    const year = parseInt(m8[3], 10);
    return new Date(year, month, day);
  }
  const mo = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
  const mAlpha = str.match(/^(\d{1,2})[\/\s-]([A-Za-z]{3})[\/\s-](\d{4})/);
  if (mAlpha) {
    const day = parseInt(mAlpha[1], 10);
    const mKey = mAlpha[2].toLowerCase();
    const month = mo[mKey] !== undefined ? mo[mKey] : 0;
    const year = parseInt(mAlpha[3], 10);
    return new Date(year, month, day);
  }
  const d = new Date(str);
  return isNaN(d.getTime()) ? null : d;
}

function toIsoDate(dStr) {
  if (!dStr) return '';
  if (/^\d{4}-\d{2}-\d{2}$/.test(dStr)) return dStr;
  const d = parseInputDate(dStr);
  if (d && !isNaN(d.getTime())) {
    const y = d.getFullYear();
    const moNum = String(d.getMonth() + 1).padStart(2, '0');
    const da = String(d.getDate()).padStart(2, '0');
    return `${y}-${moNum}-${da}`;
  }
  return '';
}

async function updateTopSubUserBalance(staffId, staffName) {
  const el = document.getElementById('topSubUserBalance');
  if (!el) return;
  const targetId = mySubUID || staffId;
  if (!targetId || targetId === '0' || String(targetId).startsWith('cust_') || targetId === 'Self') {
    if (!mySubUID) {
      el.style.display = 'none';
      return;
    }
  }
  try {
    const url = mySubUID
      ? '/api/balance/staff-balance'
      : `/api/balance/staff-balance?staffID=${encodeURIComponent(targetId)}`;
    const r = await API.get(url);
    if (r?.success && r.balance !== undefined) {
      const b = parseFloat(r.balance) || 0;
      let label = staffName;
      if (!label) {
        if (r.subusername) label = r.subusername;
        else if (mySubUID) label = `SubUser ${mySubUID}`;
        else label = `SubUser ${targetId}`;
      }
      el.textContent = `Sub User (${label}) Balance : ${b < 0 ? '-' : ''}₹${Math.abs(b).toLocaleString('en-IN')}`;
      el.className = 'net-bal ' + (b < 0 ? 'neg' : 'pos');
      el.style.display = 'inline-block';
    }
  } catch (err) {
    console.error('Error fetching top sub user balance:', err);
  }
}

function goToPrHistory() {
  const dVal = localStorage.getItem('accounts_last_entry_date') || document.getElementById('txtDate')?.value || localStorage.getItem('accounts_last_date');
  const iso = toIsoDate(dVal);
  if (iso) {
    location.href = `/pages/show-transactions.html?from=${encodeURIComponent(iso)}&to=${encodeURIComponent(iso)}`;
  } else {
    location.href = '/pages/show-transactions.html';
  }
}

// ── INIT ──────────────────────────────────────────────
async function init() {
  try {
    const u = await initPage('accounts');
    if (!u) return;
    mySubUID = u.SubUID || null;
    if (mySubUID) {
      updateTopSubUserBalance(mySubUID, u.subusername || u.SubUID);
    }

    // Customer Name always shows the full/total customer list, regardless
    // of which Sub User is picked below — Sub User only decides who a
    // transaction gets attributed to, it doesn't filter the customer list.
    await loadCustomers();
    const savedDate = localStorage.getItem('accounts_last_date');
    const parsedSaved = parseInputDate(savedDate);
    const endToday = new Date(); endToday.setHours(23, 59, 59, 999);
    if (savedDate && parsedSaved && !isNaN(parsedSaved) && parsedSaved <= endToday) {
      document.getElementById('txtDate').value = fmtDate(parsedSaved);
    } else {
      await setLatestDate();
    }
    initDatePickers();

    const advanceToType = () => {
      setTimeout(() => {
        $('#ddlType').select2('focus');
      }, 50);
    };

    // ASPX pageLoad(): Select2 init + focus + fetch balance on change
    $('#ddlAccounts').select2({ placeholder: 'Select Customer', allowClear: true });
    let _custJustSelected = false;
    $('#ddlAccounts').on('select2-selecting', function() {
      _custJustSelected = true;
    });
    $('#ddlAccounts').on('select2-close', function() {
      if (_custJustSelected) {
        _custJustSelected = false;
        advanceToType();
      }
    });
    $('#ddlAccounts').on('change', function(){
      const val = $(this).val();
      fetchNetBal(val);
      if (val) advanceToType();
    });
    bindSelect2Open('#ddlAccounts');
    focusDateField();

    // Type — Select2 searchable dropdown matching desktop reference
    function typeMatcher(term, text, opt) {
      if (!term || !term.trim()) return true;
      const t = term.trim().toLowerCase();
      const txt = (text || '').toLowerCase();
      const val = (opt && opt.val ? opt.val() : (opt && opt.value ? opt.value : '')).toLowerCase();
      if (txt.indexOf(t) > -1 || val.indexOf(t) > -1) return true;
      if ((t === 'r' || t === 'rcv' || t === 'rec' || t === 'received' || t === 'liye') && (val === 'received' || txt.includes('receipt') || txt.includes('liye'))) return true;
      if ((t === 'p' || t === 'pay' || t === 'paid' || t === 'diye') && (val === 'paid' || txt.includes('payment') || txt.includes('diye'))) return true;
      if ((t === 'c' || t === 'com' || t === 'comm') && val === 'commission') return true;
      if ((t === 'adj' || t === 'adjust') && (txt.includes('adjust') || val.includes('adjustment'))) return true;
      return false;
    }

    const advanceToAmount = () => { const el = document.getElementById('txtAmount'); el.focus(); el.select(); };

    $('#ddlType').select2({
      minimumResultsForSearch: 0,
      dropdownCssClass: 'select2-drop-for-type',
      matcher: typeMatcher
    });
    bindSelect2Open('#ddlType');

    // Restore previously chosen Type if any
    const savedType = localStorage.getItem('accounts_last_type');
    if (savedType && $('#ddlType option[value="' + savedType + '"]').length) {
      $('#ddlType').val(savedType);
      $('#ddlType').select2('val', savedType);
    }

    let _typeJustSelected = false;
    $('#ddlType').on('select2-selecting', function() {
      _typeJustSelected = true;
    });
    $('#ddlType').on('select2-close', function() {
      if (_typeJustSelected) {
        _typeJustSelected = false;
        setTimeout(advanceToAmount, 50);
      }
    });
    $('#ddlType').on('change', function() {
      const t = getSelectedType();
      if (t) localStorage.setItem('accounts_last_type', t);
      setTimeout(advanceToAmount, 50);
    });
    $(document).on('keydown', '#s2id_ddlType', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        if ($(this).hasClass('select2-dropdown-open')) {
          // Select2 handles Enter
        } else {
          advanceToAmount();
        }
      }
    });

    // Sub User picker — only makes sense for the main admin (choosing which
    // staff member an entry belongs to).
    if (!u.SubUID) {
      await loadSubUsers();
      document.getElementById('staffRow').style.display = 'block';
      $('#ddlStaff').select2({
        minimumResultsForSearch: 0
      });
      bindSelect2Open('#ddlStaff');

      // Restore previously chosen Sub User if any
      const savedStaff = localStorage.getItem('accounts_last_staff');
      if (savedStaff !== null && $('#ddlStaff option[value="' + savedStaff + '"]').length) {
        $('#ddlStaff').val(savedStaff);
        $('#ddlStaff').select2('val', savedStaff);
        fetchStaffNetBal(savedStaff);
        const optText = $('#ddlStaff option[value="' + savedStaff + '"]').text();
        updateTopSubUserBalance(savedStaff, optText);
      }

      // DO NOT auto-save on Sub User selection! Only advance focus to Submit button
      $('#ddlStaff').on('change', function(){
        const val = $(this).val();
        localStorage.setItem('accounts_last_staff', val || '0');
        fetchStaffNetBal(val);
        const optText = $('#ddlStaff option:selected').text();
        updateTopSubUserBalance(val, optText);
        setTimeout(() => document.getElementById('btnSubmit').focus(), 50);
      });
      $('#ddlStaff').on('select2-close', function(){
        setTimeout(() => document.getElementById('btnSubmit').focus(), 50);
      });
      $(document).on('keydown', '#s2id_ddlStaff', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          if (!$(this).hasClass('select2-dropdown-open')) {
            document.getElementById('btnSubmit').focus();
          }
        }
      });
    }
  } catch(e) { window.location.href = '/login.html'; }
}

// Select2 v3.5.2 sometimes sets a stale/narrow inline width on the open
// dropdown instead of matching its own closed control's real width. This
// page has TWO select2 fields (Customer, Sub User) sharing ONE reused
// .select2-drop element — so the observer/cleanup state below is a single
// shared (module-level) instance, not one per field, to avoid the two
// fields' fixes racing each other. But WHICH width to apply is computed
// from a stable id ("s2id_<field>") known at bind time, NOT by asking
// "which container currently looks open" — that dynamic lookup depended on
// Select2 having already added its select2-dropdown-open class, and that
// class-add can lose the race against select2-open firing on some opens
// but not others (hence "works first time, breaks second time").
let _dropObserver = null;
let _activeFieldId = null; // set by bindSelect2Open's own open handler, always correct for whichever field it was bound to

function fixDropWidth() {
  if (!_activeFieldId) return;
  const container = document.getElementById('s2id_' + _activeFieldId);
  if (!container) return;
  const w = Math.round(container.getBoundingClientRect().width);
  if (!w) return;
  const target = w + 'px';
  document.querySelectorAll('.select2-drop-active').forEach(drop => {
    // Skip the no-op write when it's already correct — the observer also
    // watches the style attribute, so writing the same value again would
    // still fire another mutation and loop forever.
    if (drop.offsetParent !== null && drop.style.width !== target) drop.style.width = target;
  });
}
// "No matches found" (and other) re-renders can happen on a later/debounced
// tick that a fixed set of timeouts would miss — a MutationObserver reacts
// to any change, whenever it actually happens, instead of guessing timing.
function watchDropWidth() {
  // Select2 v3.5.2 gives EACH field its own dedicated drop element and never
  // removes it on close — just hides it (display:none) while leaving the
  // .select2-drop-active CLASS in place. A plain querySelector() (singular)
  // always grabs the FIRST one in DOM order, which after the first field
  // has ever been opened once is permanently that stale hidden element —
  // not whichever field is actually open now. Must filter for the visible one.
  const drop = Array.from(document.querySelectorAll('.select2-drop-active')).find(d => d.offsetParent !== null);
  if (!drop) return;
  if (_dropObserver) _dropObserver.disconnect();
  _dropObserver = new MutationObserver(() => fixDropWidth());
  // attributes:true + attributeFilter:['style'] — Select2's own
  // positionDropdown() repositions itself via a direct style-attribute
  // write, which childList/characterData alone doesn't catch. Missing this
  // was the earlier "sometimes right, sometimes wrong" gap.
  _dropObserver.observe(drop, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ['style'] });
}
document.addEventListener('keyup', function(e){
  if (e.target.classList.contains('select2-input') && document.querySelector('.select2-drop-active')) {
    fixDropWidth();
  }
});

function bindSelect2Open(sel) {
  const fieldId = sel.replace('#', '');
  $(sel).on('select2-open', function(){
    _activeFieldId = fieldId; // this field is now definitely the one that's open
    const sf = document.querySelector('.select2-drop-active .select2-input');
    if (sf) sf.focus();
    // Right when switching between the two fields in quick succession, the
    // newly-opening field's own container can momentarily read a
    // getBoundingClientRect() width of 0 (its layout hasn't settled from
    // the previous field's close yet) — fixDropWidth() correctly skips
    // applying a 0 width, but without a retry it just gives up rather than
    // catching the real width a moment later. Retry across a few frames.
    let attempts = 0;
    (function tryFix(){
      fixDropWidth();
      if (attempts++ < 10) requestAnimationFrame(tryFix);
    })();
    watchDropWidth();
  });
  $(sel).on('select2-close', function(){
    if (_dropObserver) { _dropObserver.disconnect(); _dropObserver = null; }
    _activeFieldId = null;
  });
}

function isNumber(evt) {
  const charCode = evt.which ? evt.which : evt.keyCode;
  if (charCode > 31 && (charCode < 48 || charCode > 57)) return false;
  return true;
}
function process(input) { input.value = input.value.replace(/[^0-9]/g, ''); }

function getSelectedType() {
  return document.getElementById('ddlType').value || 'Paid';
}

// ── DATES ─────────────────────────────────────────────
function initDatePickers() {
  const fmt = {
    dateFormat: 'd/m/Y',
    maxDate: 'today',
    clickOpens: false,
    allowInput: true,
    disableMobile: true,
    formatDate(d) {
      return fmtDate(d);
    },
    parseDate(s) {
      return parseInputDate(s);
    },
    onChange: function(selectedDates, dateStr, instance) {
      if (dateStr) localStorage.setItem('accounts_last_date', dateStr);
      const st = $('#ddlStaff').val();
      if (st && st !== '0') fetchStaffNetBal(st);
      if (instance && instance.isOpen) {
        setTimeout(advanceFromDate, 100);
      }
    }
  };
  flatpickr('#txtDate', fmt);
  const dateInput = document.getElementById('txtDate');
  if (dateInput) {
    dateInput.addEventListener('keydown', function(e) {
      if (e.key === 'Backspace') {
        const val = this.value;
        const start = this.selectionStart;
        const end = this.selectionEnd;
        // If cursor is immediately after a slash, delete both the slash and the preceding digit
        if (start === end && (start === 3 || start === 6) && val[start - 1] === '/') {
          e.preventDefault();
          this.value = val.slice(0, start - 2) + val.slice(start);
          this.setSelectionRange(start - 2, start - 2);
          return;
        }
      }
      if (e.key === 'Enter') {
        e.preventDefault();
        e.stopPropagation();
        advanceFromDate();
      }
    }, true);

    dateInput.addEventListener('input', function(e) {
      if (e.inputType && e.inputType.startsWith('delete')) {
        return;
      }
      const prevPos = this.selectionEnd;
      const prevVal = this.value;
      let v = prevVal.replace(/\D/g, '').slice(0, 8);
      let formatted = '';
      if (v.length > 4) {
        formatted = v.slice(0, 2) + '/' + v.slice(2, 4) + '/' + v.slice(4);
      } else if (v.length > 2) {
        formatted = v.slice(0, 2) + '/' + v.slice(2);
      } else if (v.length === 2) {
        formatted = v + '/';
      } else {
        formatted = v;
      }
      if (v.length === 4 && formatted.length === 5) {
        formatted += '/';
      }
      if (this.value !== formatted) {
        this.value = formatted;
        if (prevPos >= prevVal.length) {
          this.setSelectionRange(formatted.length, formatted.length);
        } else {
          let slashesBefore = (formatted.slice(0, prevPos).match(/\//g) || []).length;
          let oldSlashesBefore = (prevVal.slice(0, prevPos).match(/\//g) || []).length;
          let newPos = prevPos + (slashesBefore - oldSlashesBefore);
          this.setSelectionRange(newPos, newPos);
        }
      }

      if (v.length === 8) {
        const fp = this._flatpickr;
        if (fp) {
          fp.setDate(formatted, false, 'd/m/Y');
        }
        localStorage.setItem('accounts_last_date', formatted);
        const st = $('#ddlStaff').val();
        if (st && st !== '0') fetchStaffNetBal(st);
      }
    });

    dateInput.addEventListener('change', function() {
      if (this.value) {
        let v = this.value.replace(/\D/g, '').slice(0, 8);
        if (v.length === 8) {
          this.value = v.slice(0, 2) + '/' + v.slice(2, 4) + '/' + v.slice(4);
        }
        localStorage.setItem('accounts_last_date', this.value);
        const st = $('#ddlStaff').val();
        if (st && st !== '0') fetchStaffNetBal(st);
      }
    });
  }
  const btnCal = document.getElementById('btnDateCal');
  if (btnCal) {
    btnCal.onclick = function(e) {
      e.preventDefault();
      const instance = document.getElementById('txtDate')?._flatpickr;
      if (instance) {
        if (instance.isOpen) instance.close();
        else instance.open();
      }
    };
  }
}

async function setLatestDate() {
  const r = await API.get('/api/accounts/latest-date');
  const today = fmtDate(new Date());
  let d = r?.date ? (fmtDate(new Date(r.date)) || today) : today;
  const p = parseInputDate(d);
  const endToday = new Date(); endToday.setHours(23, 59, 59, 999);
  if (p && !isNaN(p) && p > endToday) d = today;
  document.getElementById('txtDate').value = d;
}

// ── CUSTOMERS ─────────────────────────────────────────
// No staff selected (or "Self") → full customer list.
async function loadCustomers() {
  const r = await API.get('/api/accounts/customers');
  allCustomers = [{ UID: 'Self', Name: 'Self' }];
  const ddl = document.getElementById('ddlAccounts');
  ddl.innerHTML = '<option value="">Select Customer</option><option value="Self">Self</option>';

  if (r?.success && r.data?.length) {
    const sorted = [...r.data].sort((a, b) => (a.Name||'').localeCompare(b.Name||''));
    sorted.forEach(c => {
      allCustomers.push(c);
      ddl.innerHTML += `<option value="${c.UID}">${c.Name}</option>`;
    });
  }
  refreshCustomerSelect2();
}

function refreshCustomerSelect2() {
  if (window.jQuery && $('#ddlAccounts').data('select2')) $('#ddlAccounts').select2('val', '');
}

async function fetchNetBal(uid) {
  const badge = document.getElementById('netBadge');
  const rightBal = document.getElementById('rightPanelBal');
  const placeholder = document.getElementById('miniHistPlaceholder');
  const miniHist = document.getElementById('miniHistRow');

  if (!uid || uid === 'Self') {
    badge.textContent = ''; badge.className = 'net-bal';
    if (rightBal) { rightBal.textContent = ''; }
    if (placeholder) placeholder.style.display = 'block';
    if (miniHist) miniHist.style.display = 'none';
    return;
  }
  // A "staff_"-prefixed pick (a Sub User selected in this merged list) has
  // no ledger — calling the customer-balance/history APIs with it would
  // just be a bogus request. saveTransaction() blocks the actual save; this
  // just skips the pointless fetches and warns instead of showing a balance.
  if (uid.startsWith('staff_')) {
    badge.textContent = '⚠ Ye Sub User hai, customer nahi'; badge.className = 'net-bal neg';
    if (rightBal) { rightBal.textContent = ''; }
    if (placeholder) placeholder.style.display = 'block';
    if (miniHist) miniHist.style.display = 'none';
    return;
  }
  if (placeholder) placeholder.style.display = 'none';
  if (miniHist) miniHist.style.display = 'block';
  loadMiniHistory(uid);
  try {
    const r = await API.get(`/api/accounts/selected-balance?customerUID=${uid}`);
    if (r?.success) {
      const b = parseFloat(r.balance || 0);
      const txt = 'Net Bal : ' + b.toLocaleString('en-IN');
      badge.textContent = txt;
      badge.className = 'net-bal ' + (b < 0 ? 'neg' : 'pos');
      if (rightBal) {
        rightBal.textContent = txt;
        rightBal.style.color = b < 0 ? '#dc3545' : '#28a745';
      }
    }
  } catch {}
}

// Sub User dropdown is a merged list of real staff AND customers (see
// appendCustomersToStaffList) — matching the desktop reference's second
// "Opposite Party" balance. A "cust_"-prefixed pick uses the same ledger
// balance lookup as Customer Name; a real Sub User (staff) has its own
// separate balance concept (same one shown on the "Sub User Balance" page —
// /api/balance/staff-grid, StaffBalanceSheet SP), for the CURRENTLY entered
// Date (a staff balance is a running total as of a date, not a flat number).
async function fetchStaffNetBal(val) {
  const badge = document.getElementById('staffNetBadge');
  if (!val || val === '0') { badge.textContent = ''; badge.className = 'net-bal'; return; }
  try {
    let b = null;
    if (val.startsWith('cust_')) {
      const uid = val.slice('cust_'.length);
      const r = await API.get(`/api/accounts/selected-balance?customerUID=${uid}`);
      if (r?.success) b = parseFloat(r.balance || 0);
    } else {
      const date = document.getElementById('txtDate').value;
      const r = await API.get(`/api/balance/staff-grid?date=${encodeURIComponent(date)}`);
      const row = (r?.data || []).find(s => String(s.SubUserID) === String(val));
      if (row) b = parseFloat(row.Balance || 0);
      else b = 0;
    }
    if (b === null) { badge.textContent = ''; badge.className = 'net-bal'; return; }
    badge.textContent = 'Net Bal : ' + b.toLocaleString('en-IN');
    badge.className = 'net-bal ' + (b < 0 ? 'neg' : 'pos');
  } catch { badge.textContent = ''; badge.className = 'net-bal'; }
}



// Compact "recent entries for this party" table right in the Entry form —
// no date range (whole history for that customer), newest first, capped to
// the last 10 and scroll-boxed short (~4 rows) same as the desktop reference.
async function loadMiniHistory(uid) {
  const row = document.getElementById('miniHistRow');
  const tbody = document.getElementById('miniHistTbody');
  row.style.display = 'block';
  tbody.innerHTML = '<tr><td colspan="5">Loading...</td></tr>';
  // fromDate/toDate MUST be passed — the backend SP (ShowAllTransaction)
  // doesn't treat an omitted/empty date range as "no filter", it returns
  // nothing at all. A wide range (2000-01-01 → today) is effectively
  // unbounded for real data, unlike actually leaving the params out.
  const r = await API.get(`/api/accounts/list?customerUID=${uid}&fromDate=2000-01-01&toDate=2099-12-31`);
  let data = r?.data || [];
  data.sort((a, b) => new Date(b.Date) - new Date(a.Date));
  data = data.slice(0, 10);
  tbody.innerHTML = data.length ? data.map(d => `
    <tr>
      <td>${d.Date ? new Date(d.Date).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) : ''}</td>
      <td>${d.Paid || 0}</td>
      <td>${d.Received || 0}</td>
      <td>${d.Narration || ''}</td>
      <td>${d.EntryType || d.Type || ''}</td>
    </tr>`).join('') : '<tr><td colspan="5">No previous entries</td></tr>';
}

async function loadSubUsers() {
  const r = await API.get('/api/accounts/subusers');

// Sub User dropdown also lists every customer alongside the subusers (same

// prefixed value so they stay distinguishable from real SubUserIDs — see

// ── SAVE ──────────────────────────────────────────────
async function saveTransaction() {
  const uid = $('#ddlAccounts').val();
  const amount = document.getElementById('txtAmount').value.trim();
  const type = getSelectedType();
  if (!uid) { toast('Customer select karo', 'err'); $('#ddlAccounts').select2('open'); return; }
  if (uid.startsWith('staff_')) { toast('Ye ek Sub User hai, customer nahi — inka ledger nahi hota', 'err'); $('#ddlAccounts').select2('open'); return; }
  if (!amount || parseFloat(amount) <= 0) { toast('Amount daalo', 'err'); document.getElementById('txtAmount').focus(); return; }

  document.getElementById('btnSubmit').disabled = true;
  const staffSel = document.getElementById('ddlStaff');
  const rawStaffVal = $('#ddlStaff').val() || (staffSel && staffSel.value) || '0';
  const staffID = mySubUID || (rawStaffVal.startsWith('cust_') || rawStaffVal === '0' || rawStaffVal === 'Self' ? '0' : rawStaffVal);

  const curDate = document.getElementById('txtDate').value;
  const curParsed = parseInputDate(curDate);
  const endOfToday = new Date();
  endOfToday.setHours(23, 59, 59, 999);
  if (curParsed && !isNaN(curParsed) && curParsed > endOfToday) {
    toast('Future date allow nahi hai', 'err');
    return;
  }
  localStorage.setItem('accounts_last_date', curDate);
  localStorage.setItem('accounts_last_type', type);
  localStorage.setItem('accounts_last_staff', rawStaffVal);

  try {
    const r = await API.post('/api/accounts', {
      customerUID: uid,
      date: curDate,
      type, amount,
      narration: document.getElementById('txtNarration').value,
      staffID: (type === 'Paid' || type === 'Received') ? staffID : '0'
    });
    if (r?.success) {
      localStorage.setItem('accounts_last_entry_date', curDate);
      toast('Data Saved Successfully!', 'ok');
      document.getElementById('txtAmount').value = '';
      document.getElementById('txtNarration').value = '';
      if (uid && uid !== 'Self') {
        fetchNetBal(uid);
      }
      if (rawStaffVal && rawStaffVal !== '0') {
        fetchStaffNetBal(rawStaffVal);
      }
      const staffOptText = $('#ddlStaff option:selected').text();
      updateTopSubUserBalance(rawStaffVal, staffOptText);
      setTimeout(focusDateField, 60);
    } else {
      toast(r?.message || 'Error saving', 'err');
    }
  } catch(e) { toast('Error', 'err'); }
  document.getElementById('btnSubmit').disabled = false;
}

function resetForm() {
  $('#ddlAccounts').val('').trigger('change');
  document.getElementById('txtAmount').value = '';
  document.getElementById('txtNarration').value = '';
  const rightBal = document.getElementById('rightPanelBal');
  if (rightBal) { rightBal.textContent = ''; }
  const placeholder = document.getElementById('miniHistPlaceholder');
  if (placeholder) placeholder.style.display = 'block';
  const miniHist = document.getElementById('miniHistRow');
  if (miniHist) miniHist.style.display = 'none';
  const rawStaffVal = $('#ddlStaff').val() || document.getElementById('ddlStaff')?.value || '0';
  if (rawStaffVal && rawStaffVal !== '0') {
    fetchStaffNetBal(rawStaffVal);
  }
  // Date, Type, and Sub User remain preselected as chosen by user
  setTimeout(focusDateField, 60);
}

// ── HELPERS ───────────────────────────────────────────
function fmtDate(d) {
  if (!d || isNaN(d)) return '';
  const day = String(d.getDate()).padStart(2, '0');
  const mo = String(d.getMonth() + 1).padStart(2, '0');
  const yr = d.getFullYear();
  return `${day}/${mo}/${yr}`;
}
// ── SweetAlert-based feedback (matches ASPX SucessMessage/ErrorMessage) ──
function toast(msg, type='ok') {
  swal(type === 'ok' ? 'Sucess!' : 'Wrong Inputs!', msg, {
    icon: type === 'ok' ? 'success' : 'error',
    timer: 900,
    buttons: false
  });
}
