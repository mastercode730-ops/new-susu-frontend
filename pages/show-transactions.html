<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Susu9 - All Transactions</title>
<script src="/js/theme-preload.js"></script>
<link rel="stylesheet" href="/css/main.css">
<style>
/* Bolder, higher-contrast text — visual only, no behavior change */
.content label{font-weight:800!important;color:var(--text)!important;display:block;font-size:.78rem!important;margin-bottom:3px!important;}
.content .card-title{font-weight:800!important;color:var(--text)!important;font-size:1.05rem!important;}
.content .form-control{font-weight:700!important;color:var(--text)!important;background:#fff!important;border:1px solid #888!important;padding:.32rem .6rem!important;height:auto!important;font-size:.85rem!important;}
/* Compact, well-aligned filter box */
.content .card-header{padding:8px 16px!important;}
.content .card-body{padding:10px 16px!important;}
.content .row{margin-left:-6px;margin-right:-6px;}
.content .row>.col{padding-left:6px;padding-right:6px;}
/* Data grid: bold bordered header instead of the faint Bootstrap table look */
.content table{border-collapse:collapse!important;width:100%!important;}
.content table th{background:#d9d9d9!important;border:1px solid #999!important;font-weight:800!important;color:#000!important;padding:8px 14px!important;font-size:.85rem!important;}
.content table td{border:1px solid #ccc!important;padding:7px 14px!important;font-weight:900!important;color:#000!important;font-size:.92rem!important;}
.content table tfoot td{background:#eee!important;}
.content table tbody tr:hover td{background:#eef3ff!important;}
.table-responsive{overflow-x:auto;}
/* Vendor theme reserves 62px above .content for a second header row this
   app doesn't render — page-scoped so it doesn't affect other pages. */
.main-panel>.content{margin-top:50px!important;padding-top:8px!important;}
</style>
</head>
<body>

<div class="content">
  <div class="row">
    <div class="col-md-12">
      <div class="card">
        <div class="card-header">
          <div class="card-title">All Transaction</div>
        </div>
        <div class="card-body">
          <div class="row">
            <div class="col">
              <label>From Date</label>
              <input type="date" class="form-control" id="txFrom">
            </div>
            <div class="col">
              <label>To Date</label>
              <input type="date" class="form-control" id="txTo">
            </div>
            <div class="col">
              <label>Customer Name</label>
              <select class="form-control" id="txCust" style="text-transform:capitalize;"><option value="">All Customers</option></select>
            </div>
            <div class="col">
              <label>Sub User</label>
              <select class="form-control" id="txStaff" style="text-transform:capitalize;"><option value="">All Staff</option></select>
            </div>
          </div>
          <div class="row">
            <div class="col">
              <br>
              <button class="btn btn-primary" id="btnSearch" onclick="loadTx()" style="font-weight: 800; min-width: 100px;">Search</button>
            </div>
          </div>
        </div>
        <div class="table-responsive">
          <table cellpadding="4" style="text-transform:capitalize;text-align:center;">
            <thead>
              <tr>
                <th>Customer</th><th>Date</th><th>Paid</th><th>Received</th><th>Type</th><th>Narration</th><th>SubUser</th>
              </tr>
            </thead>
            <tbody id="txTbody"><tr><td colspan="7">Search to load</td></tr></tbody>
            <tfoot id="txFoot"></tfoot>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script>
function toIsoDate(dStr) {
  if (!dStr) return '';
  if (/^\d{4}-\d{2}-\d{2}$/.test(dStr)) return dStr;
  const mo = {Jan:'01',Feb:'02',Mar:'03',Apr:'04',May:'05',Jun:'06',Jul:'07',Aug:'08',Sep:'09',Oct:'10',Nov:'11',Dec:'12'};
  const m = dStr.match(/^(\d{1,2})[\/\s-]([A-Za-z]{3})[\/\s-](\d{4})/);
  if (m) {
    const day = m[1].padStart(2, '0');
    const month = mo[m[2].slice(0,3).charAt(0).toUpperCase() + m[2].slice(1,3).toLowerCase()] || '01';
    return `${m[3]}-${month}-${day}`;
  }
  const d = new Date(dStr);
  if (!isNaN(d.getTime())) {
    const y = d.getFullYear();
    const moNum = String(d.getMonth() + 1).padStart(2, '0');
    const da = String(d.getDate()).padStart(2, '0');
    return `${y}-${moNum}-${da}`;
  }
  return '';
}

async function init() {
  await initPage('show-transactions');
  const cr = await API.get('/api/accounts/customers');
  const sr = await API.get('/api/accounts/subusers');
  document.getElementById('txCust').innerHTML = '<option value="">All Customers</option><option value="0">Self</option>' + (cr?.data||[]).map(c => `<option value="${c.UID||c.CID}">${c.Name||c.CustomerName}</option>`).join('');
  document.getElementById('txStaff').innerHTML = '<option value="">All Staff</option><option value="0">Self</option>' + (sr?.data||[]).map(s => `<option value="${s.SubUserID}">${s.subusername}</option>`).join('');
  const now = new Date(new Date().getTime()+5.5*3600000).toISOString().split('T')[0];
  const dr = await API.get('/api/accounts/latest-date');
  const lastEntry = localStorage.getItem('accounts_last_entry_date') || localStorage.getItem('accounts_last_date');
  let defaultDate = toIsoDate(lastEntry) || toIsoDate(dr?.date) || now;
  if (defaultDate > now) defaultDate = now;

  const elFrom = document.getElementById('txFrom');
  const elTo = document.getElementById('txTo');
  elFrom.max = now;
  elTo.max = now;
  elFrom.value = defaultDate;
  elTo.value = defaultDate;

  const p = new URLSearchParams(location.search);
  if (p.get('SUID')) document.getElementById('txStaff').value = p.get('SUID');
  if (p.get('customerUID')) document.getElementById('txCust').value = p.get('customerUID');
  if (p.get('from')) {
    const f = toIsoDate(p.get('from'));
    if (f) elFrom.value = f > now ? now : f;
  }
  if (p.get('to')) {
    const t = toIsoDate(p.get('to'));
    if (t) elTo.value = t > now ? now : t;
  }
  loadTx();
}

async function loadTx() {
  const btn = document.getElementById('btnSearch');
  const tbody = document.getElementById('txTbody');
  const tfoot = document.getElementById('txFoot');

  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Searching...';
  }
  tbody.innerHTML = '<tr><td colspan="7" style="padding: 24px; font-weight: 800; color: #1572e8; font-size: 0.95rem;"><i class="fa fa-spinner fa-spin" style="font-size: 1.3rem; vertical-align: middle; margin-right: 8px;"></i> Loading Transactions...</td></tr>';
  tfoot.innerHTML = '';

  try {
    const now = new Date(new Date().getTime()+5.5*3600000).toISOString().split('T')[0];
    let from = document.getElementById('txFrom').value;
    let to = document.getElementById('txTo').value;
    if (from > now) { from = now; document.getElementById('txFrom').value = now; }
    if (to > now) { to = now; document.getElementById('txTo').value = now; }
    const cust = document.getElementById('txCust').value;
    const staff = document.getElementById('txStaff').value;

    const r = await API.get(`/api/accounts/list?fromDate=${encodeURIComponent(from)}&toDate=${encodeURIComponent(to)}&custUID=${encodeURIComponent(cust)}&customerUID=${encodeURIComponent(cust)}&staffUID=${encodeURIComponent(staff)}&staffID=${encodeURIComponent(staff)}`);
    const data = r?.data || [];
    let paid=0, recv=0;
    tbody.innerHTML = data.length ? data.map(d => {
      paid += parseFloat(d.Paid||0); recv += parseFloat(d.Received||0);
      return `<tr>
        <td>${d.CustomerName||''}</td>
        <td>${d.Date ? new Date(d.Date).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) : ''}</td>
        <td>${d.Paid||0}</td>
        <td>${d.Received||0}</td>
        <td>${d.EntryType||d.Type||''}</td>
        <td>${d.Narration||''}</td>
        <td>${d.SubUser||d.StaffName||''}</td>
      </tr>`;
    }).join('') : '<tr><td colspan="7">No transactions</td></tr>';
    const net = paid - recv;
    tfoot.innerHTML = `<tr><td colspan="2">Total (${data.length})</td><td>₹${paid.toFixed(0)}</td><td>₹${recv.toFixed(0)}</td><td colspan="3">Net: ₹${net.toFixed(0)}</td></tr>`;
  } catch(err) {
    tbody.innerHTML = '<tr><td colspan="7" style="color: #dc3545; padding: 16px;">Failed to load transactions</td></tr>';
  } finally {
    if (btn) {
      btn.disabled = false;
      btn.innerHTML = 'Search';
    }
  }
}

init();
</script>
</body>
</html>
