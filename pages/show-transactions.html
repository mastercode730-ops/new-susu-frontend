<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Susu9 - All Transactions</title>
<script src="/js/theme-preload.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
<link rel="stylesheet" href="/css/main.css">
<style>
/* Flatpickr calendar popup — bold, clear text throughout */
.flatpickr-weekday{font-weight:800!important;color:#000!important;}
.flatpickr-day{font-weight:800!important;color:#000!important;}
.flatpickr-day.flatpickr-disabled,.flatpickr-day.prevMonthDay,.flatpickr-day.nextMonthDay,.flatpickr-day.notAllowed{color:#999!important;font-weight:700!important;}
.flatpickr-day.today{font-weight:900!important;}
.flatpickr-current-month .cur-month,.flatpickr-current-month input.cur-year{font-weight:800!important;color:#000!important;}
.flatpickr-months .flatpickr-month,.flatpickr-current-month{font-weight:800!important;}
/* Bolder, higher-contrast text — visual only, no behavior change */
.content label{font-weight:800!important;color:var(--text)!important;display:block;font-size:.78rem!important;margin-bottom:3px!important;}
.content .card-title{font-weight:800!important;color:var(--text)!important;font-size:1.05rem!important;}
.content .form-control{font-weight:700!important;color:var(--text)!important;background:#fff!important;border:1px solid #888!important;padding:.32rem .6rem!important;height:auto!important;font-size:.85rem!important;}
/* Compact, well-aligned filter box */
.content .card-header{padding:8px 16px!important;}
.content .card-body{padding:10px 16px!important;}
.content .row{margin-left:-6px;margin-right:-6px;}
.content .row>.col{padding-left:6px;padding-right:6px;}
/* Data grid: bold bordered header instead of the faint Bootstrap table look */
.content table{border-collapse:collapse!important;width:100%!important;}
.content table th{background:#d9d9d9!important;border:1px solid #999!important;font-weight:800!important;color:#000!important;padding:8px 14px!important;font-size:.85rem!important;}
.content table td{border:1px solid #ccc!important;padding:7px 14px!important;font-weight:900!important;color:#000!important;font-size:.92rem!important;}
.content table tbody tr{cursor:pointer;transition:background-color 0.15s ease;}
.content table tbody tr:hover{outline:2px solid #16a34a!important;outline-offset:-2px;}
.content table tbody tr:hover td{background:#bbf7d0!important;}
.content table tbody tr.selected{background:#bbf7d0!important;outline:2.5px solid #16a34a!important;outline-offset:-2.5px;}
.content table tbody tr.selected td{background:#bbf7d0!important;}
.table-responsive{overflow-x:auto;}

.action-btn-group{display:inline-flex;gap:4px;}
.btn-row-edit{background:#f59e0b;color:#fff;border:none;border-radius:4px;padding:3px 8px;font-size:0.76rem;font-weight:800;cursor:pointer;}
.btn-row-edit:hover{background:#d97706;}
.btn-row-del{background:#ef4444;color:#fff;border:none;border-radius:4px;padding:3px 8px;font-size:0.76rem;font-weight:800;cursor:pointer;}
.btn-row-del:hover{background:#dc2626;}

.selected-action-bar{display:none;background:#ecfdf5;border:1.5px solid #10b981;border-radius:8px;padding:10px 16px;margin:12px 0 16px 0;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;box-shadow:0 2px 6px rgba(0,0,0,0.05);}
.selected-action-bar.show{display:flex;}

/* Modal styles */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:1050;align-items:center;justify-content:center;padding:12px;}
.modal-bg.show{display:flex;}
.modal-box{background:#fff;border-radius:10px;width:100%;max-width:480px;box-shadow:0 12px 30px rgba(0,0,0,0.25);overflow:hidden;animation:popIn 0.2s ease-out;}
@keyframes popIn{from{transform:scale(0.95);opacity:0;}to{transform:scale(1);opacity:1;}}
.modal-hd{background:#f8fafc;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e2e8f0;}
.modal-hd h4{margin:0;font-size:1.05rem;font-weight:800;color:#0f172a;}
.modal-close{background:none;border:none;font-size:1.4rem;cursor:pointer;color:#64748b;line-height:1;padding:0;}
.modal-close:hover{color:#0f172a;}
.modal-body-inner{padding:18px;}
.modal-form-group{margin-bottom:12px;}
.modal-form-group label{font-size:0.8rem;font-weight:800;color:#334155;margin-bottom:4px;display:block;}
.modal-footer-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;}

/* Vendor theme reserves 62px above .content for a second header row this
   app doesn't render — page-scoped so it doesn't affect other pages. */
.main-panel>.content{margin-top:50px!important;padding-top:8px!important;}
</style>
</head>
<body>

<div class="content">
  <div class="row">
    <div class="col-md-12">
      <div class="card">
        <div class="card-header">
          <div class="card-title">All Transaction</div>
        </div>
        <div class="card-body">
          <div class="row">
            <div class="col">
              <label>From Date</label>
              <div style="position: relative; display: flex; align-items: center;">
                <input type="text" class="form-control" id="txFrom" placeholder="dd/mm/yyyy" style="padding-right: 36px;" onfocus="this.select()">
                <button type="button" id="btnFromCal" aria-label="Open Calendar" tabindex="-1"
                  style="position: absolute; right: 0; top: 0; bottom: 0; width: 36px; border: none; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #555; padding: 0;">
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                </button>
              </div>
            </div>
            <div class="col">
              <label>To Date</label>
              <div style="position: relative; display: flex; align-items: center;">
                <input type="text" class="form-control" id="txTo" placeholder="dd/mm/yyyy" style="padding-right: 36px;" onfocus="this.select()">
                <button type="button" id="btnToCal" aria-label="Open Calendar" tabindex="-1"
                  style="position: absolute; right: 0; top: 0; bottom: 0; width: 36px; border: none; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #555; padding: 0;">
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                </button>
              </div>
            </div>
            <div class="col">
              <label>Customer Name</label>
              <select class="form-control" id="txCust" style="text-transform:capitalize;"><option value="">All Customers</option></select>
            </div>
            <div class="col" id="colStaff">
              <label>Sub User</label>
              <select class="form-control" id="txStaff" style="text-transform:capitalize;"><option value="">All Staff</option></select>
            </div>
          </div>
          <div class="row">
            <div class="col">
              <br>
              <button class="btn btn-primary" id="btnSearch" onclick="loadTx()" style="font-weight: 800; min-width: 100px;">Search</button>
            </div>
          </div>

          <!-- Selection Action Toolbar -->
          <div class="selected-action-bar" id="selectedActionBar">
            <div style="display: flex; align-items: center; gap: 8px;">
              <span style="background: #10b981; color: #fff; font-size: 0.72rem; font-weight: 900; padding: 2px 7px; border-radius: 4px; text-transform: uppercase;">Selected</span>
              <span id="selTxSummary" style="font-weight: 800; color: #064e3b; font-size: 0.92rem;"></span>
            </div>
            <div style="display: flex; gap: 8px;">
              <button type="button" onclick="editSelectedTx()" style="font-weight: 800; font-size: 0.82rem; padding: 5px 14px; background: #f59e0b; border: none; color: #fff; border-radius: 5px; cursor: pointer;">✏ Edit</button>
              <button type="button" onclick="deleteSelectedTx()" style="font-weight: 800; font-size: 0.82rem; padding: 5px 14px; background: #ef4444; border: none; color: #fff; border-radius: 5px; cursor: pointer;">🗑 Delete</button>

        <div class="table-responsive">

            <thead>

                <th>Customer</th><th>Date</th><th>Paid</th><th>Received</th><th>Type</th><th>Narration</th><th id="thSubUser">SubUser</th><th>Action</th>
              </tr>

<!-- Edit Transaction Modal -->

            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>

        <button type="button" class="btn btn-secondary" onclick="closeEditModal()" style="font-weight: 700;">Cancel</button>

      </div>
    </div>

</div>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script>
function toIsoDate(dStr) {
  if (!dStr) return '';
  if (/^\d{4}-\d{2}-\d{2}$/.test(dStr)) return dStr;
  const dmy = String(dStr).trim().match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if (dmy) {
    let p1 = parseInt(dmy[1], 10), p2 = parseInt(dmy[2], 10), yr = parseInt(dmy[3], 10);
    let day = p1, mo = p2;
    if (p2 > 12 && p1 <= 12) { day = p2; mo = p1; }
    return `${yr}-${String(mo).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
  }
  const mo = {Jan:'01',Feb:'02',Mar:'03',Apr:'04',May:'05',Jun:'06',Jul:'07',Aug:'08',Sep:'09',Oct:'10',Nov:'11',Dec:'12'};
  const m = String(dStr).trim().match(/^(\d{1,2})[\/\s-]([A-Za-z]{3})[\/\s-](\d{4})/);
  if (m) {
    const day = m[1].padStart(2, '0');
    const month = mo[m[2].slice(0,3).charAt(0).toUpperCase() + m[2].slice(1,3).toLowerCase()] || '01';
    return `${m[3]}-${month}-${day}`;
  }
  const d = new Date(dStr);
  if (!isNaN(d.getTime())) {
    const y = d.getFullYear();
    const moNum = String(d.getMonth() + 1).padStart(2, '0');
    const da = String(d.getDate()).padStart(2, '0');
    return `${y}-${moNum}-${da}`;
  }
  return '';
}

function fmtDate(d) {
  if (!d) return '';
  if (typeof d === 'string') {
    const s = d.trim();
    if (/^\d{2}\/\d{2}\/\d{4}$/.test(s)) return s;
    const iso = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (iso) return `${iso[3]}/${iso[2]}/${iso[1]}`;
    const dmy = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
    if (dmy) return `${dmy[1].padStart(2, '0')}/${dmy[2].padStart(2, '0')}/${dmy[3]}`;
    const p = new Date(s);
    if (!isNaN(p.getTime())) {
      return `${String(p.getDate()).padStart(2, '0')}/${String(p.getMonth() + 1).padStart(2, '0')}/${p.getFullYear()}`;
    }
    return s;
  }
  const day = String(d.getDate()).padStart(2, '0');
  const mon = String(d.getMonth() + 1).padStart(2, '0');
  const yr = d.getFullYear();
  return `${day}/${mon}/${yr}`;
}

let isSubUser = false;

function bindCalButton(btnId, inputId) {
  const btn = document.getElementById(btnId);
  if (btn) {
    btn.onclick = function(e) {
      e.preventDefault();
      e.stopPropagation();
      const el = document.getElementById(inputId);
      const fp = el ? el._flatpickr : null;
      if (fp) {
        if (fp.isOpen) fp.close();
        else fp.open();
      }
    };
  }
}

function bindAutoSlashDate(id, onDateApplied) {
  const el = document.getElementById(id);
  if (!el) return;

  el.addEventListener('keydown', function(e) {
    if (e.key === 'Backspace') {
      const val = this.value;
      const start = this.selectionStart;
      const end = this.selectionEnd;
      if (start === end && (start === 3 || start === 6) && val[start - 1] === '/') {
        e.preventDefault();
        this.value = val.slice(0, start - 2) + val.slice(start);
        this.setSelectionRange(start - 2, start - 2);
        return;
      }
    }
    if (e.key === 'Enter') {
      e.preventDefault();
      if (id === 'txFrom') {
        const toEl = document.getElementById('txTo');
        if (toEl) { toEl.focus(); toEl.select?.(); }
      } else if (id === 'txTo') {
        const cEl = document.getElementById('txCust');
        if (cEl) cEl.focus();
        loadTx();
      }
    }
  }, true);

  el.addEventListener('input', function(e) {
    if (e.inputType && e.inputType.startsWith('delete')) {
      return;
    }
    const prevPos = this.selectionEnd;
    const prevVal = this.value;
    let v = prevVal.replace(/\D/g, '').slice(0, 8);
    let formatted = '';
    if (v.length > 4) {
      formatted = v.slice(0, 2) + '/' + v.slice(2, 4) + '/' + v.slice(4);
    } else if (v.length > 2) {
      formatted = v.slice(0, 2) + '/' + v.slice(2);
    } else if (v.length === 2) {
      formatted = v + '/';
    } else {
      formatted = v;
    }
    if (v.length === 4 && formatted.length === 5) {
      formatted += '/';
    }
    if (this.value !== formatted) {
      this.value = formatted;
      if (prevPos >= prevVal.length) {
        this.setSelectionRange(formatted.length, formatted.length);
      } else {
        let slashesBefore = (formatted.slice(0, prevPos).match(/\//g) || []).length;
        let oldSlashesBefore = (prevVal.slice(0, prevPos).match(/\//g) || []).length;
        let newPos = prevPos + (slashesBefore - oldSlashesBefore);
        this.setSelectionRange(newPos, newPos);
      }
    }

    if (v.length === 8) {
      const fp = this._flatpickr;
      if (fp) {
        fp.setDate(formatted, false, 'd/m/Y');
      }
      if (typeof onDateApplied === 'function') {
        onDateApplied(formatted);
      }
    }
  });

  el.addEventListener('change', function() {
    if (this.value) {
      let v = this.value.replace(/\D/g, '').slice(0, 8);
      if (v.length === 8) {
        this.value = v.slice(0, 2) + '/' + v.slice(2, 4) + '/' + v.slice(4);
      }
      const fp = this._flatpickr;
      if (fp) {
        fp.setDate(this.value, false, 'd/m/Y');
      }
    }
  });
}

function initDatePickers() {
  const ids = ['txFrom', 'txTo', 'editDate'];
  ids.forEach(id => {
    const el = document.getElementById(id);
    if (!el || el._flatpickr) return;

    const fpCfg = {
      dateFormat: 'd/m/Y',
      clickOpens: false,
      allowInput: true,
      disableMobile: true,
      parseDate: function (datestr) {
        if (!datestr) return new Date();
        if (datestr instanceof Date) return datestr;
        const s = String(datestr).trim();
        const dmy = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
        if (dmy) {
          let p1 = parseInt(dmy[1], 10), p2 = parseInt(dmy[2], 10), yr = parseInt(dmy[3], 10);
          if (p2 > 12 && p1 <= 12) return new Date(yr, p1 - 1, p2);
          return new Date(yr, p2 - 1, p1);
        }
        const m8 = s.match(/^(\d{2})(\d{2})(\d{4})/);
        if (m8) return new Date(parseInt(m8[3], 10), parseInt(m8[2], 10) - 1, parseInt(m8[1], 10));
        const mo = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
        const mAlpha = s.match(/^(\d{1,2})[\/\s-]([A-Za-z]{3})[\/\s-](\d{4})/);
        if (mAlpha) {
          const mKey = mAlpha[2].charAt(0).toUpperCase() + mAlpha[2].slice(1,3).toLowerCase();
          return new Date(parseInt(mAlpha[3], 10), mo[mKey] !== undefined ? mo[mKey] : 0, parseInt(mAlpha[1], 10));
        }
        const iso = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
        if (iso) return new Date(parseInt(iso[1], 10), parseInt(iso[2], 10) - 1, parseInt(iso[3], 10));
        const d = new Date(s);
        return isNaN(d.getTime()) ? new Date() : d;
      },
      formatDate: function (date) {
        const d = String(date.getDate()).padStart(2, '0');
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const y = date.getFullYear();
        return `${d}/${m}/${y}`;
      },
      onClose: function(selectedDates, dateStr, instance) {
        if (instance && instance.element) instance.element.blur();
      },
      onChange: function(selectedDates, dateStr, instance) {
        if (instance && instance.element) instance.element.blur();
        el.dispatchEvent(new Event('change'));
      }
    };

    try {
      flatpickr(el, fpCfg);
    } catch(e) {
      console.warn('Flatpickr init error for ' + id + ':', e);
    }
  });

  bindCalButton('btnFromCal', 'txFrom');
  bindCalButton('btnToCal', 'txTo');
  bindCalButton('btnEditDateCal', 'editDate');

  bindAutoSlashDate('txFrom', () => {
    const nextEl = document.getElementById('txTo');
    if (nextEl) { nextEl.focus(); nextEl.select?.(); }
  });
  bindAutoSlashDate('txTo', () => {
    const cEl = document.getElementById('txCust');
    if (cEl) cEl.focus();
    loadTx();
  });
  bindAutoSlashDate('editDate');
}

let _currentTxList = [];
let _selectedTxIndex = -1;

function selectTxRow(idx) {
  _selectedTxIndex = idx;
  const rows = document.querySelectorAll('#txTbody tr');
  rows.forEach((r, i) => {
    if (i === idx) r.classList.add('selected');
    else r.classList.remove('selected');
  });

  const d = _currentTxList[idx];
  if (!d) return;

  const custName = (d.CustomerName1 || d.CustomerName || 'Self').replace(/\s+\d{4,5}$/, '').trim();
  const amt = parseFloat(d.Paid || 0) > 0 ? d.Paid : d.Received;
  const type = d.EntryType || d.Type || '';
  const dateStr = d.Date ? new Date(d.Date).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : '';

  const summary = `${custName} • ${type} ₹${amt} • ${dateStr}`;
  document.getElementById('selTxSummary').textContent = summary;
  const bar = document.getElementById('selectedActionBar');
  if (bar) bar.classList.add('show');
}

function clearSelectedTx() {
  _selectedTxIndex = -1;
  const rows = document.querySelectorAll('#txTbody tr');
  rows.forEach(r => r.classList.remove('selected'));
  const bar = document.getElementById('selectedActionBar');
  if (bar) bar.classList.remove('show');
}

function editSelectedTx() {
  if (_selectedTxIndex >= 0 && _selectedTxIndex < _currentTxList.length) {
    openEditModalFor(_selectedTxIndex);
  }
}

function deleteSelectedTx() {
  if (_selectedTxIndex >= 0 && _selectedTxIndex < _currentTxList.length) {
    deleteTxAtIndex(_selectedTxIndex);
  }
}

function openEditModalFor(idx) {
  const d = _currentTxList[idx];
  if (!d) return;

  document.getElementById('editAID').value = d.AID;
  const amt = parseFloat(d.Paid || 0) > 0 ? d.Paid : d.Received;
  document.getElementById('editAmount').value = amt || '';
  document.getElementById('editNarration').value = d.Narration || '';

  // Type
  const entryType = d.EntryType || d.Type || 'Paid';
  document.getElementById('editType').value = entryType;

  // Customer
  const custVal = (d.fCustID != null && d.fCustID != '0') ? String(d.fCustID) : '0';
  document.getElementById('editCust').value = custVal;

  // Staff
  if (!isSubUser) {
    const staffVal = (d.fStaff != null && d.fStaff != '0') ? String(d.fStaff) : '0';
    document.getElementById('editStaff').value = staffVal;
  }

  // Date
  if (d.Date) {
    const dt = new Date(d.Date);
    const day = String(dt.getDate()).padStart(2, '0');
    const mo = String(dt.getMonth() + 1).padStart(2, '0');
    const yr = dt.getFullYear();
    const formatted = `${day}/${mo}/${yr}`;
    const el = document.getElementById('editDate');
    el.value = formatted;
    if (el._flatpickr) el._flatpickr.setDate(formatted, false, 'd/m/Y');
  }

  document.getElementById('editModal').classList.add('show');
}

function closeEditModal() {
  document.getElementById('editModal').classList.remove('show');
}

async function saveEditTx() {
  const aid = document.getElementById('editAID').value;
  const dateStr = document.getElementById('editDate').value;
  const date = toIsoDate(dateStr);
  const customerUID = document.getElementById('editCust').value;
  const type = document.getElementById('editType').value;
  const amount = document.getElementById('editAmount').value;
  const staffID = isSubUser ? '0' : (document.getElementById('editStaff')?.value || '0');
  const narration = document.getElementById('editNarration').value.trim();

  if (!amount || parseFloat(amount) <= 0) {
    alert('Please enter a valid amount');
    document.getElementById('editAmount').focus();
    return;
  }
  if (!date) {
    alert('Please enter a valid date');
    document.getElementById('editDate').focus();
    return;
  }

  const btn = document.getElementById('btnSaveEdit');
  btn.disabled = true;
  btn.innerText = 'Saving...';

  try {
    const r = await API.put(`/api/accounts/${aid}`, {
      date,
      customerUID,
      type,
      amount,
      staffID,
      narration
    });
    if (r?.success) {
      closeEditModal();
      clearSelectedTx();
      if (typeof swal === 'function') {
        swal('Success!', 'Transaction updated successfully!', { icon: 'success', timer: 1200, buttons: false });
      } else {
        alert('Transaction updated successfully!');
      }
      await loadTx();
    } else {
      alert(r?.message || 'Failed to update transaction');
    }
  } catch(e) {
    alert('Error updating transaction: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.innerText = 'Save Changes';
  }
}

async function deleteTxAtIndex(idx) {
  const d = _currentTxList[idx];
  if (!d) return;

  const custName = (d.CustomerName1 || d.CustomerName || 'Self').replace(/\s+\d{4,5}$/, '').trim();
  const amt = parseFloat(d.Paid || 0) > 0 ? d.Paid : d.Received;

  const confirmed = confirm(`Are you sure you want to delete this transaction?\n\nCustomer: ${custName}\nAmount: ₹${amt}\nType: ${d.EntryType || d.Type}`);
  if (!confirmed) return;

  try {
    const r = await API.delete(`/api/accounts/${d.AID}`);
    if (r?.success) {
      clearSelectedTx();
      if (typeof swal === 'function') {
        swal('Deleted!', 'Transaction deleted successfully!', { icon: 'success', timer: 1200, buttons: false });
      } else {
        alert('Transaction deleted successfully!');
      }
      await loadTx();
    } else {
      alert(r?.message || 'Failed to delete transaction');
    }
  } catch(e) {
    alert('Error deleting transaction: ' + e.message);
  }
}

async function init() {
  const u = await initPage('show-transactions');
  isSubUser = !!(u?.SubUID);
  if (isSubUser) {
    const colStaff = document.getElementById('colStaff');
    if (colStaff) colStaff.style.display = 'none';
    const thSubUser = document.getElementById('thSubUser');
    if (thSubUser) thSubUser.style.display = 'none';
    const editStaffGroup = document.getElementById('editStaffGroup');
    if (editStaffGroup) editStaffGroup.style.display = 'none';
    const tdInit = document.getElementById('tdInit');
    if (tdInit) tdInit.colSpan = 7;
  } else {
    const sr = await API.get('/api/accounts/subusers');
    const staffOptions = '<option value="">All Staff</option><option value="0">Self</option>' + (sr?.data||[]).map(s => `<option value="${s.SubUserID}">${s.subusername}</option>`).join('');
    document.getElementById('txStaff').innerHTML = staffOptions;
    document.getElementById('editStaff').innerHTML = '<option value="0">Self</option>' + (sr?.data||[]).map(s => `<option value="${s.SubUserID}">${s.subusername}</option>`).join('');
  }
  const cr = await API.get('/api/accounts/customers');
  const custOptions = (isSubUser ? '<option value="">All Customers</option>' : '<option value="">All Customers</option><option value="0">Self</option>') + (cr?.data||[]).map(c => {
    const cName = (c.Name || c.CustomerName || '').replace(/\s+\d{4,5}$/, '').trim();
    return `<option value="${c.UID||c.CID}">${cName}</option>`;
  }).join('');
  document.getElementById('txCust').innerHTML = custOptions;
  document.getElementById('editCust').innerHTML = '<option value="0">Self</option>' + (cr?.data||[]).map(c => {
    const cName = (c.Name || c.CustomerName || '').replace(/\s+\d{4,5}$/, '').trim();
    return `<option value="${c.UID||c.CID}">${cName}</option>`;
  }).join('');

  const now = new Date(new Date().getTime()+5.5*3600000).toISOString().split('T')[0];
  const dr = await API.get('/api/accounts/latest-date');
  const lastEntry = localStorage.getItem('accounts_last_entry_date') || localStorage.getItem('accounts_last_date');
  let defaultDate = toIsoDate(lastEntry) || toIsoDate(dr?.date) || now;

  const elFrom = document.getElementById('txFrom');
  const elTo = document.getElementById('txTo');
  elFrom.value = fmtDate(defaultDate);
  elTo.value = fmtDate(defaultDate);

  const p = new URLSearchParams(location.search);
  if (p.get('SUID')) document.getElementById('txStaff').value = p.get('SUID');
  if (p.get('customerUID')) document.getElementById('txCust').value = p.get('customerUID');
  if (p.get('from')) {
    const f = toIsoDate(p.get('from'));
    if (f) elFrom.value = fmtDate(f);
  }
  if (p.get('to')) {
    const t = toIsoDate(p.get('to'));
    if (t) elTo.value = fmtDate(t);
  }
  initDatePickers();

  // Close modal when clicking outside
  document.getElementById('editModal')?.addEventListener('click', (e) => {
    if (e.target && e.target.id === 'editModal') closeEditModal();
  });

  loadTx();
}

async function loadTx() {
  clearSelectedTx();
  const btn = document.getElementById('btnSearch');
  const tbody = document.getElementById('txTbody');
  const tfoot = document.getElementById('txFoot');
  const colSpan = isSubUser ? 7 : 8;
  const netColSpan = isSubUser ? 3 : 4;

  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Searching...';
  }
  tbody.innerHTML = `<tr><td colspan="${colSpan}" style="padding: 24px; font-weight: 800; color: #1572e8; font-size: 0.95rem;"><i class="fa fa-spinner fa-spin" style="font-size: 1.3rem; vertical-align: middle; margin-right: 8px;"></i> Loading Transactions...</td></tr>`;
  tfoot.innerHTML = '';

  try {
    let from = toIsoDate(document.getElementById('txFrom').value);
    let to = toIsoDate(document.getElementById('txTo').value);
    const cust = document.getElementById('txCust').value;
    const staff = document.getElementById('txStaff').value;

    const r = await API.get(`/api/accounts/list?fromDate=${encodeURIComponent(from)}&toDate=${encodeURIComponent(to)}&custUID=${encodeURIComponent(cust)}&customerUID=${encodeURIComponent(cust)}&staffUID=${encodeURIComponent(staff)}&staffID=${encodeURIComponent(staff)}`);
    const data = r?.data || [];
    _currentTxList = data;
    let paid=0, recv=0;
    tbody.innerHTML = data.length ? data.map((d, i) => {
      paid += parseFloat(d.Paid||0); recv += parseFloat(d.Received||0);
      const custName = (d.CustomerName1 || d.CustomerName || 'Self').replace(/\s+\d{4,5}$/, '').trim();
      return `<tr onclick="selectTxRow(${i})">
        <td>${custName}</td>
        <td>${d.Date ? new Date(d.Date).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) : ''}</td>
        <td>${d.Paid||0}</td>
        <td>${d.Received||0}</td>
        <td>${d.EntryType||d.Type||''}</td>
        <td>${d.Narration||''}</td>
        ${isSubUser ? '' : `<td>${d.SubUser||d.StaffName||''}</td>`}
        <td>
          <div class="action-btn-group">
            <button type="button" class="btn-row-edit" title="Edit" onclick="event.stopPropagation(); openEditModalFor(${i})">Edit</button>
            <button type="button" class="btn-row-del" title="Delete" onclick="event.stopPropagation(); deleteTxAtIndex(${i})">Delete</button>
          </div>
        </td>
      </tr>`;
    }).join('') : `<tr><td colspan="${colSpan}">No transactions</td></tr>`;
    const net = paid - recv;
    tfoot.innerHTML = `<tr><td colspan="2">Total (${data.length})</td><td>₹${paid.toFixed(0)}</td><td>₹${recv.toFixed(0)}</td><td colspan="${netColSpan}">Net: ₹${net.toFixed(0)}</td></tr>`;
  } catch(err) {
    tbody.innerHTML = `<tr><td colspan="${colSpan}" style="color: #dc3545; padding: 16px;">Failed to load transactions</td></tr>`;
  } finally {
    if (btn) {
      btn.disabled = false;
      btn.innerHTML = 'Search';
    }
  }
}

init();
</script>
</body>
</html>
