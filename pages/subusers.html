<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sub Users - Susu9</title>
<script src="/js/theme-preload.js"></script>
<style>
.hideGridColumn { display:none; }
.content .form-group input[type=checkbox] { width:16px; height:16px; vertical-align:middle; }
.content .form-group label[for^="chk"] { display:inline!important; margin:0 0 0 4px!important; vertical-align:middle; font-weight:800!important; cursor:pointer; }
.btn-spinner {
  display: inline-block;
  width: 14px;
  height: 14px;
  border: 2px solid rgba(255,255,255,0.4);
  border-top-color: #fff;
  border-radius: 50%;
  animation: btn-spin 0.6s linear infinite;
  vertical-align: middle;
  margin-right: 6px;
}
@keyframes btn-spin {
  to { transform: rotate(360deg); }
}
</style>
</head>
<body>

<div class="content">
  <div class="row">
    <div class="col-md-12">
      <div class="card">
        <div class="card-header">
          <div class="card-title">
            Create Sub User
            <button class="btn btn-success" style="float:right;font-weight:900;" onclick="window.location.href='/pages/assign-clients.html'">
              Assign Customers <i class="fas fa-users-cog"></i>
            </button>
          </div>
        </div>
        <div class="card-body">
          <div class="row">
            <div class="col-md-3">
              <div class="form-group">
                <label for="txtName">Name</label>
                <input type="hidden" id="subid">
                <input type="text" class="form-control" id="txtName" placeholder="Enter Name"
                  style="text-transform:capitalize;" tabindex="1" onkeydown="enterNext(event,1)">
                <span class="err-msg" id="errName" style="display:none;color:red;">*</span>
              </div>
            </div>
            <div class="col-md-3">
              <div class="form-group">
                <label for="txtMobile">Mobile</label>
                <input type="text" class="form-control" id="txtMobile" placeholder="Enter Mobile No"
                  maxlength="10" tabindex="2" onkeydown="enterNext(event,2)">
                <span class="err-msg" id="errMobile" style="display:none;color:red;">*</span>
              </div>
            </div>
            <div class="col-md-3">
              <div class="form-group">
                <label for="txtPassword">Password</label>
                <input type="text" class="form-control" id="txtPassword" placeholder="Enter Password"
                  tabindex="3" onkeydown="enterNext(event,3)">
                <span class="err-msg" id="errPwd" style="display:none;color:red;">*</span>
              </div>
            </div>
            <div class="col-md-3">
              <div class="form-group">
                <label for="isactive">Active</label>
                <input type="checkbox" id="isactive" checked style="margin-left:25px;" tabindex="4">
              </div>
            </div>
          </div>
        </div>
        <div class="card-action">
          <button class="btn btn-success" id="btnSave" tabindex="5" onclick="saveSubUser()">Save</button>
          <button class="btn btn-danger" tabindex="6" onclick="cancelForm()">Cancel</button>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-title" id="formTitle">All Sub Users</div>
        </div>
        <div class="table-responsive">
          <table class="table-bordered-bd-primary table-hover" cellpadding="4"
            style="text-transform:capitalize;text-align:center;width:100%;">
            <thead>
              <tr style="background-color:LightGray;">
                <th style="width:50px;">Edit</th>
                <th style="width:100px;">ID</th>
                <th style="width:100px;">Password</th>
                <th style="width:100px;">Name</th>
                <th style="width:50px;">Mobile</th>
                <th style="width:100px;">Active</th>
              </tr>
            </thead>
            <tbody id="bodyUsers">
              <tr><td colspan="6">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Access Right Card -->
      <div class="card">
        <div class="card-header">
          <div class="card-title">Access Right</div>
        </div>
        <div class="card-body">
          <div class="row">
            <div class="col-md-4">
              <div class="form-group">
                <label for="ddlSubUsers">Sub User</label>
                <select id="ddlSubUsers" class="form-control" onchange="loadAccessRights()">
                  <option value="">Select Sub User</option>
                </select>
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col-md-2"><div class="form-group"><input type="checkbox" id="chkADDContacts"> <label for="chkADDContacts">Contacts</label></div></div>
            <div class="col-md-2"><div class="form-group"><input type="checkbox" id="chkADDGames"> <label for="chkADDGames">Games</label></div></div>
            <div class="col-md-2"><div class="form-group"><input type="checkbox" id="chkResult"> <label for="chkResult">Result</label></div></div>
            <div class="col-md-2"><div class="form-group"><input type="checkbox" id="chkHisab"> <label for="chkHisab">Hisab</label></div></div>
            <div class="col-md-2"><div class="form-group"><input type="checkbox" id="chkHisabSummary"> <label for="chkHisabSummary">Hisab Summary</label></div></div>
            <div class="col-md-2" style="display:none;"><div class="form-group"><input type="checkbox" id="chkDateWiseHisab"> <label>Date Wise Hisab</label></div></div>
            <div class="col-md-2"><div class="form-group"><input type="checkbox" id="chkAccounts"> <label for="chkAccounts">Accounts</label></div></div>
            <div class="col-md-2"><div class="form-group"><input type="checkbox" id="chkShowAllAccounts"> <label for="chkShowAllAccounts">Show All Accounts</label></div></div>
            <div class="col-md-2"><div class="form-group"><input type="checkbox" id="chkBalance"> <label for="chkBalance">Balance</label></div></div>
            <div class="col-md-2"><div class="form-group"><input type="checkbox" id="chkLC"> <label for="chkLC">LC</label></div></div>
            <div class="col-md-2"><div class="form-group"><input type="checkbox" id="chkYantri"> <label for="chkYantri">Yantri</label></div></div>
          </div>
        </div>
        <div class="card-action">
          <button class="btn btn-success" id="btnSaveAccess" onclick="saveAccessRights()">Save Access Rights</button>
          <button class="btn btn-danger" onclick="resetAccess()">Reset</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script>
let myUID = null;

async function init() {
  const u = await initPage('subusers');
  if (!u) return;
  myUID = u.UID;
  if (u.SubUID) { window.location.href = '/pages/home.html'; return; }

  await loadUsers();
  document.getElementById('txtName').focus();
  document.getElementById('txtName').select();
}

// ── showspecificuser() ──
async function loadUsers() {
  const tbody = document.getElementById('bodyUsers');
  tbody.innerHTML = '<tr><td colspan="6">Loading...</td></tr>';
  const r = await API.get('/api/admin/subusers');
  if (!r?.success || !r.data?.length) {
    tbody.innerHTML = '<tr><td colspan="6">No Sub Users Found</td></tr>';
    return;
  }
  tbody.innerHTML = r.data.map(u => {
    const isActive = u.IsActive === true || u.IsActive === 1 || String(u.IsActive).toLowerCase() === 'true' || String(u.IsActive) === '1';
    return `
    <tr>
      <td>
        <img src="/vendor/images/edit-icon-orange-pencil-0.png" width="35" height="35" style="cursor:pointer;"
          onclick="editUser('${u.SubUserID}','${esc(u.subusername)}','${u.Mobile}','${u.Password}',${isActive})">
      </td>
      <td>${u.SubUserID}</td>
      <td>${u.Password||''}</td>
      <td style="text-transform:capitalize">${u.subusername||''}</td>
      <td>${u.Mobile||''}</td>
      <td>
        <span style="padding:4px 10px;border-radius:2px;font-weight:bold;color:#fff;background-color:${isActive ? '#31ce36' : '#f25961'};">
          ${isActive ? 'Active' : 'Inactive'}
        </span>
      </td>
    </tr>`;
  }).join('');

  const ddl = document.getElementById('ddlSubUsers');
  if (ddl) {
    const selVal = ddl.value;
    ddl.innerHTML = '<option value="">Select Sub User</option>';
    r.data.forEach(u => {
      const opt = document.createElement('option');
      opt.value = u.SubUserID;
      const name = u.subusername ? `${u.subusername} (${u.Mobile})` : (u.Mobile || u.SubUserID);
      opt.textContent = name;
      if (String(u.SubUserID) === String(selVal)) opt.selected = true;
      ddl.appendChild(opt);
    });
  }
}

// ── savesubuser_Click ──
async function saveSubUser() {
  const name     = document.getElementById('txtName').value.trim();
  const mobile   = document.getElementById('txtMobile').value.trim();
  const password = document.getElementById('txtPassword').value.trim();
  const isActive = document.getElementById('isactive').checked;
  const subid    = document.getElementById('subid').value;
  const btnText  = document.getElementById('btnSave').textContent;

  // Validation
  if (!name) {
    document.getElementById('errName').style.display = 'inline';
    showToast('Name is required!', true);
    document.getElementById('txtName').focus();
    return;
  }
  document.getElementById('errName').style.display = 'none';

  if (!mobile) {
    document.getElementById('errMobile').style.display = 'inline';
    showToast('Mobile number is required!', true);
    document.getElementById('txtMobile').focus();
    return;
  }
  document.getElementById('errMobile').style.display = 'none';

  if (!password) {
    document.getElementById('errPwd').style.display = 'inline';
    showToast('Password is required!', true);
    document.getElementById('txtPassword').focus();
    return;
  }
  document.getElementById('errPwd').style.display = 'none';

  try {
    let r;
    if (btnText === 'Save' && mobile) {
      // ASPX: SP AddSubusers
      r = await API.post('/api/admin/subusers', { name, mobile, password, isActive });
    } else if (btnText === 'Update' && subid) {
      // ASPX: SP UpdateSubusers
      r = await API.put(`/api/admin/subusers/${subid}`, { name, mobile, password, isActive });
    }

    if (r?.success) {
      showToast(btnText === 'Save' ? 'Data Saved Successfully!' : 'Data Updated Successfully!');
      cancelForm();
      await loadUsers();
    } else {
      showToast('Something Went Wrong!', true);
    }
  } catch(e) {
    showToast('Something Went Wrong!', true);
  }
}

// ── GridView1_RowCommand "Select" → fill form ──
function editUser(subid, name, mobile, password, isActive) {
  document.getElementById('subid').value         = subid;
  document.getElementById('txtName').value       = name;
  document.getElementById('txtMobile').value     = mobile;
  document.getElementById('txtPassword').value   = password;
  document.getElementById('isactive').checked    = (isActive === true || isActive === 'True' || isActive === 'true' || isActive === 1 || isActive === '1');
  document.getElementById('btnSave').textContent = 'Update';
  document.getElementById('formTitle').textContent = 'All Sub Users';
  document.getElementById('txtMobile').focus();

  const ddl = document.getElementById('ddlSubUsers');
  if (ddl) {
    ddl.value = subid;
    loadAccessRights();
  }
}

// ── btnCancel_Click → Refresh() ──
function cancelForm() {
  document.getElementById('subid').value         = '';
  document.getElementById('txtName').value       = '';
  document.getElementById('txtMobile').value     = '';
  document.getElementById('txtPassword').value   = '';
  document.getElementById('isactive').checked    = true;
  document.getElementById('btnSave').textContent = 'Save';
  ['errName','errMobile','errPwd'].forEach(id => document.getElementById(id).style.display = 'none');
  document.getElementById('txtName').focus();

  resetAccess();
  const ddl = document.getElementById('ddlSubUsers');
  if (ddl) ddl.value = '';
}

// ── ACCESS RIGHTS FUNCTIONS ──
async function loadAccessRights() {
  const subUserID = document.getElementById('ddlSubUsers').value;
  if (!subUserID) { resetAccess(); return; }

  let res = await API.get(`/api/admin/access-rights/${subUserID}`);
  if (!res || !res.success || !res.data) {
    res = await API.get(`/api/admin/access-rights?subUID=${subUserID}`);
  }
  const ar = res && res.data ? (Array.isArray(res.data) ? res.data[0] : res.data) : null;
  if (!ar) {
    resetAccess();
    return;
  }

  const isTrue = v => v === true || v === 'True' || v === 1 || String(v) === '1' || String(v).toLowerCase() === 'true';
  document.getElementById('chkADDContacts').checked = isTrue(ar.ADDContacts);
  document.getElementById('chkADDGames').checked = isTrue(ar.ADDGames);
  document.getElementById('chkResult').checked = isTrue(ar.Result);
  document.getElementById('chkHisab').checked = isTrue(ar.Hisab);
  document.getElementById('chkHisabSummary').checked = isTrue(ar.HisabSummary);
  document.getElementById('chkDateWiseHisab').checked = isTrue(ar.DateWiseHisab);
  document.getElementById('chkAccounts').checked = isTrue(ar.Accounts);
  document.getElementById('chkShowAllAccounts').checked = isTrue(ar.ShowAllAccounts);
  document.getElementById('chkBalance').checked = isTrue(ar.Balance);
  document.getElementById('chkLC').checked = isTrue(ar.LC);
  document.getElementById('chkYantri').checked = isTrue(ar.Yantri);
}

function resetAccess() {
  ['chkADDContacts','chkADDGames','chkResult','chkHisab','chkHisabSummary',
   'chkDateWiseHisab','chkAccounts','chkShowAllAccounts','chkBalance','chkLC','chkYantri']
    .forEach(id => { const el = document.getElementById(id); if (el) el.checked = false; });
}

async function saveAccessRights() {
  const subUserID = document.getElementById('ddlSubUsers').value;
  if (!subUserID) {
    showToast('Select a user first', true);
    return;
  }

  const btn = document.getElementById('btnSaveAccess');
  const origHtml = btn ? btn.innerHTML : '';
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<span class="btn-spinner"></span>Saving...';
  }

  try {
    const body = {
      subUserID,
      addContacts: document.getElementById('chkADDContacts').checked,
      addGames: document.getElementById('chkADDGames').checked,
      result: document.getElementById('chkResult').checked,
      hisab: document.getElementById('chkHisab').checked,
      hisabSummary: document.getElementById('chkHisabSummary').checked,
      dateWiseHisab: document.getElementById('chkDateWiseHisab').checked,
      accounts: document.getElementById('chkAccounts').checked,
      showAllAccounts: document.getElementById('chkShowAllAccounts').checked,
      balance: document.getElementById('chkBalance').checked,
      lc: document.getElementById('chkLC').checked,
      yantri: document.getElementById('chkYantri').checked
    };

    const res = await API.post('/api/admin/access-rights', body);
    if (res && res.success) {
      showToast('Access rights saved!');
    } else {
      showToast(res?.message || 'Error saving access rights', true);
    }
  } catch (err) {
    showToast('Error saving access rights', true);
  } finally {
    if (btn) {
      btn.disabled = false;
      btn.innerHTML = origHtml;
    }
  }
}

// ── Tab Index Enter → next field ──
function enterNext(e, tabIdx) {
  if (e.key === 'Enter') {
    e.preventDefault();
    const next = document.querySelector(`[tabindex="${tabIdx + 1}"]`);
    if (next) next.focus();
  }
}

function esc(s) { return String(s||'').replace(/'/g,"\\'"); }

// ── SweetAlert-based feedback (matches original ASPX SucessMessage/ErrorMessage) ──
function showToast(msg, err=false) {
  swal(err ? 'Wrong Inputs!' : 'Sucess!', msg, {
    icon: err ? 'error' : 'success',
    timer: 900,
    buttons: false
  });
}

window.__escPageHandler = function() {
  window.location.href = '/pages/home.html';
  return true;
};

init();
</script>
</body>
</html>
