<script>
let myUID = null;
let _vsGameHisab = [];
let _vsMyHisab   = [];
let _currentDate = '';
let _currentHistMode = '';

// ── INIT ──
async function init() {
  const u = await initPage('hisab');
  if (!u) return;
  myUID = u.UID;

  initDatePicker();
  await setLatestDate();
  await bindGrid();
  document.getElementById('txtsearch').focus();
}

function parseDmy(s) {
  if (!s) return new Date();
  const p = s.split('/');
  if (p.length === 3) return new Date(parseInt(p[2],10), parseInt(p[1],10)-1, parseInt(p[0],10));
  return new Date(s);
}

function formatToDdMmYyyy(dateInput) {
  if (!dateInput) return '';
  if (dateInput instanceof Date) {
    const dd = String(dateInput.getDate()).padStart(2, '0');
    const mm = String(dateInput.getMonth() + 1).padStart(2, '0');
    return `${dd}/${mm}/${dateInput.getFullYear()}`;
  }
  const s = String(dateInput).trim();
  if (/^\d{2}\/\d{2}\/\d{4}$/.test(s)) return s;
  const dmy = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if (dmy) {
    return dmy[1].padStart(2, '0') + '/' + dmy[2].padStart(2, '0') + '/' + dmy[3];
  }
  const mo = {Jan:1,Feb:2,Mar:3,Apr:4,May:5,Jun:6,Jul:7,Aug:8,Sep:9,Oct:10,Nov:11,Dec:12};
  const mAlpha = s.match(/^(\d{1,2})[\/\s-]([A-Za-z]{3})[\/\s-](\d{4})/);
  if (mAlpha) {
    const d = mAlpha[1].padStart(2, '0');
    const mKey = mAlpha[2].charAt(0).toUpperCase() + mAlpha[2].slice(1,3).toLowerCase();
    const m = String(mo[mKey] !== undefined ? mo[mKey] : 1).padStart(2, '0');
    return `${d}/${m}/${mAlpha[3]}`;
  }
  const iso = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if (iso) {
    const d = String(parseInt(iso[3], 10)).padStart(2, '0');
    const m = String(parseInt(iso[2], 10)).padStart(2, '0');
    return `${d}/${m}/${iso[1]}`;
  }
  return s;
}

function bindAutoSlashDate(id, onDateApplied) {
  const el = document.getElementById(id);
  if (!el) return;

  el.addEventListener('keydown', function(e) {
    if (e.key === 'Backspace') {
      const val = this.value;
      const start = this.selectionStart;
      const end = this.selectionEnd;
      // If cursor is immediately after a slash, delete both the slash and the preceding digit
      if (start === end && (start === 3 || start === 6) && val[start - 1] === '/') {
        e.preventDefault();
        this.value = val.slice(0, start - 2) + val.slice(start);
        this.setSelectionRange(start - 2, start - 2);
        return;
      }
    }
    if (e.key === 'Enter') {
      e.preventDefault();
      if (typeof onDateApplied === 'function') onDateApplied(this.value);
      else bindGrid();
    }
  }, true);

  el.addEventListener('input', function(e) {
    if (e.inputType && e.inputType.startsWith('delete')) {
      return;
    }
    const prevPos = this.selectionEnd;
    const prevVal = this.value;
    let v = prevVal.replace(/\D/g, '').slice(0, 8);
    let formatted = '';
    if (v.length > 4) {
      formatted = v.slice(0, 2) + '/' + v.slice(2, 4) + '/' + v.slice(4);
    } else if (v.length > 2) {
      formatted = v.slice(0, 2) + '/' + v.slice(2);
    } else if (v.length === 2) {
      formatted = v + '/';
    } else {
      formatted = v;
    }
    if (v.length === 4 && formatted.length === 5) {
      formatted += '/';
    }
    if (this.value !== formatted) {
      this.value = formatted;
      if (prevPos >= prevVal.length) {
        this.setSelectionRange(formatted.length, formatted.length);
      } else {
        let slashesBefore = (formatted.slice(0, prevPos).match(/\//g) || []).length;
        let oldSlashesBefore = (prevVal.slice(0, prevPos).match(/\//g) || []).length;
        let newPos = prevPos + (slashesBefore - oldSlashesBefore);
        this.setSelectionRange(newPos, newPos);
      }
    }

    if (v.length === 8) {
      const fp = window.fpStartDate || this._flatpickr;
      if (fp) {
        fp.setDate(formatted, false, 'd/m/Y');
      }
      if (typeof onDateApplied === 'function') {
        onDateApplied(formatted);
      }
    }
  });

  el.addEventListener('change', function() {
    if (this.value) {
      let v = this.value.replace(/\D/g, '').slice(0, 8);
      if (v.length === 8) {
        this.value = v.slice(0, 2) + '/' + v.slice(2, 4) + '/' + v.slice(4);
      }
      const fp = window.fpStartDate || this._flatpickr;
      if (fp) {
        fp.setDate(this.value, false, 'd/m/Y');
      }
      if (typeof onDateApplied === 'function') {
        onDateApplied(this.value);
      }
    }
  });
}

function bindCalButton(btnId, inputId) {
  const btn = document.getElementById(btnId);
  if (btn) {
    btn.onclick = function(e) {
      e.preventDefault();
      e.stopPropagation();
      const fp = window.fpStartDate || document.getElementById(inputId)?._flatpickr;
      if (fp) {
        if (fp.isOpen) fp.close();
        else fp.open();
      }
    };
  }
}

function initDatePicker() {
  const el = document.getElementById('txtStartDate');
  if (!el || window.fpStartDate) return;

  const fpCfg = {
    dateFormat: 'd/m/Y',
    clickOpens: false,
    allowInput: true,
    disableMobile: true,
    parseDate: function (datestr) {
      if (!datestr) return new Date();
      if (datestr instanceof Date) return datestr;
      const s = String(datestr).trim();
      const dmy = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
      if (dmy) {
        let p1 = parseInt(dmy[1], 10), p2 = parseInt(dmy[2], 10), yr = parseInt(dmy[3], 10);
        if (p2 > 12 && p1 <= 12) return new Date(yr, p1 - 1, p2);
        return new Date(yr, p2 - 1, p1);
      }
      const m8 = s.match(/^(\d{2})(\d{2})(\d{4})/);
      if (m8) return new Date(parseInt(m8[3], 10), parseInt(m8[2], 10) - 1, parseInt(m8[1], 10));
      const mo = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
      const mAlpha = s.match(/^(\d{1,2})[\/\s-]([A-Za-z]{3})[\/\s-](\d{4})/);
      if (mAlpha) {
        const mKey = mAlpha[2].charAt(0).toUpperCase() + mAlpha[2].slice(1,3).toLowerCase();
        return new Date(parseInt(mAlpha[3], 10), mo[mKey] !== undefined ? mo[mKey] : 0, parseInt(mAlpha[1], 10));
      }
      const iso = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
      if (iso) return new Date(parseInt(iso[1], 10), parseInt(iso[2], 10) - 1, parseInt(iso[3], 10));
      const d = new Date(s);
      return isNaN(d.getTime()) ? new Date() : d;
    },
    formatDate: function (date) {
      const d = String(date.getDate()).padStart(2, '0');
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const y = date.getFullYear();
      return `${d}/${m}/${y}`;
    },
    onClose: function(selectedDates, dateStr, instance) {
      if (instance && instance.element) instance.element.blur();
    },
    onChange: function(selectedDates, dateStr, instance) {
      if (instance && instance.element) instance.element.blur();
      bindGrid();
    }
  };

  try {
    window.fpStartDate = flatpickr(el, fpCfg);
  } catch(e) {
    console.warn('Flatpickr init error:', e);
  }

  bindCalButton('btnDateCal', 'txtStartDate');
  bindAutoSlashDate('txtStartDate', () => { bindGrid(); });
}

function getPreviousDate() {
  const istOffset = 5.5 * 60 * 60 * 1000;
  const d = new Date(Date.now() + istOffset);
  d.setUTCDate(d.getUTCDate() - 1);
  const dd = String(d.getUTCDate()).padStart(2, '0');
  const mm = String(d.getUTCMonth() + 1).padStart(2, '0');
  return `${dd}/${mm}/${d.getUTCFullYear()}`;
}

// ── Bind Latest Work Date ──
async function setLatestDate() {
  let targetDate = '';
  try {
    const r = await API.get('/api/hisab/latest-date');
    const d = r?.dmy || r?.data || r?.date;
    if (r?.success && d) targetDate = formatToDdMmYyyy(d);
  } catch(e) {}
  if (!targetDate) targetDate = getPreviousDate();
  const el = document.getElementById('txtStartDate');
  if (el) el.value = targetDate;
  if (window.fpStartDate) {
    window.fpStartDate.setDate(parseDmy(targetDate), false, 'd/m/Y');
  }
  _currentDate = targetDate;
}

// ── BindGrid() — calls both SPs ──
async function bindGrid() {
  _currentDate = document.getElementById('txtStartDate').value || _currentDate;

  // Reset search
  document.getElementById('txtsearch').value = '';

  // Parallel: GetDateWiseMyHisab + GetDateWiseWinAmount
  const [r1, r2] = await Promise.all([
    API.get(`/api/hisab/game-hisab?date=${encodeURIComponent(_currentDate)}&filter=`),
    API.get(`/api/hisab/win-amount?date=${encodeURIComponent(_currentDate)}&filter=`)
  ]);

  // grvGameHisab — GetDateWiseMyHisab
  _vsGameHisab = (r1?.success) ? (r1.data || []) : [];
  renderGameHisab(_vsGameHisab);

  // grvgames — GetDateWiseWinAmount
  _vsMyHisab = (r2?.success) ? (r2.data || []) : [];
  renderMyHisab(_vsMyHisab);

  if (window.fpStartDate) window.fpStartDate.close();
}

function onSearchClick(e) {
  if (e) { e.preventDefault(); e.stopPropagation(); }
  if (window.fpStartDate) {
    window.fpStartDate.close();
    if (window.fpStartDate.element) window.fpStartDate.element.blur();
  }
  if (document.activeElement && document.activeElement.blur) {
    document.activeElement.blur();
  }
  bindGrid();
}

// ── Customer Name Cleaner ──
function getCleanCustName(r) {
  if (!r) return '';
  const val = typeof r === 'string' ? r : (r.CustomerName || r.CMobile || r.Mobile || r.UID || '');
  const cleaned = String(val).replace(/\s*[\(\[]?\d+[\)\]]?$/, '').replace(/\s+\d+$/, '').trim();
  return cleaned || String(val).trim();
}

// ── Render grvGameHisab ──
// ASPX: Sorted CMobile ASC, Footer: SRNo|Total|Sum(TotalAmount)|Sum(Balance)
function renderGameHisab(rows) {
  const tbody = document.getElementById('bodyGameHisab');
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="4" class="emsg">No Data Found!</td></tr>';
    setText('ft_gh_sale','–'); setText('ft_gh_bal','–');
    return;
  }
  const sorted = [...rows].sort((a,b)=>getCleanCustName(a).localeCompare(getCleanCustName(b)) || (a.CMobile||'').localeCompare(b.CMobile||''));
  tbody.innerHTML = sorted.map((r,i) => `
    <tr onclick="selectRow(this,'bodyGameHisab')" tabindex="0"
        onkeydown="arrowNav(event,this,'bodyGameHisab')">
      <td>${i+1}</td>
      <td class="link-cell" onclick="event.stopPropagation();showHistory('${r.UID}','game')">${getCleanCustName(r)}</td>
      <td>${r.TotalAmount||0}</td>
      <td>${r.Balance||0}</td>
    </tr>`).join('');

  const totSale = rows.reduce((s,r)=>s+(parseFloat(r.TotalAmount)||0),0);
  const totBal  = rows.reduce((s,r)=>s+(parseFloat(r.Balance)||0),0);
  setText('ft_gh_sale', totSale.toString());
  setText('ft_gh_bal',  totBal.toString());
}

// ── Render grvgames ──
// ASPX: Footer: [0]=Total,[1]=TotalSale,[2]=TotalBalance
function renderMyHisab(rows) {
  const tbody = document.getElementById('bodyMyHisab');
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="3" class="emsg">No Data Found!</td></tr>';
    setText('ft_mh_sale','–'); setText('ft_mh_bal','–');
    return;
  }
  tbody.innerHTML = rows.map(r => `
    <tr onclick="selectRow(this,'bodyMyHisab')" tabindex="0"
        onkeydown="arrowNav(event,this,'bodyMyHisab')">
      <td class="link-cell" onclick="event.stopPropagation();showHistory('${r.UID}','myhisab')">${getCleanCustName(r.Mobile||r.UID)}</td>
      <td>${r.TotalAmount||0}</td>
      <td>${r.Balance||0}</td>
    </tr>`).join('');

  const totSale = rows.reduce((s,r)=>s+(parseFloat(r.TotalAmount)||0),0);
  const totBal  = rows.reduce((s,r)=>s+(parseFloat(r.Balance)||0),0);
  setText('ft_mh_sale', totSale.toString());
  setText('ft_mh_bal',  totBal.toString());
}

// ── txtsearch_TextChanged → filter on CMobile / Customer Name ──
function filterGameHisab(term) {
  const t = term.toLowerCase();
  const filtered = !t ? _vsGameHisab
    : _vsGameHisab.filter(r => (r.CMobile||'').toLowerCase().includes(t) || getCleanCustName(r).toLowerCase().includes(t));
  renderGameHisab(filtered);
  document.getElementById('txtsearch').focus();
}

// ── grvGameHisab_RowCommand "History" → SP GetDateWiseMyHisabHistory ──
// ── grvgames_RowCommand "History" → SP GetDateWiseWinAmountHistory ──
async function showHistory(uid, mode) {
  _currentHistMode = mode;
  $('#histModal').modal('show');
  document.getElementById('histTitle').textContent = mode === 'game'
    ? `${_currentDate} Hisab History`
    : 'My Hisab History';
  document.getElementById('bodyHist').innerHTML =
    '<tr><td colspan="11" class="emsg"><span class="spin"></span> Loading...</td></tr>';
  document.getElementById('footHist').style.display = 'none';

  try {
    const endpoint = mode === 'game'
      ? `/api/hisab/game-hisab-history?date=${encodeURIComponent(_currentDate)}&uid=${uid}`
      : `/api/hisab/win-amount-history?date=${encodeURIComponent(_currentDate)}&uid=${uid}`;

    const r = await API.get(endpoint);
    if (!r?.success || !r.data?.length) {
      document.getElementById('bodyHist').innerHTML =
        '<tr><td colspan="11" class="emsg">No Data Found!</td></tr>';
      return;
    }

    const data = r.data;

    // ASPX: h4Title = CustomerName + date + "All Game History" (from first row)
    if (mode === 'game' && data[0]?.CustomerName) {
      document.getElementById('histTitle').textContent =
        `${getCleanCustName(data[0].CustomerName)}  ${_currentDate}  All Game History`;
    }

    document.getElementById('bodyHist').innerHTML = data.map(d => `
      <tr>
        <td>${d.GameName||'–'}</td>
        <td>${d.Rates||'–'}</td>
        <td>${d.Total_Amount||0}</td>
        <td>${d.D_Sale||0}</td>
        <td>${d.A_Sale||0}</td>
        <td>${d.Commision||0}</td>
        <td>${d.O_Dara||0}</td>
        <td>${d.O_Akhar||0}</td>
        <td>${d.WinAmount||0}</td>
        <td>${d.Pati||0}</td>
        <td>${d.Balance||0}</td>
      </tr>`).join('');

    // ASPX Footer sums — exact cell order
    const sum = f => data.reduce((s,d)=>s+(parseFloat(d[f])||0),0).toString();
    setText('ft_h_tsale',  sum('Total_Amount'));
    setText('ft_h_dsale',  sum('D_Sale'));
    setText('ft_h_asale',  sum('A_Sale'));
    setText('ft_h_comm',   sum('Commision'));
    setText('ft_h_odara',  sum('O_Dara'));
    setText('ft_h_oakhar', sum('O_Akhar'));
    setText('ft_h_win',    sum('WinAmount'));
    setText('ft_h_pati',   sum('Pati'));
    setText('ft_h_bal',    sum('Balance'));
    document.getElementById('footHist').style.display = '';

  } catch(e) {
    document.getElementById('bodyHist').innerHTML =
      '<tr><td colspan="11" class="emsg">Error loading</td></tr>';
  }
}

function closeHist() {
  $('#histModal').modal('hide');
}

// ── Arrow nav (MyfunctionUpDown) ──
function selectRow(row, tbodyId) {
  document.querySelectorAll(`#${tbodyId} tr`).forEach(r=>r.classList.remove('selected-row'));
  row.classList.add('selected-row');
}

function arrowNav(e, row, tbodyId) {
  if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
  e.preventDefault();
  const rows = [...document.querySelectorAll(`#${tbodyId} tr`)];
  const idx = rows.indexOf(row);
  const next = e.key === 'ArrowUp' ? rows[idx-1] : rows[idx+1];
  if (next) { next.focus(); selectRow(next, tbodyId); }
}

// ── Utils ──
function fmtDate(d) {
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${String(d.getDate()).padStart(2,'0')}/${months[d.getMonth()]}/${d.getFullYear()}`;
}
function setText(id,val) { const el=document.getElementById(id); if(el) el.textContent=val; }
// ── SweetAlert-based feedback (matches original ASPX SucessMessage/ErrorMessage) ──
function showToast(msg, err=false) {
  swal(err ? 'Wrong Inputs!' : 'Sucess!', msg, {
    icon: err ? 'error' : 'success',
    timer: 900,
    buttons: false
  });
}
init();
</script>

<script>
// Flatpickr calendar for date inputs
// ── Export to Excel ──
function exportHisab() {
  if (!_vsGameHisab.length && !_vsMyHisab.length) {
    showToast('No data to export!', true); return;
  }
  const wb = XLSX.utils.book_new();

  if (_vsGameHisab.length) {
    const sorted = [..._vsGameHisab].sort((a,b)=>getCleanCustName(a).localeCompare(getCleanCustName(b)) || (a.CMobile||'').localeCompare(b.CMobile||''));
    const rows = [['SRNo','Customer','Sale','Balance']];
    sorted.forEach((r,i) => rows.push([i+1, getCleanCustName(r), parseFloat(r.TotalAmount)||0, parseFloat(r.Balance)||0]));
    rows.push(['','Total',
      sorted.reduce((s,r)=>s+(parseFloat(r.TotalAmount)||0),0),
      sorted.reduce((s,r)=>s+(parseFloat(r.Balance)||0),0)]);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), 'My Game Hisab');
  }

  if (_vsMyHisab.length) {
    const rows = [['Mobile','Sale','Amount']];
    _vsMyHisab.forEach(r => rows.push([getCleanCustName(r.Mobile||r.UID), parseFloat(r.TotalAmount)||0, parseFloat(r.Balance)||0]));
    rows.push(['Total',
      _vsMyHisab.reduce((s,r)=>s+(parseFloat(r.TotalAmount)||0),0),
      _vsMyHisab.reduce((s,r)=>s+(parseFloat(r.Balance)||0),0)]);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), 'My Hisab');
  }

  XLSX.writeFile(wb, 'Hisab_' + (_currentDate||'').replace(/\//g,'-') + '.xlsx');
}

document.addEventListener('DOMContentLoaded', function() {
  if (typeof initDatePicker === 'function') initDatePicker();
});
</script>
