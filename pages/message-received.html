<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Received Chat</title>
<script src="/js/theme-preload.js"></script>
<link rel="stylesheet" href="/css/main.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Arial,sans-serif;background:#f4f6f9;min-height:100vh;}

/* ── ASPX: page-title center → game name + Yantri + Result + Auto Accept ── */
.top-bar{background:#fff;padding:6px 10px;text-align:center;border-bottom:1px solid #dee2e6;}
.top-bar-inner{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;}

/* ASPX: BtnResult — fas fa-draw-polygon green float:right */
.btn-result{background:#fff;border:none;color:green;font-size:18px;font-weight:bold;cursor:pointer;float:right;display:none;}
/* ASPX: lblMYGameName — green bold center h4 */
#lblMYGameName{color:green;font-size:1.1rem;font-weight:bold;font-family:Arial,sans-serif;}
/* ASPX: BtnYantri — fa f073 calendar green float:left */
.btn-yantri{background:#fff;border:none;color:green;font-size:18px;font-weight:bold;cursor:pointer;float:left;display:none;}
/* ASPX: Auto Accept label + Myswitch */
.auto-wrap{display:flex;align-items:center;gap:6px;font-size:.85rem;color:#000;font-weight:bold;float:left;margin-left:5px;display:none;}
.Myswitch{position:relative;display:inline-block;width:40px;height:23px;}
.Myswitch input{opacity:0;width:0;height:0;}
.Myslider{position:absolute;cursor:pointer;inset:0;background:#ccc;border-radius:34px;transition:.4s;}
.Myslider:before{position:absolute;content:"";height:15px;width:15px;border-radius:50%;left:5px;bottom:4px;background:#fff;transition:.4s;}
input:checked + .Myslider{background:#2196F3;}
input:checked + .Myslider:before{transform:translateX(15px);}

/* ASPX: SearchingDiv — BtnToday + BtnSearch (button2 style: white bg, green border) */
.search-row{display:flex;gap:6px;padding:6px 10px;background:#fff;border-bottom:1px solid #dee2e6;}
/* ASPX: button2 — background:white color:black border:2px solid #25d366 Arial bold */
.button2{background:#fff;color:#000;border:2px solid #25d366;font-family:Arial,sans-serif;font-weight:bold;padding:4px 0;border-radius:5px;cursor:pointer;text-transform:capitalize;width:100%;height:30px;font-size:.82rem;}
.button2:hover,.button2.active-btn{background:#25d366;color:#fff;}

/* ASPX: ddlSrchCustomers — top, full width, select2 style */
.ddl-wrap{padding:4px 10px;background:#fff;border-bottom:1px solid #dee2e6;}
select.ddl-sel{width:100%;border:1px solid #ced4da;border-radius:4px;padding:6px 8px;font-size:1rem;font-family:Arial,sans-serif;text-transform:capitalize;color:#000;background:#fff;outline:none;}

/* ASPX: txtSearchatHead — form-control, text-transform:capitalize, margin-top:5px */
.search-head{padding:4px 10px 6px;background:#fff;border-bottom:1px solid #dee2e6;}
.search-head input{width:100%;border:1px solid #ced4da;border-radius:4px;padding:7px 10px;font-size:.9rem;font-family:Arial,sans-serif;text-transform:capitalize;outline:none;color:#000;}
.search-head input:focus{border-color:#25d366;}

/* ASPX: SeachingResultDiv margin-top:35px */
#SeachingResultDiv{margin-top:0;}

/* ASPX: rptSendMessages repeater card — white bg, button1 style */
/* ASPX: col-sm-12 margin:-28px */
.rpt-item{margin:0;padding:0 10px;text-decoration:none;display:block;}

/* ASPX: card card-stats card-primary card-round background-color:White */
.contact-card{background:#fff;margin-bottom:6px;border-radius:15px;cursor:pointer;border:1px solid #e9ecef;overflow:hidden;}
.contact-card:hover{background:#f8f9fa;}

/* ASPX: card-body padding:0 background:White */
/* ASPX: col-stats button1 margin-left:28px border-radius:15px */
.card-body-inner{padding:8px 10px 8px 14px;position:relative;display:flex;align-items:center;gap:0;}

/* ASPX: flaticon-chat-7 float:left font-size:40px margin-right:30px margin-top:5px color:#25d366 */
.chat-icon{font-size:2.5rem;color:#25d366;float:left;margin-right:18px;margin-top:2px;flex-shrink:0;line-height:1;}

.card-content{flex:1;min-width:0;}

/* ASPX: h4 card-title font-size:medium font-family:Arial Black — lblCustomerName green */
.cust-name{font-size:1rem;font-family:'Arial Black',Arial,sans-serif;color:#25d366;text-transform:capitalize;margin:0;line-height:1.3;}

/* ASPX: h4 card-title color:Black font-size:small Arial bold — Mobile + (LastMsgDateAmount) */
.cust-mobile{font-family:Arial,sans-serif;font-size:.82rem;font-weight:bold;color:#000;margin:2px 0 0;}
.cust-mobile span{font-style:normal;font-weight:normal;font-family:Arial,sans-serif;font-size:.75rem;color:#666;}

/* ASPX: h6 card-title color:Green font-size:12px Arial italic — Rate + Last Update */
.cust-rate{font-family:Arial,sans-serif;font-size:.75rem;color:green;font-style:italic;margin:1px 0 0;}
.cust-rate span{text-transform:capitalize;font-style:normal;font-size:.75rem;}
.cust-rate span.lbl-update{color:#000;font-style:normal;}

/* ASPX: text-span — red circle badge float:right h:25 w:25 */
.unread-badge{background:red;border-radius:50%;height:25px;width:25px;line-height:25px;display:none;text-align:center;position:absolute;top:10px;right:10px;color:#fff;font-weight:bold;font-size:.75rem;font-family:'Arial Black',Arial;}

/* GridViewRates — table-head-bg-success, Rate buttons green full-width */
.rates-wrap{padding:0 10px;background:#fff;border-bottom:1px solid #dee2e6;display:none;}
.rate-btn-row{padding:4px 0;}
.btn-rate{background:#31ce36;color:#fff;border:none;border-radius:2px;font-size:1rem;height:40px;width:100%;text-align:center;font-weight:bold;cursor:pointer;margin-bottom:4px;}
.btn-rate:hover{opacity:.9;}
/* selected-row */
.btn-rate.selected{background:#28a745;}

/* Result Modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center;padding:10px;}
.modal-bg.show{display:flex;}
.modal-box{background:#fff;border-radius:8px;width:100%;max-width:500px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.3);}
.modal-hd{background:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #dee2e6;}
.modal-hd h4{font-size:1.1rem;font-weight:bold;}
.modal-close{background:none;border:none;font-size:1.5rem;cursor:pointer;color:#000;line-height:1;}
.modal-body-inner{padding:16px;}
.form-group{margin-bottom:14px;}
.form-group label{font-size:.85rem;color:#555;display:block;margin-bottom:4px;}
.form-control{width:100%;border:1px solid #ced4da;border-radius:4px;padding:8px 10px;font-size:.9rem;outline:none;}
.form-control:focus{border-color:#25d366;}
.btn-success{background:#28a745;color:#fff;border:none;border-radius:4px;padding:7px 18px;font-size:.88rem;font-weight:bold;cursor:pointer;margin-right:8px;}
.btn-danger{background:#dc3545;color:#fff;border:none;border-radius:4px;padding:7px 14px;font-size:.88rem;font-weight:bold;cursor:pointer;}

.spin{display:inline-block;width:13px;height:13px;border:2px solid #dee2e6;border-top-color:#25d366;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg)}}
.emsg{padding:20px;text-align:center;color:#6c757d;font-size:.85rem;}
</style>
</head>
<body>

<div class="content">
<!-- ASPX: ddlSrchCustomers — top center -->
<div class="ddl-wrap">
  <select class="ddl-sel" id="ddlSrchCustomers" onchange="onCustSelect()">
    <option value="">Select Customer Name</option>
  </select>
</div>

<!-- ASPX: GridViewRates — rate buttons, hidden until multi-rate customer selected -->
<div class="rates-wrap" id="ratesWrap">
  <div class="rate-btn-row" id="ratesBtnWrap"></div>
</div>

<!-- ASPX: UpdatePanel2 → lblMYGameName center + BtnResult right + BtnYantri left + Auto Accept -->
<div class="top-bar">
  <div style="position:relative;min-height:32px;display:flex;align-items:center;justify-content:center;">
    <!-- BtnResult float:right -->
    <button class="btn-result" id="BtnResult" onclick="openResult()">&#xf545; Result</button>
    <!-- lblMYGameName green bold -->
    <span id="lblMYGameName" style="font-size:1.1rem;font-weight:bold;color:green;font-family:Arial;"></span>
    <!-- BtnYantri float:left fa calendar -->
    <button class="btn-yantri" id="BtnYantri" onclick="openYantri()">Yantri &#128197;</button>
    <!-- Auto Accept -->
    <div class="auto-wrap" id="autoWrap">
      <label style="color:#000;font-weight:bold;font-family:Arial;font-size:.85rem;">Auto Accept</label>
      <label class="Myswitch">
        <input type="checkbox" id="chkAutoAccept" onchange="toggleAutoAccept()">
        <span class="Myslider"></span>
      </label>
    </div>
  </div>
</div>

<!-- ASPX: SearchingDiv — Today + View All buttons -->
<div class="search-row">
  <div style="flex:1;">
    <button class="button2 active-btn" id="btnToday" onclick="doToday()">Today</button>
  </div>
  <div style="flex:1;">
    <button class="button2" id="btnViewAll" onclick="doViewAll()">View All</button>
  </div>
</div>

<!-- ASPX: SearchHead txtSearchatHead -->
<div class="search-head" id="SearchHead" style="display:none;">
  <input type="text" id="txtSearchatHead" placeholder="Search Name / Mobile.."
    oninput="onSearch(this.value)" autocomplete="off">
</div>

<!-- ASPX: SeachingResultDiv → rptSendMessages repeater -->
<div id="SeachingResultDiv" style="padding:4px 0;">
  <div class="emsg"><span class="spin"></span> Loading...</div>
</div>

</div><!-- /.content -->

<!-- Result Modal — ASPX: divAddResult -->
<div class="modal-bg" id="divAddResult">
  <div class="modal-box">
    <div class="modal-hd">
      <h4>Result</h4>
      <button class="modal-close" onclick="closeResult()">&times;</button>
    </div>
    <div class="modal-body-inner">
      <div class="form-group">
        <label>Date</label>
        <input type="text" class="form-control" id="txtResultDate" placeholder="dd/MMM/yyyy" readonly>
      </div>
      <div class="form-group">
        <label>Result</label>
        <input type="number" class="form-control" id="txtResult" placeholder="Enter Result" maxlength="2"
          onfocus="this.select()"
          onkeydown="if(event.keyCode==13)document.getElementById('btnSubmitResult').click()">
      </div>
      <button class="btn-success" id="btnSubmitResult" onclick="submitResult()">Submit</button>
      <button class="btn-danger" onclick="closeResult()">Cancel</button>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script>
// ASPX: QueryString params
const params  = new URLSearchParams(location.search);
const GID     = params.get('GID') || '';
const GAME    = params.get('Game') || params.get('GameName') || '';

let _uid=null, _allContacts=[], _pendingRates=[], _gid=GID, _gameName=GAME;
let _viewAll=false, _lblRatesTrue='';
let _todayDate='';

function getIST(){return new Date(Date.now()+5.5*3600000);}
function fmtDate(d){return String(d.getDate()).padStart(2,'0')+'/'+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]+'/'+d.getFullYear();}

// ASPX: Page_Load
async function init(){
  const u = await initPage('message-received');
  if(!u) return;
  _uid=u.UID;
  _todayDate = fmtDate(getIST());
  document.getElementById('txtResultDate').value = _todayDate;
  document.getElementById('lblMYGameName').textContent = _gameName;
  // ASPX: FetchReceiverList → ddlSrchCustomers
  await loadReceiverList();
  // ASPX: BindGrid(GameId)
  await loadContacts();
  // ASPX: GetResult()
  await loadResult();
  // ASPX: BindGrid() overload → Select IsAcceptedStatus FROM Game WHERE GID=X AND fUID=me
  await loadAutoAcceptStatus();
  // ASPX: ddlSrchCustomers.Focus()
  document.getElementById('ddlSrchCustomers').focus();
}

// ASPX: FetchReceiverList(@fUID, @Filter)
async function loadReceiverList(){
  try{
    const r=await API.get('/api/received/receiver-list');
    if(!r?.success)return;
    const sel=document.getElementById('ddlSrchCustomers');
    (r.data||[]).forEach(c=>{
      const o=document.createElement('option');
      o.value=c.CID; o.textContent=c.CustomerName; o.dataset.mobile=c.Mobile||'';
      sel.appendChild(o);
    });
  }catch(e){}
}

// ASPX: BindGrid(GameId) → GetMyReceivedMessageWhatsAppLike
async function loadContacts(){
  const el=document.getElementById('SeachingResultDiv');
  el.innerHTML='<div class="emsg"><span class="spin"></span> Loading...</div>';
  document.getElementById('txtSearchatHead').value='';
  try{
    const r=await API.get(`/api/received/contacts?gid=${_gid}&viewAll=${_viewAll}`);
    if(!r?.success||!r.data?.length){
      _allContacts=[];
      el.innerHTML='<div class="emsg">No Data Found!</div>';
      // ASPX: if lblMYGameName == "No Data Found!" → hide Yantri/Result
      document.getElementById('BtnYantri').style.display='none';
      document.getElementById('BtnResult').style.display='none';
      document.getElementById('SearchHead').style.display='none';
      return;
    }
    _allContacts=r.data;
    // ASPX: lblMYGameName = dt.Rows[0]["GameName"]
    if(r.data[0]?.GameName){
      _gameName=r.data[0].GameName;
      document.getElementById('lblMYGameName').textContent=_gameName;
    }
    // ASPX: show BtnYantri + BtnResult + SearchHead
    document.getElementById('BtnYantri').style.display='block';
    document.getElementById('BtnResult').style.display='block';
    document.getElementById('SearchHead').style.display='block';
    document.getElementById('autoWrap').style.display='flex';
    renderContacts(_allContacts);
  }catch(e){el.innerHTML='<div class="emsg">Error loading</div>';}
}

// ASPX: rptSendMessages ItemTemplate — exact card HTML
function renderContacts(list){
  const el=document.getElementById('SeachingResultDiv');
  if(!list.length){el.innerHTML='<div class="emsg">No Data Found!</div>';return;}
  el.innerHTML=list.map(c=>{
    const unread=parseInt(c.UnReadTotal)||0;
    const name  =c.CustomerName||'';
    const mob   =c.Mobile||'';
    const lastAmt=c.LastMsgDateAmount||'';
    const rate  =c.Rate||'';
    const lt    =c.LT||'';
    const cj    =JSON.stringify(c).replace(/"/g,'&quot;');
    return `<div class="rpt-item" onclick="onContactClick(${cj})">
      <div class="contact-card">
        <div class="card-body-inner">
          <!-- ASPX: flaticon-chat-7 icon -->
          <span class="chat-icon">💬</span>
          <div class="card-content">
            <!-- ASPX: lblCustomerName h4 green Arial Black -->
            ${name?`<h4 class="cust-name">${name}</h4>`:''}
            <!-- ASPX: Mobile (LastMsgDateAmount) -->
            <h4 class="cust-mobile">${mob}&nbsp;<span>(${lastAmt})</span></h4>
            <!-- ASPX: Rate Last Update LT -->
            ${rate?`<h6 class="cust-rate">${rate}&nbsp;<span><span class="lbl-update">Last Update :</span>${lt}</span></h6>`:''}
          </div>
          <!-- ASPX: text-span red badge -->
          <span class="unread-badge" style="${unread>0?'display:inline-block;':''}">${unread>0?unread:''}</span>
        </div>
      </div>
    </div>`;
  }).join('');
}

// ASPX: txtSearchatHead_TextChanged → filter ViewState datatable
function onSearch(term){
  const t=term.toLowerCase();
  if(!t){renderContacts(_allContacts);return;}
  renderContacts(_allContacts.filter(c=>
    (c.CustomerName||'').toLowerCase().includes(t)||(c.Mobile||'').toLowerCase().includes(t)
  ));
}

// ASPX: rptSendMessages_ItemCommand → Response.Redirect WhatsaapLikeReceivedChat
function onContactClick(c){
  if(c.CustomerName==='ADD Contact'){window.location.href=`/pages/customer.html?Mobile=${c.Mobile}`;return;}
  const ist=fmtDate(getIST());
  const lastDate=c.LastMsgDate||ist;
  redirect(c.Mobile,c.GID||_gid,c.GameName||_gameName,c.fSenderID||c.fUID,lastDate,
    c.Rate,c.D_PComm,c.D_Amt,c.A_PComm,c.A_Amt,c.Pati_PComm,
    c.ThirdPartyHissaID,c.ThirdPartyHissaPer,c.ThirdPartyCommID,c.ThirdPartyDaraComm,c.ThirdPartyAkharComm);
}

// ASPX: ddlSrchCustomers_SelectedIndexChanged → load rates → GridViewRates or redirect
async function onCustSelect(){
  const cid=document.getElementById('ddlSrchCustomers').value;
  if(!cid)return;
  // ASPX: SELECT from CustomersRates JOIN Customers WHERE CID=X
  const r=await API.get(`/api/received/customer-rates?cid=${cid}`);
  if(!r?.success||!r.data?.length)return;
  const dt=r.data;
  if(dt.length===1){
    // ASPX: single rate → immediate redirect
    const d=dt[0];
    // ASPX: SELECT UID FROM Users WHERE Mobile=MobileNo
    redirect(d.MobileNo,_gid,_gameName,d.fUID,'',d.Rate,d.D_PComm,d.D_Amt,d.A_PComm,d.A_Amt,d.Patti,d.ThirdPartyHissaID,d.ThirdPartyHissaPer,d.ThirdPartyCommID,d.ThirdPartyDaraComm,d.ThirdPartyAkharComm);
  }else{
    // ASPX: multiple rates → show GridViewRates, hide SearchingDiv (BlockSeaching)
    _pendingRates=dt;
    _lblRatesTrue='Yes';
    // ASPX: BlockSeaching() → hide txtSearchatHead + BtnSearch + BtnToday + SeachingResultDiv
    document.getElementById('txtSearchatHead').style.display='none';
    document.getElementById('SearchHead').style.display='none';
    document.getElementById('btnToday').style.display='none';
    document.getElementById('btnViewAll').style.display='none';
    document.getElementById('SeachingResultDiv').style.display='none';
    // ASPX: GridViewRates — green BtnRates buttons
    const wrap=document.getElementById('ratesBtnWrap');
    wrap.innerHTML=dt.map((d,i)=>
      `<button class="btn-rate" id="rateBtn${i}" onclick="onRateClick(${i})" tabindex="${i+1}">${d.Rate}</button>`
    ).join('');
    document.getElementById('ratesWrap').style.display='block';
    // ASPX: GridViewRates_RowDataBound → first rate button gets focus
    setTimeout(()=>document.getElementById('rateBtn0')?.focus(),100);
  }
}

// ASPX: GridViewRates_RowCommand → Rate → Response.Redirect
function onRateClick(i){
  const d=_pendingRates[i];
  // ASPX: SELECT UID FROM Users WHERE Mobile=MobileNo (done via fUID from route)
  closeRates();
  redirect(d.MobileNo,_gid,_gameName,d.fUID,'',d.Rate,d.D_PComm,d.D_Amt,d.A_PComm,d.A_Amt,d.Patti,d.ThirdPartyHissaID,d.ThirdPartyHissaPer,d.ThirdPartyCommID,d.ThirdPartyDaraComm,d.ThirdPartyAkharComm);
}

// ASPX: Esc → close GridViewRates, restore UI (lblRatesTrue="Yes" branch)
function closeRates(){
  _lblRatesTrue='';
  document.getElementById('ratesWrap').style.display='none';
  document.getElementById('ratesBtnWrap').innerHTML='';
  document.getElementById('txtSearchatHead').style.display='block';
  document.getElementById('SearchHead').style.display='block';
  document.getElementById('btnToday').style.display='block';
  document.getElementById('btnViewAll').style.display='block';
  document.getElementById('SeachingResultDiv').style.display='block';
  document.getElementById('ddlSrchCustomers').selectedIndex=0;
}

// ASPX: Response.Redirect WhatsaapLikeReceivedChat.aspx?...&SelectedPage=1
function redirect(mobile,gid,game,selUID,lastDate,rates,dPC,dA,aPC,aA,pati,hID,hPer,tpCID,tpDara,tpAkhar){
  const p=new URLSearchParams({
    SelectedMobile:mobile||'',GameId:gid||_gid,GameName:game||_gameName,
    SelectedUID:selUID||'',Rates:rates||'0/100-0/10-0',
    D_PComm:dPC||'0',D_Amt:dA||'100',A_PComm:aPC||'0',A_Amt:aA||'10',
    Pati_PComm:pati||'0',ThirdPartyHissaID:hID||'0',ThirdPartyHissaPer:hPer||'0',
    ThirdPartyCommID:tpCID||'0',ThirdPartyDaraComm:tpDara||'0',ThirdPartyAkharComm:tpAkhar||'0',
    SelectedPage:'1',...(lastDate?{LastMsgDate:lastDate}:{})
  });
  window.location.href=`/pages/chat.html?${p}`;
}

// ASPX: BtnToday_Click → CheckBoxAll=false, BindGrid
function doToday(){
  _viewAll=false;
  document.getElementById('btnToday').classList.add('active-btn');
  document.getElementById('btnViewAll').classList.remove('active-btn');
  // ASPX: BtnToday → green bg, BtnSearch → white bg
  document.getElementById('btnToday').style.background='#25d366';
  document.getElementById('btnToday').style.color='#fff';
  document.getElementById('btnViewAll').style.background='#fff';
  document.getElementById('btnViewAll').style.color='#000';
  loadContacts();
}

// ASPX: BtnSearch_Click → CheckBoxAll=true, BindGrid
function doViewAll(){
  _viewAll=true;
  document.getElementById('btnViewAll').classList.add('active-btn');
  document.getElementById('btnToday').classList.remove('active-btn');
  document.getElementById('btnViewAll').style.background='#25d366';
  document.getElementById('btnViewAll').style.color='#fff';
  document.getElementById('btnToday').style.background='#fff';
  document.getElementById('btnToday').style.color='#000';
  loadContacts();
}

// ASPX: OpenYantri → YantriRMsg.aspx?GameID=X
function openYantri(){window.location.href=`/pages/yantri.html?GameID=${_gid}`;}

// ASPX: OpenResult → divAddResult modal show
function openResult(){
  _lblRatesTrue='1';
  loadResult();
  document.getElementById('divAddResult').classList.add('show');
  setTimeout(()=>{document.getElementById('txtResult').focus();document.getElementById('txtResult').select();},300);
}
function closeResult(){
  _lblRatesTrue='';
  document.getElementById('divAddResult').classList.remove('show');
}

// ASPX: GetResult → SELECT Result FROM Result WHERE fGameID=X AND Date=today
async function loadResult(){
  try{
    const r=await API.get(`/api/received/result?gid=${_gid}&date=${_todayDate}`);
    if(r?.success && r.data?.Result) document.getElementById('txtResult').value=r.data.Result;
  }catch(e){}
}

// ASPX: BindGrid() overload → ChkIsAcceptedStatus.Checked = IsAcceptedStatus from Game table
async function loadAutoAcceptStatus(){
  try{
    const r=await API.get(`/api/game/auto-accept-status?gid=${_gid}`);
    if(r?.success && r.data){
      const val = r.data.IsAcceptedStatus;
      const checked = (val==='True'||val===true||val==='true'||val===1);
      document.getElementById('chkAutoAccept').checked=checked;
    }
  }catch(e){}
}

// ASPX: BtnSubmit_Click → SaveResult()
async function submitResult(){
  const result=document.getElementById('txtResult').value.trim();
  const date  =document.getElementById('txtResultDate').value;
  if(!result||!date){alert('Please Check Values !');document.getElementById('txtResult').focus();return;}
  const r=await API.post('/api/game/save-result',{gameID:_gid,result,date});
  if(r?.success){closeResult();}
  else alert(r?.message||'Error');
}

// ASPX: ChkIsAcceptedStatus_CheckedChanged → UPDATE Game SET IsAcceptedStatus WHERE GID=X
async function toggleAutoAccept(){
  const status=document.getElementById('chkAutoAccept').checked;
  await API.post('/api/received/accept-status',{gid:_gid,status});
}

// ASPX: Esc keyup → go back to Home.aspx / close modal
document.addEventListener('keyup',e=>{
  if(e.key==='Escape'){
    if(_lblRatesTrue==='1'){closeResult();return;}
    if(_lblRatesTrue==='Yes'){closeRates();return;}
    window.location.href='/pages/home.html';
  }
});
// ASPX: GridViewRates arrow keys
document.addEventListener('keydown',e=>{
  if(document.getElementById('ratesWrap').style.display!=='none'){
    const btns=document.querySelectorAll('.btn-rate');
    const focused=[...btns].findIndex(b=>b===document.activeElement);
    if(e.key==='ArrowDown'&&focused<btns.length-1){btns[focused+1].focus();btns[focused+1].classList.add('selected');btns[focused].classList.remove('selected');e.preventDefault();}
    if(e.key==='ArrowUp'&&focused>0){btns[focused-1].focus();btns[focused-1].classList.add('selected');btns[focused].classList.remove('selected');e.preventDefault();}
    if(e.key==='Enter'&&focused>=0){onRateClick(focused);}
  }
});

async function doLogout(){await API.post('/api/auth/logout',{});window.location.href='/login.html';}
init();
