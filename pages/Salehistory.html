<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sale History - Susu9</title>
<link rel="stylesheet" href="/css/main.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Noto+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root {
    --green: #25D366;
    --green2: #128C7E;
    --green3: #E9F7EF;
    --bg: #F4F7F9;
    --panel: #FFFFFF;
    --panel2: #F8F9FA;
    --border: #E0E0E0;
    --text: #212529;
    --text2: #495057;
    --muted: #6C757D;
    --red: #dc3545;
    --yellow: #ffc107;
}
body{font-family:'Noto Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* NAV */
.navbar{background:var(--green2);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:56px;box-shadow:0 2px 8px rgba(0,0,0,.4);position:sticky;top:0;z-index:100;}
.nav-left{display:flex;align-items:center;gap:10px;}
.back-btn{background:rgba(255,255,255,.15);border:none;color:#fff;padding:5px 10px;border-radius:6px;cursor:pointer;font-size:.9rem;}
.nav-logo{font-family:'Rajdhani',sans-serif;font-size:1.5rem;font-weight:700;color:#fff;letter-spacing:3px;}
.nav-right{display:flex;align-items:center;gap:10px;}
.nav-uid{color:rgba(255,255,255,.65);font-size:.78rem;}
.btn-logout{background:rgba(255,82,82,.22);color:#fff;border:1px solid rgba(255,82,82,.35);padding:5px 12px;border-radius:6px;cursor:pointer;font-size:.78rem;}

.content{padding:16px;display:flex;flex-direction:column;gap:14px;}

/* CARDS */
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
.card-title{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:1.1rem;color:var(--green);letter-spacing:.5px;margin-bottom:14px;}

/* INPUT AREA - Number/Amount entry (same as ASPX txtNumber/txtAmount/myTable) */
.entry-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px;}
.fg{display:flex;flex-direction:column;gap:4px;}
.fg label{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-weight:600;}
.inp{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:7px 11px;color:var(--text);font-size:.9rem;outline:none;transition:border-color .15s;}
.inp:focus{border-color:var(--green);}
.inp-num{width:110px;text-align:center;font-family:'JetBrains Mono',monospace;font-weight:600;}
.inp-amt{width:90px;text-align:center;}
.sel{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:7px 10px;color:var(--text);font-size:.84rem;outline:none;cursor:pointer;}
.sel option{background:var(--panel2);}

.btn{padding:7px 15px;border-radius:8px;border:none;font-weight:600;font-size:.82rem;cursor:pointer;transition:all .15s;}
.btn-green{background:var(--green);color:#111;}
.btn-green:hover{background:#1db954;}
.btn-red{background:rgba(241,92,109,.15);color:var(--red);border:1px solid rgba(241,92,109,.3);}
.btn-red:hover{background:rgba(241,92,109,.3);}
.btn-blue{background:var(--blue, #1572e8);color:#fff;}
.btn-sm{padding:5px 11px;font-size:.75rem;}

/* ENTRY TABLE (same as ASPX myTable) */
.entry-table-wrap{border:1px solid var(--border);border-radius:8px;overflow-x:auto;margin-bottom:10px;min-height:40px;}
#myTable{width:100%;border-collapse:collapse;}
#myTable td{padding:6px 10px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:.9rem;font-weight:600;color:var(--text);border-bottom:1px solid rgba(255,255,255,.05);}
#myTable td:nth-child(1){color:var(--green);}
#myTable td:nth-child(2){color:var(--text);}
#myTable td:nth-child(3){width:40px;}
.del-btn{background:var(--red);color:#fff;border:none;border-radius:4px;width:22px;height:22px;cursor:pointer;font-size:.75rem;font-weight:700;line-height:1;}

/* Message display (lblMessage) */
.msg-display{font-family:'JetBrains Mono',monospace;font-size:.8rem;color:var(--muted);padding:6px 0;word-break:break-all;min-height:18px;}

/* Total */
.total-line{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:1rem;color:var(--green);padding:4px 0;}

/* SEARCH SECTION */
.search-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}

/* RESULTS TABLE */
.tbl-wrap{overflow-x:auto;border-radius:8px;border:1px solid var(--border);}
table.res-table{width:100%;border-collapse:collapse;font-size:.82rem;}
table.res-table thead th{background:var(--panel2);color:var(--muted);font-size:.67rem;letter-spacing:.8px;text-transform:uppercase;font-weight:600;padding:8px 10px;text-align:center;border-bottom:1px solid var(--border);white-space:nowrap;}
table.res-table th.left,table.res-table td.left{text-align:left;}
table.res-table tbody tr{border-bottom:1px solid rgba(255,255,255,.04);transition:background .1s;cursor:pointer;}
table.res-table tbody tr:hover{background:var(--panel2);}
table.res-table tbody tr.highlighted{background:rgba(255,214,0,.07);border-left:2px solid var(--yellow);}
table.res-table td{padding:8px 10px;color:var(--text2);text-align:center;}
table.res-table td.left{text-align:left;}
table.res-table td .mobile-link{color:var(--green);font-weight:600;cursor:pointer;text-decoration:none;font-size:.84rem;}
table.res-table td .mobile-link:hover{text-decoration:underline;}
table.res-table tfoot td{background:var(--panel2);font-weight:700;color:var(--text);padding:8px 10px;text-align:center;}
table.res-table .msg-cell{font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--text2);word-break:break-all;max-width:300px;}

/* TOAST */
.toast{position:fixed;bottom:20px;right:20px;background:var(--panel2);border:1px solid var(--green);color:var(--text);padding:9px 16px;border-radius:10px;font-size:.82rem;z-index:9999;display:none;}
.toast.err{border-color:var(--red);}

.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg)}}
.emsg{padding:20px;text-align:center;color:var(--muted);font-size:.82rem;}
</style>
</head>
<body>

<nav class="navbar">
  <div class="nav-left">
    <button class="back-btn" onclick="history.back()">←</button>
    <div class="nav-logo">FIND CHAT</div>
  </div>
  <div class="nav-right">
    <span class="nav-uid" id="navUID"></span>
    <button class="btn-logout" onclick="doLogout()">Logout</button>
  </div>
</nav>

<div class="content">

  <!-- NUMBER/AMOUNT ENTRY CARD -->
  <div class="card">
    <div class="card-title">📊 Find Chat Messages</div>

    <!-- Number + Amount input (same as ASPX txtNumber + txtAmount) -->
    <div class="entry-row">
      <div class="fg">
        <label>Number</label>
        <input type="tel" class="inp inp-num" id="txtNumber" placeholder="Number"
          onfocus="this.select()" oninput="onlyNum(this)"
          onkeypress="return isNumber(event)"
          onkeydown="onNumEnter(event)">
      </div>
      <div class="fg">
        <label>Amount</label>
        <input type="tel" class="inp inp-amt" id="txtAmount" placeholder="Amount"
          onfocus="this.select()" oninput="process(this)"
          onkeypress="return isNumber(event)"
          onkeydown="onAmtEnter(event)">
      </div>
      <button class="btn btn-green btn-sm" onclick="copyMsg()">📋 Copy</button>
      <button class="btn btn-red btn-sm" onclick="clearTable()">🗑 Clear</button>
    </div>

    <!-- Message display (same as ASPX lblMessage) -->
    <div class="msg-display" id="lblMessage"></div>

    <!-- Entry table (same as ASPX #myTable) -->
    <div class="entry-table-wrap">
      <table id="myTable"></table>
    </div>

    <!-- Total (same as ASPX lblTotalAmountShow + lblTotalAmount) -->
    <div class="total-line" id="totalLine"></div>

    <!-- SEARCH SECTION (same as ASPX txtDate + txtMessage + BtnSearch) -->
    <div style="border-top:1px solid var(--border);padding-top:14px;margin-top:10px;">
      <div class="search-row">
        <div class="fg">
          <label>Date</label>
          <input type="text" class="inp" id="txtDate" placeholder="dd/MMM/yyyy"
            onfocus="this.select()" style="width:135px;"
            onkeydown="onDateEnter(event)">
        </div>
        <div class="fg">
          <label>Message / Filter</label>
          <input type="text" class="inp" id="txtMessage" placeholder="Enter Message or Number"
            onfocus="this.select()" style="width:220px;"
            onkeydown="onMsgEnter(event)">
        </div>
        <button class="btn btn-green" id="btnSearch" onclick="bindGrid()">Search</button>
      </div>
    </div>
  </div>

  <!-- RESULTS TABLE CARD -->
  <div class="card" id="resultsCard" style="display:none;">
    <div class="tbl-wrap">
      <table class="res-table">
        <thead>
          <tr>
            <th>Customer</th>
            <th>Game</th>
            <th>Rate</th>
            <th>Sub User</th>
            <th>Updated Time</th>
            <th>Sale</th>
            <th class="left">Message</th>
          </tr>
        </thead>
        <tbody id="resTbody">
          <tr><td colspan="7" class="emsg">Search to load</td></tr>
        </tbody>
        <tfoot>
          <tr>
            <td>Customer</td>
            <td>Game</td>
            <td>Rate</td>
            <td>Sub User</td>
            <td>Updated Time</td>
            <td id="ftSale">0</td>
            <td class="left">Message</td>
          </tr>
        </tfoot>
      </table>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script src="/js/api.js"></script>
<script>
let myUID = null;
let lblRowNumber = ''; // same as ASPX lblRowNumber

// Hidden data store for each row (same as ASPX hidden columns)
let rowDataStore = [];

// ── INIT ──
async function init() {
  try {
    const u = await getCurrentUser();
    myUID = u.UID;
    document.getElementById('navUID').textContent = 'UID: ' + u.UID;
  } catch(e) { window.location.href = '/login.html'; return; }

  // Set latest date (same as ASPX BindLastedDate)
  await setLatestDate();

  // URL params (same as ASPX Request.QueryString)
  const p = new URLSearchParams(location.search);
  if (p.get('Date')) {
    const d = new Date(p.get('Date'));
    document.getElementById('txtDate').value = fmtDate(d);
  }
  if (p.get('Msg')) {
    document.getElementById('txtMessage').value = p.get('Msg');
  }
  if (p.get('row_num')) {
    lblRowNumber = p.get('row_num');
  }
  if (p.get('Date') || p.get('Msg')) {
    bindGrid();
  }

  document.getElementById('txtNumber').focus();

  // ESC → Home
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') history.back();
  });

  subTotal();
}

// ── LATEST DATE (BindLastedDate) ──
async function setLatestDate() {
  try {
    const r = await API.get('/api/hisab/latest-date');
    if (r?.success && r.data) {
      document.getElementById('txtDate').value = r.data;
    } else {
      document.getElementById('txtDate').value = fmtDate(new Date(Date.now() + 5.5*3600000));
    }
  } catch(e) {
    document.getElementById('txtDate').value = fmtDate(new Date(Date.now() + 5.5*3600000));
  }
}

// ── KEYBOARD NAVIGATION (same as ASPX txtNumber/txtAmount keypress Enter) ──
function onNumEnter(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    document.getElementById('lblMessage').innerHTML = '';
    document.getElementById('txtAmount').focus();
    document.getElementById('txtAmount').select();
  }
}

function onAmtEnter(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    const num = document.getElementById('txtNumber').value;
    const amt = document.getElementById('txtAmount').value || '0';
    if (num !== '') {
      saveBulkMessage(num, amt);
    }
  }
}

function onDateEnter(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    document.getElementById('txtMessage').focus();
    document.getElementById('txtMessage').select();
  }
}

function onMsgEnter(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    document.getElementById('btnSearch').focus();
  }
}

// ── TABLE FUNCTIONS (same as ASPX addRow, deleteRow, SubTotal, cleartable) ──

function addRow(s1, s2) {
  // Validation (same as ASPX addRow if condition)
  if (
    ((s1 != '' && parseInt(s1) <= 100) ||
    (s1.length >= 3 && allCharactersSame(s1)) ||
    s1 == '1000' || s1 == '10000') &&
    parseFloat(s2) > 0 && !/\D/.test(s1)
  ) {
    const table = document.getElementById('myTable');
    const newRow = table.insertRow(-1);
    newRow.innerHTML = `
      <td style="width:60px;font-weight:700;color:var(--green);font-size:.95rem;">${s1}</td>
      <td style="width:80px;font-size:.95rem;">${s2}</td>
      <td><button class="del-btn" onclick="deleteRow(this)">X</button></td>`;
    subTotal();
  }
}

function deleteRow(btn) {
  const i = btn.parentNode.parentNode.rowIndex;
  document.getElementById('myTable').deleteRow(i);
  subTotal();
}

function clearTable() {
  document.getElementById('myTable').innerHTML = '';
  document.getElementById('lblMessage').innerHTML = '';
  subTotal();
}

function subTotal() {
  const table = document.getElementById('myTable');
  let total = Array.from(table.rows).reduce((sum, row) => {
    return sum + parseFloat(row.cells[1]?.innerHTML || 0);
  }, 0);

  const tl = document.getElementById('totalLine');
  if (Math.round(total) !== 0) {
    tl.textContent = 'Total Amount: ' + Math.round(total);
  } else {
    tl.textContent = '';
  }
}

// ── COPY (same as ASPX myFunction) ──
function copyMsg() {
  let final = '';
  const table = document.getElementById('myTable');
  for (let i = 0; i < table.rows.length; i++) {
    const x  = table.rows[i].cells[0].innerHTML;
    const x1 = table.rows[i].cells[1].innerHTML;
    final += x + '=' + x1 + ',';
  }
  final = final.slice(0, -1);
  document.getElementById('lblMessage').innerHTML = final;
  document.getElementById('txtMessage').value = final;

  try { navigator.clipboard.writeText(final); } catch(e) {}
  showToast('Copied!');
  return false;
}

// ── SAVE BULK MESSAGE (same as ASPX SaveBulkMessage) ──
function saveBulkMessage(txtNum, txtAmt) {
  let s1 = txtNum.trim();
  let s2 = txtAmt.trim();

  if (s2 !== '' && s2 !== '0' && s1 !== '0' && s1 !== '') {
    s1 = s1.replace(/[^0-9]/g, '');

    if (s1.length === 1) {
      // Single digit → pad to 2
      addRow('0' + s1, s2);
      clearInputs();

    } else if (s1.length === 3 && allCharactersSame(s1)) {
      if (s1 === '000') s1 = '1000';
      addRow(s1, s2);
      clearInputs();

    } else if (s1.length === 4 && allCharactersSame(s1)) {
      if (s1 === '0000') s1 = '10000';
      addRow(s1, s2);
      clearInputs();

    } else if (s1.length % 2 === 0) {
      // Even length → split into chunks of 2
      const chunks = [];
      let str = s1;
      while (str) {
        if (str.length < 2) { chunks.push(str); break; }
        chunks.push(str.substr(0, 2));
        str = str.substr(2);
      }
      chunks.forEach(ch => {
        if (ch === '00') ch = '100';
        addRow(ch, s2);
      });
      clearInputs();

    } else {
      alert('Invalid Values Entered');
      document.getElementById('txtNumber').focus();
      document.getElementById('txtNumber').select();
    }

  } else if (s2 !== '' && s2 === '0' && s1 !== '0') {
    // Paste mode (e.g. "01=50,02=30")
    const parts = s1.split(/[)*\-.+,$#@\\_]/);
    parts.forEach(part => {
      const kv = part.split(/[(=]/);
      if (kv[0] && kv[1]) {
        addRow(kv[0], kv[1]);
      }
    });
    clearInputs();

  } else {
    alert('Invalid Values Entered');
    document.getElementById('txtNumber').focus();
    document.getElementById('txtNumber').select();
  }
}

function clearInputs() {
  document.getElementById('txtAmount').value = '';
  document.getElementById('txtNumber').value = '';
  document.getElementById('txtNumber').focus();
  document.getElementById('txtNumber').select();
}

// ── BIND GRID (same as ASPX BindGrid → SP: ShowSaleHistory) ──
async function bindGrid() {
  const date    = document.getElementById('txtDate').value;
  const filter  = document.getElementById('txtMessage').value.trim();

  if (!date || !filter) {
    document.getElementById('resultsCard').style.display = 'none';
    return;
  }

  document.getElementById('resultsCard').style.display = '';
  document.getElementById('resTbody').innerHTML =
    '<tr><td colspan="7" class="emsg"><span class="spin"></span> Loading...</td></tr>';

  try {
    const r = await API.get(
      `/api/hisab/sale-history?date=${encodeURIComponent(date)}&filter=${encodeURIComponent(filter)}`
    );

    if (!r?.success || !r.data?.length) {
      document.getElementById('resTbody').innerHTML =
        '<tr><td colspan="7" class="emsg">No Data Found!</td></tr>';
      document.getElementById('ftSale').textContent = '0';
      rowDataStore = [];
      return;
    }

    rowDataStore = r.data;
    let totalSale = 0;

    document.getElementById('resTbody').innerHTML = r.data.map((d, i) => {
      totalSale += parseInt(d.TotalAmount || 0);
      const isHighlighted = lblRowNumber && String(d.row_num) === String(lblRowNumber);
      const dt = d.MessageDateTime ? new Date(d.MessageDateTime).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }) : '';
      return `<tr class="${isHighlighted ? 'highlighted' : ''}" onclick="goToChat(${i})">
        <td>
          <span class="mobile-link" onclick="goToChat(${i});event.stopPropagation();">
            ${d.CMobile || d.Mobile || ''}
          </span>
        </td>
        <td>${d.GameName || ''}</td>
        <td>${d.Rate || ''}</td>
        <td>${d.subuserID || ''}</td>
        <td>${dt}</td>
        <td style="font-weight:700;color:var(--green);">${d.TotalAmount || 0}</td>
        <td class="left msg-cell">${d.Message || ''}</td>
      </tr>`;
    }).join('');

    // Footer total (same as ASPX FooterRow.Cells[5].Text = TotalSale)
    document.getElementById('ftSale').textContent = totalSale;

  } catch(e) {
    document.getElementById('resTbody').innerHTML =
      '<tr><td colspan="7" class="emsg">Error loading</td></tr>';
  }
}

// ── ROW CLICK → GO TO CHAT (same as ASPX grvSaleHistroy_RowCommand "SaleHistory") ──
// ASPX redirects to: WhatsaapLikeReceivedChat.aspx with all params
// Node: chat.html with same params
function goToChat(idx) {
  const d = rowDataStore[idx];
  if (!d) return;

  const msg = document.getElementById('lblMessage').innerHTML;

  const p = new URLSearchParams({
    LastMsgDate:       d.MsgDate    || '',
    SelectedMobile:    d.Mobile     || '',
    GameId:            d.fGameID    || '',
    GameName:          d.GameName   || '',
    SelectedUID:       d.fSenderID  || '',
    Rates:             d.Rate       || '',
    D_PComm:           d.D_PComm    || '0',
    D_Amt:             d.D_Amt      || '100',
    A_PComm:           d.A_PComm    || '0',
    A_Amt:             d.A_Amt      || '10',
    Pati_PComm:        d.Pati_PComm || '0',
    ThirdPartyHissaID: d.ThirdPartyHissaID || '0',
    ThirdPartyHissaPer:d.HissaPerc  || '0',
    row_num:           d.row_num    || '',
    Msg:               msg,
    SelectedPage:      3
  });
  window.location.href = `/pages/chat.html?${p.toString()}`;
}

// ── UTILS ──
function allCharactersSame(s) {
  const n = s.length;
  if (n > 2 && s != '100') {
    for (let i = 1; i < n; i++)
      if (s[i] !== s[0]) return false;
  }
  return true;
}

function isNumber(evt) {
  const c = evt.which || evt.keyCode;
  if (c !== 46 && c > 31 && (c < 48 || c > 57)) return false;
  return true;
}

function onlyNum(el) { el.value = el.value.replace(/[^0-9]/g, ''); }
function process(el) { el.value = el.value.replace(/[^0-9.]/g, ''); }

function fmtDate(d) {
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${String(d.getDate()).padStart(2,'0')}/${months[d.getMonth()]}/${d.getFullYear()}`;
}

function showToast(msg, err=false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (err?' err':'');
  t.style.display = 'block';
  clearTimeout(t._t); t._t = setTimeout(() => t.style.display='none', 2000);
}

async function doLogout() {
  await API.post('/api/auth/logout', {});
  window.location.href = '/login.html';
}

init();
</script>
</body>
</html>
