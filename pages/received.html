<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Received Chat</title>
<script src="/js/theme-preload.js"></script>
<link rel="stylesheet" href="/css/main.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Arial,sans-serif;}

/* ── Modern Customer Combobox Component ── */
.ddl-wrap{
  padding:8px 12px;
  background:#ffffff;
  border-bottom:1px solid #e2e8f0;
  position:relative;
  z-index:100;
}
.cust-combo-box{
  position:relative;
  width:100%;
}
.cust-combo-input-wrap{
  display:flex;
  align-items:center;
  background:#f8fafc;
  border:1.5px solid #cbd5e1;
  border-radius:9px;
  padding:0 12px;
  height:44px;
  transition:all 0.2s ease;
  box-shadow:0 1px 2px rgba(0,0,0,0.04);
  cursor:text;
}
.cust-combo-input-wrap:hover{
  border-color:#94a3b8;
  background:#ffffff;
}
.cust-combo-input-wrap.active{
  border-color:#25d366;
  background:#ffffff;
  box-shadow:0 0 0 3px rgba(37,211,102,0.18);
}
.cust-combo-icon{
  display:flex;
  align-items:center;
  justify-content:center;
  color:#25d366;
  margin-right:8px;
  flex-shrink:0;
}
.cust-combo-input{
  flex:1;
  border:none;
  outline:none;
  background:transparent;
  font-family:inherit;
  font-size:0.94rem;
  font-weight:500;
  color:#0f172a;
  min-width:0;
  padding:0;
}
.cust-combo-input::placeholder{
  color:#64748b;
  font-weight:400;
  font-size:0.88rem;
}
.cust-combo-clear{
  display:none;
  background:#e2e8f0;
  border:none;
  color:#475569;
  border-radius:50%;
  width:20px;
  height:20px;
  font-size:11px;
  line-height:20px;
  text-align:center;
  cursor:pointer;
  padding:0;
  margin-left:6px;
  flex-shrink:0;
  transition:all 0.15s ease;
}
.cust-combo-clear:hover{
  background:#cbd5e1;
  color:#0f172a;
}
.cust-combo-divider{
  width:1px;
  height:18px;
  background:#cbd5e1;
  margin:0 8px;
  flex-shrink:0;
}
.cust-combo-toggle{
  background:none;
  border:none;
  color:#64748b;
  cursor:pointer;
  padding:4px;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:transform 0.2s ease, color 0.15s ease;
}
.cust-combo-toggle:hover{
  color:#0f172a;
}
.cust-combo-toggle.open{
  transform:rotate(180deg);
  color:#25d366;
}

/* ── Dropdown Menu ── */
.cust-combo-dropdown{
  display:none;
  position:absolute;
  top:calc(100% + 6px);
  left:0;
  right:0;
  background:#ffffff;
  border:1px solid #e2e8f0;
  border-radius:10px;
  box-shadow:0 12px 28px rgba(0,0,0,0.12), 0 4px 10px rgba(0,0,0,0.05);
  z-index:1050;
  overflow:hidden;
  animation:comboSlideDown 0.15s ease-out;
}
@keyframes comboSlideDown{
  from{opacity:0;transform:translateY(-4px);}
  to{opacity:1;transform:translateY(0);}
}
.cust-menu-hdr{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px 14px;
  background:#f8fafc;
  border-bottom:1px solid #f1f5f9;
  font-size:0.78rem;
  color:#64748b;
  font-weight:600;
}
.cust-menu-hint{
  font-weight:400;
  color:#94a3b8;
  font-size:0.73rem;
}
.cust-menu-items{
  max-height:320px;
  overflow-y:auto;
  padding:5px;
}
.cust-menu-items::-webkit-scrollbar{
  width:6px;
}
.cust-menu-items::-webkit-scrollbar-thumb{
  background:#cbd5e1;
  border-radius:4px;
}
.cust-menu-items::-webkit-scrollbar-thumb:hover{
  background:#94a3b8;
}

/* ── Customer Item ── */
.cust-item{
  display:flex;
  align-items:center;
  padding:9px 12px;
  border-radius:8px;
  cursor:pointer;
  transition:all 0.12s ease;
  margin-bottom:2px;
  text-decoration:none;
}
.cust-item:hover,.cust-item.active{
  background:#f0fdf4;
}
.cust-item-avatar{
  width:36px;
  height:36px;
  border-radius:50%;
  background:linear-gradient(135deg, #25d366 0%, #128c7e 100%);
  color:#ffffff;
  font-weight:700;
  font-size:0.82rem;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-right:12px;
  flex-shrink:0;
  text-transform:uppercase;
  box-shadow:0 2px 4px rgba(37,211,102,0.25);
}
.cust-item-info{
  flex:1;
  min-width:0;
}
.cust-item-name{
  font-size:0.92rem;
  font-weight:700;
  color:#0f172a;
  text-transform:capitalize;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  line-height:1.3;
}
.cust-item-mobile{
  font-size:0.79rem;
  font-weight:500;
  color:#64748b;
  margin-top:1px;
}
.cust-item-rate{
  font-size:0.73rem;
  font-weight:600;
  color:#166534;
  background:#dcfce7;
  padding:3px 8px;
  border-radius:12px;
  white-space:nowrap;
  margin-left:8px;
  flex-shrink:0;
}
.cust-empty-msg{
  padding:24px 16px;
  text-align:center;
  color:#64748b;
  font-size:0.88rem;
}

/* ── Modern Rates Wrap Modal/Card ── */
.rates-wrap{
  display:none;
  padding:12px;
  background:#ffffff;
  border-bottom:1px solid #e2e8f0;
  box-shadow:0 4px 6px -1px rgba(0,0,0,0.05);
}
.rates-hdr{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}
.rates-title{
  font-size:0.92rem;
  font-weight:700;
  color:#0f172a;
}
.rates-close-btn{
  background:none;
  border:none;
  font-size:1.1rem;
  color:#64748b;
  cursor:pointer;
  padding:2px 6px;
  border-radius:4px;
}
.rates-close-btn:hover{
  background:#f1f5f9;
  color:#0f172a;
}
.btn-rate{
  background:linear-gradient(135deg, #25d366 0%, #1ea952 100%);
  color:#ffffff;
  border:none;
  border-radius:8px;
  font-size:0.95rem;
  height:42px;
  width:100%;
  text-align:center;
  font-weight:700;
  cursor:pointer;
  margin-bottom:8px;
  display:block;
  box-shadow:0 2px 4px rgba(37,211,102,0.25);
  transition:transform 0.1s, box-shadow 0.1s;
}
.btn-rate:hover,.btn-rate.selected{
  transform:translateY(-1px);
  box-shadow:0 4px 8px rgba(37,211,102,0.35);
}

/* ── Top bar — Yantri | GameName | Result ── */
.top-bar{background:#fff;padding:4px 10px;border-bottom:1px solid #dee2e6;}
.top-bar-inner{min-height:38px;display:flex;align-items:center;justify-content:space-between;gap:6px;}

/* Yantri button (left, float:left like ASPX) */
.btn-yantri{
  background:#fff;border:none;color:green;font-size:.95rem;font-weight:bold;
  cursor:pointer;display:none;white-space:nowrap;flex-shrink:0;
  font-family:Arial,sans-serif;
}
/* Game name (center, green bold h4) */
#lblMYGameName{
  color:green;font-size:1.3rem;font-weight:bold;
  font-family:Arial,sans-serif;text-align:center;flex:1;
}
.game-selector-dropdown{
  color:#25d366;font-size:1.3rem;font-weight:bold;
  font-family:Arial,sans-serif;text-align:center;text-align-last:center;
  background:transparent;border:1.5px solid transparent;border-radius:6px;
  padding:3px 10px;cursor:pointer;outline:none;max-width:200px;
}
.game-selector-dropdown:hover,.game-selector-dropdown:focus{
  border-color:#25d366;background:#f4fbf6;
}
.game-selector-dropdown option{color:#000;font-size:1rem;font-weight:bold;}
/* Result button (right) */
.btn-result{
  background:#fff;border:none;color:green;font-size:.9rem;font-weight:bold;
  cursor:pointer;display:none;white-space:nowrap;flex-shrink:0;
  font-family:Arial,sans-serif;
}

/* ── Auto Accept (below top bar, float:left like ASPX) ── */
.auto-bar{
  display:none;align-items:center;gap:6px;
  padding:3px 10px 5px;background:#fff;border-bottom:1px solid #dee2e6;
}
.auto-bar label{color:#000;font-weight:bold;font-family:Arial,sans-serif;font-size:.82rem;}
.Myswitch{position:relative;display:inline-block;width:40px;height:23px;}
.Myswitch input{opacity:0;width:0;height:0;}
.Myslider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#ccc;transition:.4s;border-radius:34px;}
.Myslider:before{position:absolute;content:"";height:15px;width:15px;border-radius:50%;left:5px;bottom:4px;background:#fff;transition:.4s;}
input:checked+.Myslider{background:#2196F3;}
input:checked+.Myslider:before{transform:translateX(15px);}

/* ── Today / View All buttons ── */
.search-row{display:flex;gap:6px;padding:6px 10px;background:#fff;border-bottom:1px solid #dee2e6;}
.button2{
  background:#fff;color:#000;border:2px solid #25d366;
  font-family:Arial,sans-serif;font-weight:bold;padding:4px 0;
  border-radius:5px;cursor:pointer;width:100%;height:30px;
  font-size:.85rem;text-transform:capitalize;
}
.button2:hover{background:#25d366;color:#fff;}
.button2.btn-active{background:#25d366!important;color:#fff!important;}

/* ── Search input ── */
.search-head{padding:4px 10px 6px;background:#fff;border-bottom:1px solid #dee2e6;display:none;}
.search-head input{
  width:100%;border:1px solid #ced4da;border-radius:4px;
  padding:7px 10px;font-size:.9rem;font-family:Arial,sans-serif;
  text-transform:capitalize;outline:none;color:#000;display:block;margin-top:5px;
}
.search-head input:focus{border-color:#25d366;}

/* ── Contact list area ── */
#SeachingResultDiv{display:block;padding:6px 10px;}

/* ── Contact card (ASPX: col-stats button1, border-radius 15px) ── */
.contact-card{
  background:#fff;margin-bottom:6px;border-radius:15px;cursor:pointer;
  border:2px solid #d1d7db;overflow:hidden;transition:background .12s;
  text-decoration:none;display:block;
}
.contact-card:hover{background:#f8f8f8;}

/* ASPX: card-body padding:0, col-stats margin-left:28px */
.card-inner-wrap{
  padding:8px 10px 8px 0;
  position:relative;display:flex;align-items:center;
  margin-left:0;
}

/* ASPX: flaticon-chat-7 float:left font-size:40px margin-right:30px margin-top:5px color:#25d366 */
.chat-icon{
  font-size:2.4rem;color:#25d366;flex-shrink:0;
  margin-left:10px;margin-right:14px;margin-top:3px;line-height:1;
}

.card-content{flex:1;min-width:0;}

/* ASPX: h4 card-title font-size:medium font-family:Arial Black color:#25d366 */
.cust-name{
  font-size:1rem;font-family:'Arial Black',Arial,sans-serif;
  color:#25d366;text-transform:capitalize;margin:0;line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:bold;
}
/* ASPX: h4 card-title color:Black font-size:small Arial bold */
.cust-mobile{
  font-family:Arial,sans-serif;font-size:.82rem;font-weight:bold;
  color:#000;margin:2px 0 0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
/* ASPX: h6 card-title color:Green font-size:12px Arial italic */
.cust-rate{
  font-family:Arial,sans-serif;font-size:.75rem;color:green;
  font-style:italic;margin:1px 0 0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* ASPX: text-span — red circle badge float:right */
.text-span{
  background:red;border-radius:50%;height:25px;width:25px;min-width:25px;
  line-height:25px;display:inline-flex;align-items:center;justify-content:center;
  color:#fff;font-weight:bold;font-size:.72rem;font-family:'Arial Black',Arial;
  flex-shrink:0;margin-right:8px;
}

/* ── Result modal ── */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center;padding:10px;}
.modal-bg.show{display:flex;}
.modal-box{background:#fff;border-radius:8px;width:100%;max-width:500px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.3);}
.modal-hd{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #dee2e6;}
.modal-hd h4{font-size:1.1rem;font-weight:bold;}
.modal-close{background:none;border:none;font-size:1.5rem;cursor:pointer;color:#000;}
.modal-body-inner{padding:16px;}
.form-group{margin-bottom:14px;}
.form-group label{font-size:.85rem;color:#555;display:block;margin-bottom:4px;}
.form-control{width:100%;border:1px solid #ced4da;border-radius:4px;padding:8px 10px;font-size:.9rem;outline:none;}
.form-control:focus{border-color:#25d366;}
.btn-success{background:#28a745;color:#fff;border:none;border-radius:4px;padding:7px 18px;font-size:.88rem;font-weight:bold;cursor:pointer;margin-right:8px;}
.btn-danger-modal{background:#dc3545;color:#fff;border:none;border-radius:4px;padding:7px 14px;font-size:.88rem;font-weight:bold;cursor:pointer;}

.spin{display:inline-block;width:13px;height:13px;border:2px solid #dee2e6;border-top-color:#25d366;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg)}}
.emsg{padding:20px;text-align:center;color:#6c757d;font-size:.85rem;}
</style>
</head>
<body>

<div class="content">
<!-- Hidden labels -->
<span id="lblSenderUserID" style="display:none;"></span>
<span id="lblRatesTrue"    style="display:none;"></span>
<span id="lblGameID"       style="display:none;"></span>
<span id="lblCustomerNameMobile" style="display:none;"></span>

<!-- 1. Modern Customer Search Combobox -->
<div class="ddl-wrap">
  <div class="cust-combo-box" id="custComboBox">
    <div class="cust-combo-input-wrap" id="custComboInputWrap">
      <span class="cust-combo-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </span>
      <input type="text" id="txtCustSearchInput" class="cust-combo-input"
        placeholder="Select or Search Customer Name / Mobile..."
        autocomplete="off"
        autofocus
        oninput="onCustSearchInput(this.value)"
        onfocus="openCustDropdown()"
        onkeydown="onCustKeydown(event)" />
      <button type="button" id="btnCustClear" class="cust-combo-clear" title="Clear selection" onclick="clearCustSelection(event)">✕</button>
      <span class="cust-combo-divider"></span>
      <button type="button" id="btnCustToggle" class="cust-combo-toggle" title="Toggle list" tabindex="-1" onclick="toggleCustDropdown(event)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>
    </div>

    <!-- Dropdown Menu -->
    <div class="cust-combo-dropdown" id="custDropdownMenu">
      <div class="cust-menu-hdr">
        <span id="custCountBadge">0 Customers</span>
        <span class="cust-menu-hint">Type to filter or use ↑↓</span>
      </div>
      <div class="cust-menu-items" id="custDropdownItems">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </div>
  <!-- Hidden select kept for backwards compatibility -->
  <select id="ddlSrchCustomers" style="display:none;">
    <option value="">Select Customer Name</option>
  </select>
</div>

<!-- 2. GridViewRates — rate buttons (hidden until multi-rate) -->
<div class="rates-wrap" id="ratesWrap">
  <div class="rates-hdr">
    <span class="rates-title" id="ratesTitle">Select Rate</span>
    <button type="button" class="rates-close-btn" onclick="closeRates()" title="Cancel">✕</button>
  </div>
  <div id="ratesBtnWrap"></div>
</div>

<!-- 3. UpdatePanel2 — Yantri | GameName | Result -->
<div class="top-bar" id="topBar">
  <div class="top-bar-inner">
    <!-- BtnYantri float:left -->
    <button class="btn-yantri" id="BtnYantri" onclick="openYantri()">Yantri &#128197;</button>
    <!-- Game selector dropdown / lblMYGameName center green bold -->
    <div style="flex:1;text-align:center;min-width:0;display:flex;align-items:center;justify-content:center;">
      <select id="ddlGameSelector" class="game-selector-dropdown" onchange="onGameChange(this.value)" title="Choose Game">
      </select>
      <span id="lblMYGameName" style="display:none;"></span>
    </div>
    <!-- BtnResult float:right -->
    <button class="btn-result" id="BtnResult" onclick="openResult()">&#xf545; Result</button>
  </div>
</div>

<!-- Auto Accept (below game bar, left aligned) -->
<div class="auto-bar" id="autoWrap">
  <label>Auto Accept</label>
  <label class="Myswitch">
    <input type="checkbox" id="chkAutoAccept" onchange="toggleAutoAccept()">
    <span class="Myslider"></span>
  </label>
</div>

<!-- 4. SearchingDiv — Today + View All -->
<div class="search-row" id="SearchingDiv">
  <div style="flex:1;">
    <button class="button2 btn-active" id="BtnToday" onclick="BtnSearch1_Click()">Today</button>
  </div>
  <div style="flex:1;">
    <button class="button2" id="BtnSearch" onclick="BtnSearch_Click()">View All</button>
  </div>
</div>

<!-- 5. Search text input -->
<div id="SearchHead" class="search-head">
  <input type="text" id="txtSearchatHead"
    placeholder="Search Name / Mobile.."
    oninput="txtSearchatHead_TextChanged()" autocomplete="off">
</div>

<!-- 6. rptSendMessages — contact cards -->
<div id="SeachingResultDiv">
  <div class="emsg"><span class="spin"></span> Loading...</div>
</div>

</div><!-- /.content -->

<!-- Result Modal -->
<div class="modal-bg" id="divAddResult">
  <div class="modal-box">
    <div class="modal-hd">
      <h4>Result</h4>
      <button class="modal-close" onclick="closeResult()">&times;</button>
    </div>
    <div class="modal-body-inner">
      <div class="form-group">
        <label>Date</label>
        <input type="date" class="form-control" id="txtDate"
          onchange="loadResult()" style="cursor:pointer;">
      </div>
      <div class="form-group">
        <label>Result</label>
        <input type="tel" class="form-control" id="txtResult" maxlength="2"
          placeholder="Enter Result" onfocus="this.select()"
          onkeypress="return ValidNumeric(event)"
          onkeydown="if(event.key==='Enter'){BtnSubmit_Click();return false;}">
      </div>
      <button class="btn-success" onclick="BtnSubmit_Click()">Submit</button>
      <button class="btn-danger-modal" onclick="closeResult()">Cancel</button>
    </div>
  </div>
</div>

<!-- jQuery + Select2 come from nav.js's vendor bundle (loaded inside initPage()) — don't
     load a second CDN copy here, two jQuery instances fight over window.$/jQuery and
     break Select2 init silently. -->
<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script>
const QS    = new URLSearchParams(location.search);
let _GID    = QS.get('GID') || '';
let _Game   = QS.get('Game') || '';
let _gamesList = [];

let _uid = null;
let _allContacts     = [];
let _allContactsPool = [];
let _viewAll         = false;
let _todayDate       = '';
let _gameDate        = '';
let _lblRatesTrue    = '';
let _pendingRates    = [];
let _pendingLastDate = '';

let _receiverList = [];
let _selectedCustomer = null;
let _activeDropdownIdx = -1;

function resetSelect2Silently(){
  clearCustSelection();
}

function focusCustomerInput(){
  const inp = document.getElementById('txtCustSearchInput');
  if(!inp) return;
  inp.value = '';
  const clearBtn = document.getElementById('btnCustClear');
  if(clearBtn) clearBtn.style.display = 'none';
  try {
    inp.focus();
    inp.select();
  } catch(e){}
}

/* ── IST helpers ── */
// Returns YYYY-MM-DD (for type="date" input and API calls)
function getISTiso(){
  const ist = new Date(Date.now() + 5.5*3600000);
  const y = ist.getUTCFullYear();
  const m = String(ist.getUTCMonth()+1).padStart(2,'0');
  const d = String(ist.getUTCDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}
// Returns DD/MM/YYYY (for display only)
function getIST(){
  const iso = getISTiso();
  return isoToDisplay(iso);
}
// YYYY-MM-DD → DD/MM/YYYY
function isoToDisplay(iso){
  const p = String(iso||'').trim().match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(p) return `${p[3]}/${p[2]}/${p[1]}`;
  return iso;
}
// Any date string → YYYY-MM-DD (for API)
function fmtDate(d){
  if(d instanceof Date){
    return d.toISOString().split('T')[0];
  }
  const s=String(d||'').trim();
  // Already ISO
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.substring(0,10);
  // dd/MMM/yyyy → YYYY-MM-DD
  const mth={Jan:'01',Feb:'02',Mar:'03',Apr:'04',May:'05',Jun:'06',Jul:'07',Aug:'08',Sep:'09',Oct:'10',Nov:'11',Dec:'12'};
  const m2=s.match(/^(\d{1,2})\/([A-Za-z]{3})\/(\d{4})/);
  if(m2) return `${m2[3]}-${mth[m2[2]]||'01'}-${String(m2[1]).padStart(2,'0')}`;
  // DD/MM/YYYY
  const m3=s.match(/^(\d{1,2})\/(\d{2})\/(\d{4})/);
  if(m3) return `${m3[3]}-${String(m3[2]).padStart(2,'0')}-${String(m3[1]).padStart(2,'0')}`;
  return s;
}
function xss(s){return String(s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

/* ── Load User Games (for game selector & missing GID fallback) ── */
async function loadUserGames(){
  try{
    const r = await API.get('/api/received/games');
    if(r?.success && r.data?.length){
      _gamesList = r.data;
      if(!_GID){
        const savedGID = sessionStorage.getItem('last_received_gid');
        const found = _gamesList.find(g => String(g.GID) === String(savedGID));
        if(found){
          _GID = String(found.GID);
          _Game = found.GameName;
        } else {
          _GID = String(_gamesList[0].GID);
          _Game = _gamesList[0].GameName;
        }
      } else {
        const found = _gamesList.find(g => String(g.GID) === String(_GID));
        if(found) _Game = found.GameName;
      }
      renderGameSelector();
    }
  }catch(e){}
}

function renderGameSelector(){

  sel.innerHTML = _gamesList.map(g =>
    `<option value="${g.GID}" ${String(g.GID) === String(_GID) ? 'selected' : ''}>${xss(g.GameName)}</option>`

async function onGameChange(newGid){

  if(!found) return;
  _GID = String(found.GID);
  _Game = found.GameName;
  sessionStorage.setItem('last_received_gid', _GID);
  sessionStorage.setItem('last_received_game', _Game);
  document.getElementById('lblGameID').innerText = _GID;
  document.getElementById('lblMYGameName').textContent = _Game;

  const u = new URL(window.location);

  _gameDate = await fetchGameDate();
  document.getElementById('txtDate').value = _gameDate || _todayDate;

  await loadAutoAcceptStatus();
  await loadContacts(false);
  loadAllContactsPool();
}

function getInitials(name){
  const clean = String(name || '').trim();
  if(!clean) return 'C';
  const parts = clean.split(/\s+/);
  if(parts.length === 1) return parts[0].substring(0, 2).toUpperCase();
  return (parts[0][0] + parts[1][0]).toUpperCase();
}

function renderCustomerDropdownItems(list, filterTerm){
  const container = document.getElementById('custDropdownItems');
  if(!container) return;
  if(!list || !list.length){
    container.innerHTML = `<div class="cust-empty-msg">No customer found ${filterTerm ? `matching "<b>${xss(filterTerm)}</b>"` : ''}</div>`;
    _activeDropdownIdx = -1;
    return;
  }
  container.innerHTML = list.map((c, i) => {
    const initials = getInitials(c.CustomerName);
    const rateText = c.Rate ? `<span class="cust-item-rate">Rate: ${xss(c.Rate)}</span>` : '';
    return `<div class="cust-item" id="custItem_${i}" onclick="selectCustomerItem('${c.CID}')" data-cid="${c.CID}">
      <div class="cust-item-avatar">${initials}</div>
      <div class="cust-item-info">
        <div class="cust-item-name">${xss(c.CustomerName)}</div>
        <div class="cust-item-mobile">${xss(c.Mobile || '')}</div>
      </div>
      ${rateText}
    </div>`;
  }).join('');
  _activeDropdownIdx = -1;
}

async function handleCustomerSelect(customer){

  try{
    const r = await API.get(`/api/received/customer-rates?cid=${customer.CID}`);

    if(dt.length === 1){
      const d = dt[0];
      const pati = d.Patti || d.Pati_PComm || d.patti || '0';
      const custUID = d.fUserUID || customer.UID || d.fUID;
      redirectToChat(d.MobileNo || customer.Mobile, _GID, _Game, custUID, getIST(), d.Rate,
        d.D_PComm, d.D_Amt, d.A_PComm, d.A_Amt, pati,
        d.ThirdPartyHissaID, d.ThirdPartyHissaPer,
        d.ThirdPartyCommID, d.ThirdPartyDaraComm, d.ThirdPartyAkharComm);
    } else {
      document.getElementById('lblCustomerNameMobile').innerText = `${customer.CustomerName} (${customer.Mobile})`;
      const titleEl = document.getElementById('ratesTitle');

  }

let _custDropdownClosedByEsc = false;

function onCustKeydown(e){
  const items = document.querySelectorAll('.cust-item');
  if(e.key === 'ArrowDown'){
    e.preventDefault();
    openCustDropdown();
    if(items.length){
      _activeDropdownIdx = Math.min(_activeDropdownIdx + 1, items.length - 1);
      updateDropdownActiveItem(items);
    }
  } else if(e.key === 'ArrowUp'){
    e.preventDefault();
    openCustDropdown();
    if(items.length){
      _activeDropdownIdx = Math.max(_activeDropdownIdx - 1, 0);
      updateDropdownActiveItem(items);
    }
  } else if(e.key === 'Enter'){
    e.preventDefault();
    if(_activeDropdownIdx >= 0 && _activeDropdownIdx < items.length){
      items[_activeDropdownIdx].click();
    }
  } else if(e.key === 'Escape'){
    const menu = document.getElementById('custDropdownMenu');
    const inp = document.getElementById('txtCustSearchInput');
    if((menu && menu.style.display === 'block') || (inp && inp.value.trim())){
      e.preventDefault();
      _custDropdownClosedByEsc = true;
      clearCustSelection();
      closeCustDropdown();
    }
  }
}

function updateDropdownActiveItem(items){
  items.forEach((it, idx) => {
    if(idx === _activeDropdownIdx){
      it.classList.add('active');
      it.scrollIntoView({ block: 'nearest' });
    } else {
      it.classList.remove('active');
    }
  });
}

  el.innerHTML=list.map((c,i)=>{

    const mob   =c.Mobile||'';
    const lastAmt=c.LastMsgDateAmount||'';
    const rate  =c.Rate||'';

    return `<div class="contact-card" onclick="onContactClick(${i})" style="margin:0 0 4px 0;text-transform:capitalize;">

        </div>
        ${unread>0?`<span class="text-span">${unread}</span>`:''}
      </div>
    </div>`;
  }).join('');
}

/* ── Redirect to chat page ── */
function redirectToChat(mobile,gid,game,selUID,lastDate,rates,dPC,dA,aPC,aA,pati,hID,hPer,tpCID,tpDara,tpAkhar){
  const p=new URLSearchParams({
    SelectedMobile:mobile||'',GameId:gid||_GID,GameName:game||_Game,
    SelectedUID:selUID||'',Rates:rates||'0/100-0/10-0',
    D_PComm:dPC||'0',D_Amt:dA||'100',A_PComm:aPC||'0',A_Amt:aA||'10',
    Pati_PComm:pati||'0',ThirdPartyHissaID:hID||'0',ThirdPartyHissaPer:hPer||'0',
    ThirdPartyCommID:tpCID||'0',ThirdPartyDaraComm:tpDara||'0',ThirdPartyAkharComm:tpAkhar||'0',
    SelectedPage:'1'
  });
  if(lastDate) p.set('LastMsgDate',lastDate);
  window.location.href=`/pages/chat.html?${p}`;
}

/* ── ESC keyboard — ASPX exact ── */
document.addEventListener('keyup',function(e){
  const k=e.keyCode?e.keyCode:e.which;
  if(k===27){
    if(_custDropdownClosedByEsc){
      _custDropdownClosedByEsc = false;
      return;
    }
    const lrt=document.getElementById('lblRatesTrue').innerText;
    if(lrt==='')     window.location.href='/pages/home.html';
    else if(lrt==='1') closeResult();
    else if(lrt==='Yes') closeRates();
  }
});

/* ── Arrow keys for rate buttons ── */
document.addEventListener('keydown',function(e){
  if(document.getElementById('ratesWrap').style.display==='none') return;
  const btns=document.querySelectorAll('.btn-rate');
  if(!btns.length) return;
  const focused=[...btns].findIndex(b=>b===document.activeElement);
  if(e.key==='ArrowDown'&&focused<btns.length-1){
    btns[focused+1].focus();btns.forEach(b=>b.classList.remove('selected'));btns[focused+1].classList.add('selected');e.preventDefault();
  }
  if(e.key==='ArrowUp'&&focused>0){
    btns[focused-1].focus();btns.forEach(b=>b.classList.remove('selected'));btns[focused-1].classList.add('selected');e.preventDefault();
  }
  if(e.key==='Enter'&&focused>=0) onRateClick(focused);
});

init();

  clearCustSelection();
