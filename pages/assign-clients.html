<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assign Customers - Susu9</title>
<script src="/js/theme-preload.js"></script>
<link rel="stylesheet" href="/css/main.css">
<style>
thead th.assign-hd {
  background-color: #1572e8 !important;
  color: White !important;
  position: sticky;
  top: 0;
  z-index: 2;
  vertical-align: middle;
}
#clientTable td {
  vertical-align: middle;
}
.select2-container{width:100%!important;}
.select2-container, .select2-container.form-control{border:none!important;padding:0!important;height:auto!important;background:transparent!important;box-shadow:none!important;display:block!important;}
.select2-container .select2-choice{
  height:40px!important;line-height:38px!important;border:1px solid #ced4da!important;border-radius:4px!important;
  padding:0 12px!important;font-size:.95rem!important;font-family:Arial,sans-serif;text-transform:capitalize;
  background:#fff!important;box-shadow:none!important;background-image:none!important;
}
.select2-container .select2-choice .select2-chosen{color:#000!important;font-size:.95rem!important;font-family:Arial,sans-serif;text-transform:capitalize;font-weight:700!important;}
.select2-container .select2-choice .select2-arrow{
  height:38px!important;width:28px!important;background:none!important;border-left:none!important;
  display:flex!important;align-items:center!important;justify-content:center!important;
}
.select2-container-active .select2-choice,
.select2-drop-active{
  border-color:#1572e8!important;
  box-shadow:0 0 0 3px rgba(21,114,232,0.18)!important;
}
.select2-drop{border:1px solid #ced4da;border-radius:0 0 4px 4px;z-index:9999;box-shadow:0 8px 16px rgba(0,0,0,0.1);box-sizing:border-box!important;}
.select2-drop .select2-search{padding:8px 10px!important;}
.select2-drop .select2-search input{width:100%!important;box-sizing:border-box!important;border:1px solid #ced4da!important;border-radius:4px!important;padding:8px 10px!important;font-size:.95rem!important;font-weight:600!important;background:#fff!important;}
.select2-results{width:100%!important;max-height:360px;margin:0!important;padding:4px 0!important;}
.select2-results .select2-highlighted, .select2-results li:hover{background-color:#bbf7d0!important;outline:2px solid #16a34a!important;outline-offset:-2px;color:#064e3b!important;font-weight:800!important;}
.select2-results li{text-transform:capitalize;font-family:Arial,sans-serif;font-size:.9rem;font-weight:600;padding:8px 12px;line-height:1.5;color:#222;}
.select2-results li.select2-highlighted{color:#064e3b!important;font-weight:800!important;}
</style>
</head>
<body>

<div class="content">
  <div class="row">
    <div class="col-md-12">
      <div class="card">
        <div class="card-header">
          <div class="card-title">Assign Customers</div>
        </div>
        <div class="card-body">
          <div class="row align-items-end">
            <div class="col-md-5 col-sm-6">
              <div class="form-group" style="margin-bottom:15px;">
                <label for="ddlSrchCustomers" style="font-weight:600;">Select Sub user</label>
                <!-- Combined searchable dropdown with typing search -->
                <select class="form-control" id="ddlSrchCustomers" style="text-transform:capitalize;">
                  <option value="">Select Sub user</option>
                </select>
              </div>
            </div>
            <div class="col-md-5 col-sm-6">
              <div class="form-group" style="margin-bottom:15px;">
                <label for="txtSearchCust" style="font-weight:600;">Search Customer</label>
                <div style="position:relative;">
                  <input type="text" class="form-control" id="txtSearchCust" placeholder="Search customer by name..." oninput="filterClients()" autocomplete="off" style="height:40px; font-size:.95rem; padding-right:32px;">
                  <span id="btnClearSearch" onclick="clearSearch()" style="position:absolute; right:10px; top:50%; transform:translateY(-50%); cursor:pointer; color:#888; display:none; font-size:18px; line-height:1; font-weight:bold;" title="Clear search">&times;</span>
                </div>
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col-md-12">
              <div class="table-responsive" style="height:350px;width:100%;">
                <table class="table-bordered-bd-primary table-hover" id="clientTable" cellpadding="4"
                  style="text-align:center;font-weight:normal;text-transform:capitalize;width:100%;">
                  <thead>
                    <tr>
                      <th class="assign-hd" style="width:70px;text-align:center;">S.No</th>
                      <th class="assign-hd" style="width:130px;text-align:center;">
                        <div style="display:inline-flex;align-items:center;justify-content:center;gap:6px;">
                          <input type="checkbox" id="chkAll" onchange="checkAll(this)" style="cursor:pointer;width:16px;height:16px;margin:0;vertical-align:middle;">
                          <label for="chkAll" style="cursor:pointer;margin:0;color:White;font-weight:bold;vertical-align:middle;user-select:none;">Select All</label>
                        </div>
                      </th>
                      <th class="assign-hd" style="text-align:left;padding-left:16px;">Name</th>
                    </tr>
                  </thead>
                  <tbody id="clientBody">
                    <tr><td colspan="3" style="text-align:center;padding:16px;color:#888;">Select a user to load clients</td></tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
        <div class="card-action">
          <!-- ASPX: MyButton — blue #1572e8 themed -->
          <button class="btn btn-grd-success" id="MyButton" onclick="saveAssignments()"
            style="background-color:#1572e8!important;border:#1572e8!important;color:White;">Save</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script>
let myUID = null;
let _allClients = []; // for client-side filter (ASPX: filterGrid)

async function init() {
  const u = await initPage('assign-clients');
  if (!u) return;
  myUID = u.UID;
  if (u.SubUID) { window.location.href = '/pages/home.html'; return; }

  // ASPX: ShowAllSubUsers() → load subusers into ddlSrchCustomers
  await loadSubUsers();

  // Focus dropdown
  if (window.$ && $.fn.select2) {
    $('#ddlSrchCustomers').select2('focus');
  } else {
    document.getElementById('ddlSrchCustomers').focus();
  }

  // ASPX: ESC → Subusers.aspx (always, regardless of history)
  window.__escPageHandler = function() {
    window.location.href = '/pages/subusers.html';
    return true;
  };
}

// ── ShowAllSubUsers() ──
async function loadSubUsers() {
  const r = await API.get('/api/admin/subusers');
  const sel = document.getElementById('ddlSrchCustomers');
  sel.innerHTML = '<option value="">Select Sub user</option>';
  (r?.data || []).forEach(u => {
    const name = (u.subusername || u.Name || '').trim();
    const id = String(u.SubUserID || '').trim();
    const label = name ? `${name} - ${id}` : id;
    sel.innerHTML += `<option value="${id}">${label}</option>`;
  });

  if (window.$ && $.fn.select2) {
    if ($('#ddlSrchCustomers').data('select2')) {
      $('#ddlSrchCustomers').select2('destroy');
    }
    $('#ddlSrchCustomers').select2({
      width: '100%',
      placeholder: 'Select Sub user',
      allowClear: true,
      matcher: function(term, text, opt) {
        if (!term || !term.trim()) return true;
        const t = term.trim().toLowerCase();
        const txt = (text || '').toLowerCase();
        const val = (opt && opt.val ? opt.val() : (opt && opt.value ? opt.value : '')).toLowerCase();
        return txt.indexOf(t) > -1 || val.indexOf(t) > -1;
      }
    }).on('change', function() {
      loadClients();
    }).on('select2-open', function() {
      const containerWidth = $('#s2id_ddlSrchCustomers').outerWidth();
      if (containerWidth && containerWidth > 100) {
        $('#select2-drop').css('width', containerWidth + 'px');
      }
    });
  } else {
    sel.onchange = loadClients;
  }
}

// ── ddlSrchCustomers_SelectedIndexChanged → BindCustomerGrid() ──
// ASPX: SP SelectClientForAssign(@fSenderID, @fStaffID)
// Returns: CID, CustomerName, IsAssigned
async function loadClients() {
  const staffID = document.getElementById('ddlSrchCustomers').value;
  const tbody = document.getElementById('clientBody');
  tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;padding:16px;color:#888;">Loading...</td></tr>';
  _allClients = [];

  if (!staffID) {
    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;padding:16px;color:#888;">Select a sub user to load clients</td></tr>';
    updateHeaderCheckbox();
    return;
  }

  const r = await API.get(`/api/admin/assigned-clients?staffID=${staffID}`);
  if (!r?.success || !r.data?.length) {
    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;padding:16px;color:#888;">No clients found</td></tr>';
    updateHeaderCheckbox();
    return;
  }

  _allClients = r.data;
  renderClients(_allClients);

  const searchVal = document.getElementById('txtSearchCust')?.value || '';
  if (searchVal.trim()) {
    filterClients();
  } else {
    updateHeaderCheckbox();
  }
}

function renderClients(data) {
  const tbody = document.getElementById('clientBody');
  tbody.innerHTML = data.map((c, i) => `
    <tr data-cid="${c.CID}" data-name="${String(c.CustomerName || c.CID || '').toLowerCase()}">
      <td style="text-align:center;width:70px;">${i + 1}</td>
      <td style="text-align:center;width:130px;">
        <input type="checkbox" class="client-chk" value="${c.CID}" ${c.IsAssigned ? 'checked' : ''} onchange="onClientCheckChange()" style="cursor:pointer;width:16px;height:16px;margin:0;vertical-align:middle;">
      </td>
      <td style="text-align:left;padding-left:16px;">${c.CustomerName || c.CID}</td>
    </tr>`).join('');
}

// ── filterClients() — Live search by CustomerName ──
function filterClients() {
  const inp = document.getElementById('txtSearchCust');
  const clearBtn = document.getElementById('btnClearSearch');
  const query = (inp?.value || '').trim().toLowerCase();

  if (clearBtn) {
    clearBtn.style.display = query ? 'block' : 'none';
  }

  const rows = document.querySelectorAll('#clientBody tr[data-cid]');
  let visibleIndex = 0;
  rows.forEach(tr => {
    const name = tr.getAttribute('data-name') || '';
    if (!query || name.includes(query)) {
      tr.style.display = '';
      visibleIndex++;
      const snoCell = tr.cells[0];
      if (snoCell) snoCell.textContent = visibleIndex;
    } else {
      tr.style.display = 'none';
    }
  });

  let noMatchRow = document.getElementById('noMatchRow');
  if (visibleIndex === 0 && rows.length > 0) {
    if (!noMatchRow) {
      noMatchRow = document.createElement('tr');
      noMatchRow.id = 'noMatchRow';
      noMatchRow.innerHTML = '<td colspan="3" style="text-align:center;padding:16px;color:#888;">No matching customer found</td>';
      document.getElementById('clientBody').appendChild(noMatchRow);
    }
    noMatchRow.style.display = '';
  } else if (noMatchRow) {
    noMatchRow.style.display = 'none';
  }

  updateHeaderCheckbox();
}

function clearSearch() {
  const inp = document.getElementById('txtSearchCust');
  if (inp) {
    inp.value = '';
    filterClients();
    inp.focus();
  }
}

// ── checkAll() — header checkbox → check/uncheck visible rows ──
function checkAll(headerChk) {
  const isChecked = headerChk.checked;
  const rows = document.querySelectorAll('#clientBody tr[data-cid]');
  rows.forEach(tr => {
    if (tr.style.display !== 'none') {
      const chk = tr.querySelector('.client-chk');
      if (chk) chk.checked = isChecked;
    }
  });
  updateHeaderCheckbox();
}

function onClientCheckChange() {
  updateHeaderCheckbox();
}

function updateHeaderCheckbox() {
  const headerChk = document.getElementById('chkAll');
  if (!headerChk) return;
  const visibleCheckboxes = Array.from(document.querySelectorAll('#clientBody tr[data-cid]'))
    .filter(tr => tr.style.display !== 'none')
    .map(tr => tr.querySelector('.client-chk'))
    .filter(Boolean);

  if (visibleCheckboxes.length === 0) {
    headerChk.checked = false;
  } else {
    headerChk.checked = visibleCheckboxes.every(chk => chk.checked);
  }
}

// ── GetSelectedRowValue → SaveCopyMessage → POST /api/admin/assign-clients ──
async function saveAssignments() {
  const staffID = document.getElementById('ddlSrchCustomers').value;
  if (!staffID) { showToast('Select Sub user first!', true); return; }

  // Collect all checked CIDs (including rows currently hidden by search filter)
  const checkedBoxes = document.querySelectorAll('#clientBody .client-chk:checked');
  const customerIDs = [];
  checkedBoxes.forEach(chk => {
    const cid = (chk.value || '').trim();
    if (cid) customerIDs.push(cid);
  });

  try {
    const r = await API.post('/api/admin/assign-clients', { staffID, customerIDs });
    if (r?.success) {
      showToast('Data Update Successfully!');
      await loadClients();
    } else {
      showToast('Something Wrong', true);
    }
  } catch(e) {
    showToast('Something Wrong', true);
  }
}

// ── SweetAlert-based feedback (matches original ASPX SucessMessage1/ErrorMessage) ──
function showToast(msg, err=false) {
  swal(err ? 'Wrong Inputs!' : 'Sucess!', msg, {
    icon: err ? 'error' : 'success',
    timer: 900,
    buttons: false
  });
}

init();
</script>
</body>
</html>
