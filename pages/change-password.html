<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Susu9 - Change Password</title>
<script src="/js/theme-preload.js"></script>
<link rel="stylesheet" href="/css/main.css">
<style>
/* Bolder, higher-contrast text — visual only, no behavior change */
.content .form-group label{font-weight:800!important;color:var(--text)!important;font-size:.8rem!important;margin-bottom:5px!important;display:block;}
.content .card-title{font-weight:800!important;color:var(--text)!important;font-size:1.15rem!important;}
.content .form-control{font-weight:700!important;color:var(--text)!important;background:#fff!important;border:1px solid #888!important;padding:.55rem .8rem!important;height:auto!important;font-size:.92rem!important;border-radius:6px!important;}
.content .form-control:focus{border-color:var(--green)!important;box-shadow:0 0 0 3px rgba(18,140,126,.12)!important;}
/* Well-structured centered card */
.content .card{box-shadow:0 4px 20px rgba(0,0,0,.06);border-radius:12px;}
.content .card-header{padding:16px 24px!important;}
.content .card-body{padding:20px 24px 8px!important;}
.content .card-action{padding:16px 24px 22px!important;}
.content .form-group{margin-bottom:18px!important;}
.content .btn-success{width:100%;padding:.6rem!important;font-size:.95rem!important;font-weight:700!important;border-radius:6px!important;}
/* Vendor theme reserves 62px above .content for a second header row this
   app doesn't render — page-scoped so it doesn't affect other pages. */
.main-panel>.content{margin-top:50px!important;padding-top:24px!important;}
</style>
</head>
<body>

<div class="content">
  <div class="row">
    <div class="col-md-12">
      <div class="card" style="max-width:420px;margin:0 auto;">
        <div class="card-header">
          <div class="card-title">Change Password</div>
        </div>
        <div class="card-body">
          <div class="form-group">
            <label for="oldPwd">Current Password</label>
            <input type="password" class="form-control" id="oldPwd" placeholder="Enter current password">
          </div>
          <div class="form-group">
            <label for="newPwd">New Password</label>
            <input type="password" class="form-control" id="newPwd" placeholder="Enter new password">
          </div>
          <div class="form-group">
            <label for="confPwd">Confirm Password</label>
            <input type="password" class="form-control" id="confPwd" placeholder="Confirm new password">
          </div>
        </div>
        <div class="card-action">
          <button class="btn btn-success" onclick="changePwd()">Submit</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script>
async function init() { await initPage('change-password'); }
async function changePwd() {
  const old = document.getElementById('oldPwd').value;
  const np = document.getElementById('newPwd').value;
  const cp = document.getElementById('confPwd').value;
  if (!old || !np || !cp) { toast('All fields required', 'err'); return; }
  if (np !== cp) { toast('New passwords do not match', 'err'); return; }
  if (np.length < 4) { toast('Password too short', 'err'); return; }
  const r = await API.post('/api/admin/change-password', { oldPassword: old, newPassword: np });
  if (r?.success) { toast('Password changed!'); document.getElementById('oldPwd').value = ''; document.getElementById('newPwd').value = ''; document.getElementById('confPwd').value = ''; }
  else toast(r?.message || 'Error', 'err');
}
function toast(msg, kind) {
  swal(kind==='err' ? 'Wrong Inputs!' : 'Sucess!', msg, {
    icon: kind==='err' ? 'error' : 'success',
    timer: 900,
    buttons: false
  });
}
init();
</script>
</body>
</html>
